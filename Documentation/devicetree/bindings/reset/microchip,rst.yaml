%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/microchip,rst.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip Sparx5 Switch Reset Controller

maintainers:
  - Steen Hegelund <steen.hegelund@microchip.com>
  - Lars Povlsen <lars.povlsen@microchip.com>

description: |
  The Microchip Sparx5 Switch provides reset control and implements the following
  functions
    - One Time Switch Core Reset (Soft Reset)

properties:
  $nodename:
    pattern: "^reset-controller@[0-9a-f]+$"

  compatible:
    enum:
      - microchip,sparx5-switch-reset
      - microchip,lan966x-switch-reset

  reg:
    minItems: 1
    items:
      - description: global control block registers
      - description: cpu system block registers

  reg-names:
    minItems: 1
    items:
      - const: gcb
      - const: cpu

  "#reset-cells":
    const: 1

  cpu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: syscon used to access CPU reset

allOf:
  # Allow to use the second reg item instead of cpu-syscon
  - if:
      required:
        - cpu-syscon
    then:
      properties:
        reg:
          maxItems: 1
        reg-names:
          maxItems: 1
    else:
      properties:
        reg:
          minItems: 2
        reg-names:
          minItems: 2

required:
  - compatible
  - reg
  - reg-names
  - "#reset-cells"

additionalProperties: false

examples:
  - |
    reset: reset-controller@11010008 {
        compatible = "microchip,sparx5-switch-reset";
        reg = <0x11010008 0x4>;
        reg-names = "gcb";
        #reset-cells = <1>;
        cpu-syscon = <&cpu_ctrl>;
    };

    /*
     * The following construction can be used if the cpu-syscon device is not
     * present. This is the case when the LAN966x is used as a PCI device.
     */
    reset-controller@22010008 {
        compatible = "microchip,lan966x-switch-reset";
        reg = <0xe200400c 0x4>,
              <0xe00c0000 0xa8>;
        reg-names = "gcb", "cpu";
        #reset-cells = <1>;
    };
