%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/thead,th1520-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: T-HEAD TH1520 SoC Reset Controller

description:
  The T-HEAD TH1520 reset controller is a hardware block that asserts/deasserts
  resets for SoC subsystems.

maintainers:
  - Michal Wilczynski <m.wilczynski@samsung.com>

properties:
  compatible:
    oneOf:
      - enum:
          - thead,th1520-reset-vo
      - const: thead,th1520-reset
        deprecated: true

  reg:
    maxItems: 1

  "#reset-cells":
    const: 1

required:
  - compatible
  - reg
  - "#reset-cells"

additionalProperties: false

examples:
  - |
    reset-controller@ffef528000 {
        compatible = "thead,th1520-reset-vo";
        reg = <0xef528000 0x1000>;
        #reset-cells = <1>;
    };
