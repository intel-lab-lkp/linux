%YAML 1.2
---
$id: http://devicetree.org/schemas/perf/marvell-cn10k-tad.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Marvell CN10K / CN20K LLC-TAD performance monitor

maintainers:
  - Bhaskara Budiredla <bbudiredla@marvell.com>
  - Geetha sowjanya <gakula@marvell.com>

description: |
  The Tag-and-Data units (TADs) maintain coherence and contain the
  shared on-chip last level cache (LLC) on Marvell CN10K and CN20K SoCs.
  The TAD PMU measures last-level cache performance. Each TAD PMU
  supports up to eight counters.

  The DT setup describes the number of TAD blocks, the sizes of PMU
  regions and TAD pages, and the overall MMIO base of the hardware.

properties:
  compatible:
    items:
      - enum:
          - marvell,cn10k-tad-pmu
          - marvell,cn20k-tad-pmu

  reg:
    maxItems: 1

  marvell,tad-cnt:
    description: specifies the number of tads on the soc
    $ref: /schemas/types.yaml#/definitions/uint32

  marvell,tad-page-size:
    description: specifies the size of each tad page
    $ref: /schemas/types.yaml#/definitions/uint32

  marvell,tad-pmu-page-size:
    description: specifies the size of page that the pmu uses
    $ref: /schemas/types.yaml#/definitions/uint32

required:
  - compatible
  - reg
  - marvell,tad-cnt
  - marvell,tad-page-size
  - marvell,tad-pmu-page-size

additionalProperties: false

examples:
  - |

    tad {
        #address-cells = <2>;
        #size-cells = <2>;

        tad_pmu@80000000 {
            compatible = "marvell,cn10k-tad-pmu";
            reg = <0x87e2 0x80000000 0x0 0x1000>;
            marvell,tad-cnt = <1>;
            marvell,tad-page-size = <0x1000>;
            marvell,tad-pmu-page-size = <0x1000>;
        };
    };
