%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/omap/ti,omap-l3-noc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI OMAP L3 Network On Chip (NoC) Interconnect

maintainers:
  - Santosh Shilimkar <santosh.shilimkar@ti.com>
  - Sricharan R <r.sricharan@ti.com>

description:
  The L3 interconnect is an implementation of the generic NoC IP provided by
  Arteris. OMAP3 uses the SMX variant while OMAP4/5, DRA7, and AM4372 use the
  NoC variant.

properties:
  compatible:
    oneOf:
      - items:
          - const: ti,omap3-l3-smx
          - const: simple-bus
      - enum:
          - ti,omap4-l3-noc
          - ti,omap5-l3-noc
          - ti,dra7-l3-noc
          - ti,am4372-l3-noc

  reg:
    minItems: 1
    maxItems: 3

  interrupts:
    minItems: 2
    maxItems: 2

  ti,hwmods:
    description: hwmod names for each NoC domain.
    $ref: /schemas/types.yaml#/definitions/string-array
    deprecated: true

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges: true

patternProperties:
  "^(.*@[0-9a-fA-F]+|regulator-abb-mpu)$":
    type: object

required:
  - compatible
  - reg
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: ti,omap3-l3-smx
    then:
      properties:
        reg:
          maxItems: 1
        ti,hwmods:
          maxItems: 1
      required:
        - "#address-cells"
        - "#size-cells"
        - ranges

  - if:
      properties:
        compatible:
          contains:
            enum:
              - ti,omap4-l3-noc
              - ti,omap5-l3-noc
    then:
      properties:
        reg:
          minItems: 3
        "#address-cells": false
        "#size-cells": false
        ranges: false
      patternProperties:
        "^(.*@[0-9a-fA-F]+|regulator-abb-mpu)$": false

  - if:
      properties:
        compatible:
          contains:
            const: ti,dra7-l3-noc
    then:
      properties:
        reg:
          minItems: 2
          maxItems: 3
        "#address-cells": false
        "#size-cells": false
        ranges: false
      patternProperties:
        "^(.*@[0-9a-fA-F]+|regulator-abb-mpu)$": false

  - if:
      properties:
        compatible:
          contains:
            const: ti,am4372-l3-noc
    then:
      properties:
        reg:
          minItems: 2
          maxItems: 2
        "#address-cells": false
        "#size-cells": false
        ranges: false
      patternProperties:
        "^(.*@[0-9a-fA-F]+|regulator-abb-mpu)$": false

additionalProperties: false

examples:
  - |
    l3-noc@68000000 {
        compatible = "ti,omap3-l3-smx", "simple-bus";
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;
        reg = <0x68000000 0x10000>;
        interrupts = <9>, <10>;
        ti,hwmods = "l3_main";
    };

  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    l3-noc@44000000 {
        compatible = "ti,omap4-l3-noc";
        reg = <0x44000000 0x1000>,
              <0x44800000 0x2000>,
              <0x45000000 0x1000>;
        interrupts = <GIC_SPI 9 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 10 IRQ_TYPE_LEVEL_HIGH>;
    };
