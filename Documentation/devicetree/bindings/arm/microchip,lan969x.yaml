maintainers:
  - Robert Marko <robert.marko@sartura.hr>

description: |+
   The Microchip LAN969x SoC is a ARMv8-based used in a family of
   multi-port, multi-gigabit switches.

properties:
  $nodename:
    const: '/'
  compatible:
    oneOf:
      - description: The LAN969x EVB (EV23X71A) is a 24x 1G + 4x 10G
