%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/qcom,coresight-csr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: CoreSight Slave Register

maintainers:
  - Yuanfang Zhang <quic_yuanfang@quicinc.com>
  - Mao Jinlong <quic_jinlmao@quicinc.com>
  - Jie Gan <quic_jiegan@quicinc.com>

description:
  The Coresight Slave Register controls various Coresight behaviors.
  Used to enable/disable ETR’s data filter function based on trace ID.

properties:
  compatible:
    const: qcom,coresight-csr

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    maxItems: 1
    items:
      - const: apb_pclk

  reg-names:
    items:
      - const: csr-base

  in-ports:
    $ref: /schemas/graph.yaml#/properties/ports

    patternProperties:
      '^port(@[0-7])?$':
        description: Input connections from CoreSight Trace bus
        $ref: /schemas/graph.yaml#/properties/port

required:
  - compatible
  - reg
  - in-ports

additionalProperties: false

examples:
  - |
    syscon@10001000 {
        compatible = "qcom,coresight-csr";
        reg = <0x0 0x10001000 0x0 0x1000>;
        reg-names = "csr-base";

        in-ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                csr_in_port0: endpoint {
                    remote-endpoint = <&etr0_out_port>;
                };
            };

            port@1 {
                reg = <1>;
                csr_in_port1: endpoint {
                    remote-endpoint = <&etr1_out_port>;
                };
            };
        };
