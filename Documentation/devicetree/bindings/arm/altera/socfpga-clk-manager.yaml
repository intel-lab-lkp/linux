%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/altera/socfpga-clk-manager.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Altera SOCFPGA Clock Manager

maintainers:
  - Dinh Nguyen <dinguyen@kernel.org>

description:
  This binding describes the Altera SOCFGPA Clock Manager and its associated
  tree of clocks, pll's, and clock gates for the Cyclone5, Arria5 and Arria10
  chip families.

properties:
  compatible:
    items:
      - const: altr,clk-mgr

  reg:
    maxItems: 1

  clocks:
    type: object
    additionalProperties: false

    properties:
      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

    patternProperties:
      "^osc[0-9]$":
        type: object

      "^[a-z0-9,_]+(clk|pll|clk_gate|clk_divided)(@[a-f0-9]+)?$":
        type: object
        additionalProperties: false

        properties:

          compatible:
            enum:
              - altr,socfpga-pll-clock
              - altr,socfpga-perip-clk
              - altr,socfpga-gate-clk
              - altr,socfpga-a10-pll-clock
              - altr,socfpga-a10-perip-clk
              - altr,socfpga-a10-gate-clk
              - fixed-clock

          reg:
            maxItems: 1

          clocks:
            description: one or more phandles to input clock
            minItems: 1
            maxItems: 5

          "#address-cells":
            const: 1

          "#clock-cells":
            const: 0

          "#size-cells":
            const: 0

          clk-gate:
            $ref: '#/$defs/clk-gate'
            unevaluatedProperties: false

          div-reg:
            $ref: '#/$defs/div-reg'
            unevaluatedProperties: false

          fixed-divider:
            $ref: '#/$defs/fixed-divider'
            unevaluatedProperties: false

        patternProperties:
          "^[a-z0-9,_]+(clk|pll)(@[a-f0-9]+)?$":
            type: object
            additionalProperties: false

            properties:
              compatible:
                enum:
                  - altr,socfpga-perip-clk
                  - altr,socfpga-gate-clk
                  - altr,socfpga-a10-perip-clk
                  - altr,socfpga-a10-gate-clk

              reg:
                maxItems: 1

              "#clock-cells":
                const: 0

              clocks:
                description: one or more phandles to input clock
                minItems: 1
                maxItems: 4

              clk-gate:
                $ref: '#/$defs/clk-gate'
                unevaluatedProperties: false

              div-reg:
                $ref: '#/$defs/div-reg'
                unevaluatedProperties: false

              fixed-divider:
                $ref: '#/$defs/fixed-divider'
                unevaluatedProperties: false

            required:
              - compatible
              - clocks
              - "#clock-cells"

        required:
          - compatible
          - "#clock-cells"

required:
  - compatible
  - reg

additionalProperties: false

$defs:
  clk-gate:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    items:
      - description: gating register offset
      - description: bit index

  div-reg:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    items:
      - description: divider register offset
      - description: bit shift
      - description: bit width

  fixed-divider:
    $ref: /schemas/types.yaml#/definitions/uint32

examples:
  - |
    clkmgr@ffd04000 {
      compatible = "altr,clk-mgr";
      reg = <0xffd04000 0x1000>;
    };

...
