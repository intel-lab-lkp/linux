%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/rockchip,emmc-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip EMMC PHY

maintainers:
  - Shresth Prasad <shresthprasad7@gmail.com>

properties:
  "#phy-cells":
    const: 0

  compatible:
    const: rockchip,rk3399-emmc-phy

  reg:
    description:
      PHY register address offset and length in "general register files"
    maxItems: 1

  clock-names:
    description: |
      Although this is not a required property (because most boards can get
      basic functionality without having access to it), it is strongly
      suggested.
    const: emmcclk

  clocks:
    description:
      Should have a phandle to the card clock exported by the SDHCI driver.
    maxItems: 1

  drive-impedance-ohm:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Specifies the drive impedance in Ohm.
    enum: [33, 40, 50, 66, 100]
    default: 50

  rockchip,enable-strobe-pulldown:
    type: boolean
    description: |
      Enable internal pull-down for the strobe
      line.  If not set, pull-down is not used.

  rockchip,output-tapdelay-select:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Specifies the phyctrl_otapdlysec register.
    default: 0x4
    maximum: 0xf

required:
  - "#phy-cells"
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    grf: syscon@ff770000 {
      compatible = "rockchip,rk3399-grf", "syscon", "simple-mfd";
      reg = <0x0 0xff770000 0x0 0x10000>;
      #address-cells = <1>;
      #size-cells = <1>;

      emmcphy: phy@f780 {
        #phy-cells = <0>;
        compatible = "rockchip,rk3399-emmc-phy";
        reg = <0xf780 0x20>;
        clocks = <&sdhci>;
        clock-names = "emmcclk";
        drive-impedance-ohm = <50>;
      };
    };
