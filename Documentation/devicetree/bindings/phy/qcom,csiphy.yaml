%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/qcom,csiphy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm CSI PHY

maintainers:
  - Vladimir Zapolskiy <vladimir.zapolskiy@linaro.org>

description: |
  Qualcomm SoCs equipped with a number of MIPI CSI PHY IPs, which
  supports D-PHY or C-PHY interfaces to camera sensors.

properties:
  compatible:
    enum:
      - qcom,sm8250-csiphy

  reg:
    maxItems: 1

  clocks:
    maxItems: 2

  interrupts:
    maxItems: 1

  vdda-csi-0p9-supply:
    description: Voltage supply, 0.9V

  vdda-csi-1p2-supply:
    description: Voltage supply, 1.2V

  '#phy-cells':
    const: 0

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    description: CAMSS CSIPHY input port

    patternProperties:
      "^endpoint@[0-1]$":
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 1
            maxItems: 4

          bus-type:
            enum:
              - 1 # MEDIA_BUS_TYPE_CSI2_CPHY
              - 4 # MEDIA_BUS_TYPE_CSI2_DPHY

        required:
          - data-lanes

    oneOf:
      - required:
          - endpoint
      - required:
          - endpoint@0

required:
  - compatible
  - reg
  - clocks
  - interrupts
  - '#phy-cells'

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,sm8250-csiphy
    then:
      required:
        - vdda-csi-0p9-supply
        - vdda-csi-1p2-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,camcc-sm8250.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    phy@ac6e000 {
      compatible = "qcom,sm8250-csiphy";
      reg = <0x0ac6e000 0x1000>;
      clocks = <&camcc CAM_CC_CSIPHY2_CLK>,
               <&camcc CAM_CC_CSI2PHYTIMER_CLK>;
      interrupts = <GIC_SPI 479 IRQ_TYPE_EDGE_RISING>;
      vdda-csi-0p9-supply = <&vreg_l5a_0p88>;
      vdda-csi-1p2-supply = <&vreg_l9a_1p2>;
      #phy-cells = <0>;

      port {
        csiphy_in: endpoint {
          data-lanes = <1 2 3 4>;
          remote-endpoint = <&sensor_out>;
        };
      };
    };
