%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/samsung,exynos-pcie-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung SoC series PCIe PHY

maintainers:
  - Marek Szyprowski <m.szyprowski@samsung.com>
  - Jaehoon Chung <jh80.chung@samsung.com>

properties:
  "#phy-cells":
    const: 0

  compatible:
    enum:
      - samsung,exynos5433-pcie-phy
      - tesla,fsd-pcie-phy

  reg:
    minItems: 1
    maxItems: 2

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle for PMU system controller interface, used to
                 control PMU registers bits for PCIe PHY

  samsung,fsys-sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle for FSYS sysreg interface, used to control
                 sysreg registers bits for PCIe PHY

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - tesla,fsd-pcie-phy
    then:
      description:
        The PHY controller nodes are represented in the aliases node
        using the following format 'pciephy{n}'. Depending on whether
        n is 0 or 1, the phy init sequence is chosen.
      properties:
        reg:
          items:
            - description: PHY
            - description: PCS

required:
  - "#phy-cells"
  - compatible
  - reg
  - samsung,pmu-syscon
  - samsung,fsys-sysreg

additionalProperties: false

examples:
  - |
    pcie_phy: pcie-phy@15680000 {
        compatible = "samsung,exynos5433-pcie-phy";
        reg = <0x15680000 0x1000>;
        samsung,pmu-syscon = <&pmu_system_controller>;
        samsung,fsys-sysreg = <&syscon_fsys>;
        #phy-cells = <0>;
    };
...
