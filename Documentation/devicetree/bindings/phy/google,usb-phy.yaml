%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/google,usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google USB PHY

maintainers:
  - Roy Luo <royluo@google.com>

description:
  Describes the USB PHY block on Google Tensor SoCs.

properties:
  compatible:
    items:
      - enum:
          - google,lga-usb-phy
      - const: google,usb-phy

  reg:
    minItems: 3
    maxItems: 3

  reg-names:
    items:
      - const: usb2_cfg_csr
      - const: dp_top_csr
      - const: usb_top_cfg_csr

  "#phy-cells":
    const: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: usb2_phy_clk

  resets:
    maxItems: 1

  reset-names:
    items:
      - const: usb2_phy_reset

  power-domains:
    maxItems: 1

  orientation-switch:
    type: boolean
    description:
      Indicates the PHY as a handler of USB Type-C orientation changes

required:
  - compatible
  - reg
  - reg-names
  - "#phy-cells"
  - clocks
  - clock-names
  - resets
  - reset-names

unevaluatedProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        usb_phy: usb_phy@c410000 {
            compatible = "google,lga-usb-phy", "google,usb-phy";
            reg = <0 0x0c450014 0 0xc>,
                  <0 0x0c637000 0 0xa0>,
                  <0 0x0c45002c 0 0x4>;
            reg-names = "usb2_cfg_csr", "dp_top_csr", "usb_top_cfg_csr";
            #phy-cells = <1>;
            clocks = <&hsion_usb2_phy_reset_clk>;
            clock-names = "usb2_phy_clk";
            resets = <&hsion_resets_usb2_phy>;
            reset-names = "usb2_phy_reset";
            power-domains = <&hsio_n_usb_pd>;
            orientation-switch;
        };
    };
...
