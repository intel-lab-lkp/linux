%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/google,gs5-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor Series (G5+) USB PHY

maintainers:
  - Roy Luo <royluo@google.com>

description: |
  Describes the USB PHY interfaces integrated with the DWC3 USB controller on
  Google Tensor SoCs, starting with the G5 generation.
  Two specific PHY IPs from Synopsys are integrated, including eUSB 2.0 PHY IP
  and USB 3.2/DisplayPort combo PHY IP.
  The hardware can support three PHY interfaces, which are selected using the
  first phandle argument in the PHY specifier::
    0 - USB high-speed.
    1 - USB super-speed.
    2 - DisplayPort

properties:
  compatible:
    const: google,gs5-usb-phy

  reg:
    items:
      - description: USB2 PHY configuration registers.
      - description: DisplayPort top-level registers.
      - description: USB top-level configuration registers.

  reg-names:
    items:
      - const: u2phy_cfg
      - const: dp_top
      - const: usb_top_cfg

  "#phy-cells":
    const: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  power-domains:
    maxItems: 1

  orientation-switch:
    type: boolean
    description:
      Indicates the PHY as a handler of USB Type-C orientation changes

required:
  - compatible
  - reg
  - reg-names
  - "#phy-cells"
  - clocks
  - resets
  - power-domains
  - orientation-switch

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        usb_phy: usb_phy@c410000 {
            compatible = "google,gs5-usb-phy";
            reg = <0 0x0c450014 0 0xc>,
                  <0 0x0c637000 0 0xa0>,
                  <0 0x0c45002c 0 0x4>;
            reg-names = "u2phy_cfg", "dp_top", "usb_top_cfg";
            #phy-cells = <1>;
            clocks = <&hsion_usb2_phy_reset_clk>;
            resets = <&hsion_resets_usb2_phy>;
            power-domains = <&hsio_n_usb_pd>;
            orientation-switch;
        };
    };
...
