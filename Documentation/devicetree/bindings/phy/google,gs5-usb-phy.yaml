%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/google,gs5-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor Series (G5+) USB PHY

maintainers:
  - Roy Luo <royluo@google.com>

description: |
  Describes the USB PHY interfaces integrated with the DWC3 USB controller on
  Google Tensor SoCs, starting with the G5 generation.
  Two specific PHY IPs from Synopsys are integrated, including eUSB 2.0 PHY IP
  and USB 3.2/DisplayPort combo PHY IP.
  The hardware can support three PHY interfaces, which are selected using the
  first phandle argument in the PHY specifier::
    0 - USB high-speed.
    1 - USB super-speed.
    2 - DisplayPort

properties:
  compatible:
    const: google,gs5-usb-phy

  reg:
    items:
      - description: USB2 PHY configuration registers.
      - description: USB 3.2/DisplayPort combo PHY top-level registers.

  reg-names:
    items:
      - const: u2phy_cfg
      - const: dp_top

  "#phy-cells":
    const: 1

  clocks:
    items:
      - description: USB2 PHY clock.
      - description: USB2 PHY APB clock.

  clock-names:
    items:
      - const: usb2_phy
      - const: u2phy_apb

  resets:
    items:
      - description: USB2 PHY reset.
      - description: USB2 PHY APB reset.

  reset-names:
    items:
      - const: usb2_phy
      - const: u2phy_apb

  power-domains:
    maxItems: 1

  orientation-switch:
    type: boolean
    description:
      Indicates the PHY as a handler of USB Type-C orientation changes

required:
  - compatible
  - reg
  - reg-names
  - "#phy-cells"
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - orientation-switch

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        usb_phy: usb_phy@c450014 {
            compatible = "google,gs5-usb-phy";
            reg = <0 0x0c450014 0 0xc>,
                  <0 0x0c637000 0 0xa0>;
            reg-names = "u2phy_cfg", "dp_top";
            #phy-cells = <1>;
            clocks = <&hsion_usb2_phy_clk>, <&hsion_u2phy_apb_clk>;
            clock-names = "usb2_phy", "u2phy_apb";
            resets = <&hsion_resets_usb2_phy>,
                     <&hsion_resets_u2phy_apb>;
            reset-names = "usb2_phy", "u2phy_apb";
            power-domains = <&hsio_n_usb_pd>;
            orientation-switch;
        };
    };
...
