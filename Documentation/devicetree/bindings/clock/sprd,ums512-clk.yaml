%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sprd,ums512-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: UMS512 Soc clock controller

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>
  - Chunyan Zhang <zhang.lyra@gmail.com>

properties:
  compatible:
    enum:
      - sprd,ums512-apahb-gate
      - sprd,ums512-ap-clk
      - sprd,ums512-aonapb-clk
      - sprd,ums512-pmu-gate
      - sprd,ums512-g0-pll
      - sprd,ums512-g2-pll
      - sprd,ums512-g3-pll
      - sprd,ums512-gc-pll
      - sprd,ums512-aon-gate
      - sprd,ums512-audcpapb-gate
      - sprd,ums512-audcpahb-gate
      - sprd,ums512-gpu-clk
      - sprd,ums512-mm-clk
      - sprd,ums512-mm-gate-clk
      - sprd,ums512-apapb-gate
      - sprd,ums9620-pmu-gate
      - sprd,ums9620-g1-pll
      - sprd,ums9620-g5l-pll
      - sprd,ums9620-g5r-pll
      - sprd,ums9620-g8-pll
      - sprd,ums9620-g9-pll
      - sprd,ums9620-g10-pll
      - sprd,ums9620-apapb-gate
      - sprd,ums9620-ap-clk
      - sprd,ums9620-apahb-gate
      - sprd,ums9620-aon-gate
      - sprd,ums9620-aonapb-clk
      - sprd,ums9620-topdvfs-clk
      - sprd,ums9620-ipaapb-gate
      - sprd,ums9620-ipa-clk
      - sprd,ums9620-ipaglb-gate
      - sprd,ums9620-ipadispc-gate
      - sprd,ums9620-pcieapb-gate
      - sprd,ums9620-pcie-clk
      - sprd,ums9620-mm-gate
      - sprd,ums9620-mm-clk
      - sprd,ums9620-dpu-vsp-gate
      - sprd,ums9620-dpu-vsp-clk

  "#clock-cells":
    const: 1

  clocks:
    description: |
      The input parent clock(s) phandle for the clock, only list
      fixed clocks which are declared in devicetree.

  reg:
    maxItems: 1

required:
  - compatible
  - '#clock-cells'
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            pattern: "^sprd,ums512-.*"

    then:
      properties:
        clocks:
          minItems: 1
          maxItems: 4

        clock-names:
          minItems: 1
          items:
            - const: ext-26m
            - const: ext-32k
            - const: ext-4m
            - const: rco-100m

  - if:
      properties:
        compatible:
          contains:
            pattern: "^sprd,ums9620-.*"
    then:
      properties:
        clocks:
          minItems: 1
          maxItems: 6

        clock-names:
          minItems: 1
          maxItems: 6

unevaluatedProperties: false

examples:
  - |
    ap_clk: clock-controller@20200000 {
      compatible = "sprd,ums512-ap-clk";
      reg = <0x20200000 0x1000>;
      clocks = <&ext_26m>;
      clock-names = "ext-26m";
      #clock-cells = <1>;
    };

    aonapb_gate: clock-controller@0 {
      compatible = "sprd,ums9620-aon-gate";
      reg = <0x0 0x3000>;
      clocks = <&ext_26m>, <&ext_32k>, <&rco_60m>;
      clock-names = "ext-26m", "ext-32k", "rco-60m";
      #clock-cells = <1>;
    };
...
