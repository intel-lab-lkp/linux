%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/fsl,imx8m-anatop.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP i.MX8M Family Anatop Module

maintainers:
  - Peng Fan <peng.fan@nxp.com>

description: |
  NXP i.MX8M Family anatop PLL module which generates PLL to CCM root.

properties:
  compatible:
    oneOf:
      - enum:
          - fsl,imx8mm-anatop
          - fsl,imx8mq-anatop
      - items:
          - enum:
              - fsl,imx8mn-anatop
              - fsl,imx8mp-anatop
          - const: fsl,imx8mm-anatop

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  '#clock-cells':
    const: 1

  fsl,ssc-clocks:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      List of phandle and clock specifier pairs of PLLs with spread
      spectrum generation hardware capability.
    maxItems: 4

  fsl,ssc-modfreq-hz:
    description:
      The values of modulation frequency (Hz unit) of spread spectrum
      clocking for each PLL.
    maxItems: 4

  fsl,ssc-modrate-percent:
    description:
      The percentage values of modulation rate of spread spectrum
      clocking for each PLL.
    maxItems: 4

  fsl,ssc-modmethod:
    $ref: /schemas/types.yaml#/definitions/string-array
    description:
      The modulation techniques of spread spectrum clocking for
      each PLL.
    oneOf:
      - enum:
          - down-spread
          - up-spread
          - center-spread
    maxItems: 4

required:
  - compatible
  - reg
  - '#clock-cells'

allOf:
  - if:
      not:
        properties:
          compatible:
            contains:
              const: fsl,imx8mm-anatop
    then:
      properties:
        fsl,ssc-clocks: false
        fsl,ssc-modfreq-hz: false
        fsl,ssc-modrate-percent: false
        fsl,ssc-modmethod: false

additionalProperties: false

examples:
  - |
    anatop: clock-controller@30360000 {
        compatible = "fsl,imx8mn-anatop", "fsl,imx8mm-anatop";
        reg = <0x30360000 0x10000>;
        #clock-cells = <1>;
    };

...
