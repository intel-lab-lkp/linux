%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/fsl,imx8m-anatop.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP i.MX8M Family Anatop Module

maintainers:
  - Peng Fan <peng.fan@nxp.com>

description: |
  NXP i.MX8M Family anatop PLL module which generates PLL to CCM root.

properties:
  compatible:
    oneOf:
      - enum:
          - fsl,imx8mm-anatop
          - fsl,imx8mq-anatop
      - items:
          - enum:
              - fsl,imx8mn-anatop
              - fsl,imx8mp-anatop
          - const: fsl,imx8mm-anatop

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  '#clock-cells':
    const: 1
if:
  properties:
    compatible:
      contains:
        enum:
          - fsl,imx8mm-anatop

then:
  properties:
    fsl,ssc-clocks:
      $ref: /schemas/types.yaml#/definitions/phandle-array
      description:
        The phandles to the PLLs with spread spectrum clock generation
        hardware capability.
      maxItems: 4

    fsl,ssc-modfreq-hz:
      $ref: /schemas/types.yaml#/definitions/uint32-array
      description:
        The values of modulation frequency (Hz unit) of spread spectrum
        clocking for each PLL.
      maxItems: 4

    fsl,ssc-modrate-percent:
      $ref: /schemas/types.yaml#/definitions/uint32-array
      description:
        The percentage values of modulation rate of spread spectrum
        clocking for each PLL.
      maxItems: 4

    fsl,ssc-modmethod:
      $ref: /schemas/types.yaml#/definitions/string-array
      description:
        The modulation techniques of spread spectrum clocking for
        each PLL.
      oneOf:
        - enum:
            - down-spread
            - up-spread
            - center-spread
      maxItems: 4

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    anatop: clock-controller@30360000 {
        compatible = "fsl,imx8mn-anatop", "fsl,imx8mm-anatop";
        reg = <0x30360000 0x10000>;
        #clock-cells = <1>;
    };

...
