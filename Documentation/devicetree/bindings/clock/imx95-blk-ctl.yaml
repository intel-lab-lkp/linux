%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/imx95-blk-ctl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP i.MX95 Block Control

maintainers:
  - Peng Fan <peng.fan@nxp.com>

properties:
  compatible:
    items:
      - enum:
          - nxp,imx95-cameramix-csr
          - nxp,imx95-display-master-csr
          - nxp,imx95-dispmix-lvds-csr
          - nxp,imx95-dispmix-csr
          - nxp,imx95-netcmix-blk-ctrl
          - nxp,imx95-vpumix-csr
      - const: syscon

  reg:
    maxItems: 1

  power-domains:
    maxItems: 1

  clocks:
    maxItems: 1

  '#clock-cells':
    const: 1
    description:
      The clock consumer should specify the desired clock by having the clock
      ID in its "clocks" phandle cell. See
      include/dt-bindings/clock/nxp,imx95-clock.h

  mux-controller:
    type: object
    $ref: /schemas/mux/reg-mux.yaml

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  # Clock Control Module node:
  - |
    #include <dt-bindings/clock/nxp,imx95-clock.h>

    syscon@4c410000 {
      compatible = "fsl,imx95-vpumix-blk-ctrl", "syscon";
      reg = <0x4c410000 0x10000>;
      #clock-cells = <1>;
    };
...
