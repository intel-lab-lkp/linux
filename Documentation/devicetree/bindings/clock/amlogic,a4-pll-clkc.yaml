%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/amlogic,a4-pll-clkc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic A4 series PLL Clock Controller

maintainers:
  - Neil Armstrong <neil.armstrong@linaro.org>
  - Jerome Brunet <jbrunet@baylibre.com>
  - Chuan Liu <chuan.liu@amlogic.com>
  - Xianwei Zhao <xianwei.zhao@amlogic.com>

properties:
  compatible:
    const: amlogic,a4-pll-clkc

  reg:
    maxItems: 1

  clocks:
    items:
      - description: input oscillator
      - description: input fix pll

  clock-names:
    items:
      - const: xtal
      - const: fix

  "#clock-cells":
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/amlogic,a4-scmi-clkc.h>
    apb {
        #address-cells = <2>;
        #size-cells = <2>;

        clock-controller@8000 {
            compatible = "amlogic,a4-pll-clkc";
            reg = <0x0 0x8000 0x0 0x110>;
            clocks = <&xtal>,
                     <&scmi_clk CLKID_FIXED_PLL>;
            clock-names = "xtal",
                          "fix";
            #clock-cells = <1>;
        };
    };
