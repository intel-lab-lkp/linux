%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/amlogic,a9-pll-clkc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic A9 Series PLL Clock Controller

maintainers:
  - Neil Armstrong <neil.armstrong@linaro.org>
  - Jerome Brunet <jbrunet@baylibre.com>
  - Jian Hu <jian.hu@amlogic.com>
  - Xianwei Zhao <xianwei.zhao@amlogic.com>

properties:
  compatible:
    enum:
      - amlogic,a9-gp0-pll
      - amlogic,a9-hifi0-pll
      - amlogic,a9-hifi1-pll
      - amlogic,a9-mclk0-pll
      - amlogic,a9-mclk1-pll

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  clocks:
    items:
      - description: pll input oscillator gate
      - description: fixed input clock source for mclk_sel_0
      - description: u3p2pll input clock source for mclk_sel_0 (optional)
    minItems: 1

  clock-names:
    items:
      - const: in0
      - const: in1
      - const: in2
    minItems: 1

required:
  - compatible
  - '#clock-cells'
  - reg
  - clocks
  - clock-names

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - amlogic,a9-mclk0-pll
              - amlogic,a9-mclk1-pll

    then:
      properties:
        clocks:
          maxItems: 3

        clock-names:
          maxItems: 3

  - if:
      properties:
        compatible:
          contains:
            enum:
              - amlogic,a9-gp0-pll
              - amlogic,a9-hifi0-pll
              - amlogic,a9-hifi1-pll

    then:
      properties:
        clocks:
          maxItems: 1

        clock-names:
          maxItems: 1

additionalProperties: false

examples:
  - |
    apb4 {
        #address-cells = <2>;
        #size-cells = <2>;

        clock-controller@8200 {
            compatible = "amlogic,a9-gp0-pll";
            reg = <0x0 0x8200 0x0 0x20>;
            #clock-cells = <1>;
            clocks = <&scmi_clk 0>;
            clock-names = "in0";
        };

        clock-controller@8330 {
            compatible = "amlogic,a9-mclk0-pll";
            reg = <0x0 0x8330 0x0 0x14>;
            #clock-cells = <1>;
            clocks = <&scmi_clk 4>,
                     <&scmi_clk 8>;
            clock-names = "in0", "in1";
        };
    };
