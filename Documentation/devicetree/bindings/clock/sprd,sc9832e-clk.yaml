%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sprd,sc9832e-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc SC9832E Clock Controllers

maintainers:
  - Orson Zhai <orsonzhai@gmail.com>
  - Baolin Wang <baolin.wang7@gmail.com>
  - Chunyan Zhang <zhang.lyra@gmail.com>
  - Nadi Ke <kenadicanady@gmail.com>

description: |
  Unisoc SC9832E Clock Controllers.

  The SC9832E clock architecture uses a mix of independent controllers and
  sub-nodes within a system controller.

properties:
  compatible:
    oneOf:
      - items:
          - const: sprd,sc9832e-glbregs
          - const: syscon
      - enum:
          - sprd,sc9832e-ap-clk
          - sprd,sc9832e-aon-clk
          - sprd,sc9832e-apahb-gate
          - sprd,sc9832e-aonapb-gate
          - sprd,sc9832e-apapb-gate
          - sprd,sc9832e-pll
          - sprd,sc9832e-mpll
          - sprd,sc9832e-dpll
          - sprd,sc9832e-rpll

  "#clock-cells":
    const: 1

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 6
    description:
      The input parent clock(s) phandle for this clock controller.

  clock-names:
    minItems: 1
    maxItems: 6

required:
  - compatible
  - '#clock-cells'

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: sprd,sc9832e-ap-clk
    then:
      required:
        - reg
        - clocks
        - clock-names
      properties:
        clocks:
          items:
            - description: External 26MHz clock
            - description: External 1MHz clock
        clock-names:
          items:
            - const: ext-26m
            - const: ext-1m

  - if:
      properties:
        compatible:
          contains:
            const: sprd,sc9832e-aon-clk
    then:
      required:
        - reg
        - clocks
        - clock-names
      properties:
        clocks:
          items:
            - description: External 4.3MHz clock
            - description: External 26MHz clock
            - description: External 32kHz clock
            - description: External 6.5MHz clock
            - description: External 13MHz clock
            - description: External 250kHz clock
        clock-names:
          items:
            - const: ext-4m3
            - const: ext-26m
            - const: ext-32k
            - const: ext-6m5
            - const: ext-13m
            - const: ext-250k

  - if:
      properties:
        compatible:
          enum:
            - sprd,sc9832e-pll
            - sprd,sc9832e-mpll
            - sprd,sc9832e-dpll
            - sprd,sc9832e-rpll
            - sprd,sc9832e-apahb-gate
            - sprd,sc9832e-aonapb-gate
            - sprd,sc9832e-apapb-gate
    then:
      required:
        - reg
        - clocks
        - clock-names
      properties:
        clocks:
          items:
            - description: External 26MHz clock
        clock-names:
          items:
            - const: ext-26m

  - if:
      properties:
        compatible:
          contains:
            const: sprd,sc9832e-glbregs
    then:
      required:
        - reg
        - "#clock-cells"
        - clocks
        - clock-names
      properties:
        "#clock-cells":
          const: 1
        clocks:
          items:
            - description: External 26MHz clock
        clock-names:
          items:
            - const: ext-26m

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sprd,sc9832e-clk.h>

    ap_clk: clock-controller@21500000 {
      compatible = "sprd,sc9832e-ap-clk";
      reg = <0x21500000 0x1000>;
      clocks = <&ext_26m>, <&ext_1m>;
      clock-names = "ext-26m", "ext-1m";
      #clock-cells = <1>;
    };

    pll: clock-controller@403c0000 {
      compatible = "sprd,sc9832e-pll";
      reg = <0x403c0000 0x1000>;
      clocks = <&ext_26m>;
      clock-names = "ext-26m";
      #clock-cells = <1>;
    };

    pmu_controller: syscon@402b0000 {
      compatible = "sprd,sc9832e-glbregs", "syscon";
      reg = <0x402b0000 0x4000>;
      #clock-cells = <1>;
      clocks = <&ext_26m>;
      clock-names = "ext-26m";
    };
...

