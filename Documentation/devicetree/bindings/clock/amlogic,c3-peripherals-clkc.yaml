%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/amlogic,c3-peripherals-clkc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic C serials Peripherals Clock Controller

maintainers:
  - Chuan Liu <chuan.liu@amlogic.com>

properties:
  compatible:
    const: amlogic,c3-peripherals-clkc

  reg:
    maxItems: 1

  clocks:
    minItems: 9
    items:
      - description: input oscillator (usually at 24MHz)
      - description: input fixed pll
      - description: input fixed pll div2
      - description: input fixed pll div2p5
      - description: input fixed pll div3
      - description: input fixed pll div4
      - description: input fixed pll div5
      - description: input fixed pll div7
      - description: input gp0 pll
      - description: input hifi pll

  clock-names:
    minItems: 9
    items:
      - const: xtal
      - const: fixed_pll
      - const: fclk_div2
      - const: fclk_div2p5
      - const: fclk_div3
      - const: fclk_div4
      - const: fclk_div5
      - const: fclk_div7
      - const: gp0_pll
      - const: hifi_pll

  "#clock-cells":
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/amlogic,c3-pll-clkc.h>
    apb {
        #address-cells = <2>;
        #size-cells = <2>;

        clkc_periphs: clock-controller@0 {
          compatible = "amlogic,c3-peripherals-clkc";
          reg = <0x0 0x0 0x0 0x49c>;
          #clock-cells = <1>;
          clocks = <&xtal>,
                   <&clkc_pll CLKID_FIXED_PLL>,
                   <&clkc_pll CLKID_FCLK_DIV2>,
                   <&clkc_pll CLKID_FCLK_DIV2P5>,
                   <&clkc_pll CLKID_FCLK_DIV3>,
                   <&clkc_pll CLKID_FCLK_DIV4>,
                   <&clkc_pll CLKID_FCLK_DIV5>,
                   <&clkc_pll CLKID_FCLK_DIV7>,
                   <&clkc_pll CLKID_GP0_PLL>,
                   <&clkc_pll CLKID_HIFI_PLL>;
          clock-names = "xtal",
                        "fixed_pll",
                        "fclk_div2",
                        "fclk_div2p5",
                        "fclk_div3",
                        "fclk_div4",
                        "fclk_div5",
                        "fclk_div7",
                        "gp0_pll",
                        "hifi_pll";
        };
    };
