%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/amlogic,axg-audio-clkc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic AXG Audio Clock Controller

maintainers:
  - Neil Armstrong <neil.armstrong@linaro.org>
  - Jerome Brunet <jbrunet@baylibre.com>
  - Jian Hu <jian.hu@jian.hu.com>
  - Dmitry Rokosov <ddrokosov@sberdevices.ru>

description:
  The Amlogic AXG audio clock controller generates and supplies clock to the
  other elements of the audio subsystem, such as fifos, i2s, spdif and pdm
  devices.

properties:
  compatible:
    enum:
      - amlogic,axg-audio-clkc
      - amlogic,g12a-audio-clkc
      - amlogic,sm1-audio-clkc

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 11

  clock-names:
    oneOf:
      - const: pclk
      - items:
          - const: pclk
          - const: mst_in0
          - const: mst_in1
          - const: mst_in2
          - const: mst_in3
          - const: mst_in4
          - const: mst_in5
          - const: mst_in6
          - const: mst_in7
      - items:
          - const: pclk
          - const: slv_sclk0
          - const: slv_sclk1
          - const: slv_sclk2
          - const: slv_sclk3
          - const: slv_sclk4
          - const: slv_sclk5
          - const: slv_sclk6
          - const: slv_sclk7
          - const: slv_sclk8
          - const: slv_sclk9
      - items:
          - const: pclk
          - const: slv_lrclk0
          - const: slv_lrclk1
          - const: slv_lrclk2
          - const: slv_lrclk3
          - const: slv_lrclk4
          - const: slv_lrclk5
          - const: slv_lrclk6
          - const: slv_lrclk7
          - const: slv_lrclk8
          - const: slv_lrclk9

  resets:
    description: internal reset line

required:
  - compatible
  - '#clock-cells'
  - reg
  - clocks
  - clock-names
  - resets

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - amlogic,g12a-audio-clkc
              - amlogic,sm1-audio-clkc
    then:
      required:
        - '#reset-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/axg-clkc.h>
    #include <dt-bindings/reset/amlogic,meson-axg-reset.h>
    apb {
        #address-cells = <2>;
        #size-cells = <2>;

        clkc_audio: clock-controller@0 {
        compatible = "amlogic,axg-audio-clkc";
        reg = <0x0 0x0 0x0 0xb4>;
        #clock-cells = <1>;

        clocks = <&clkc CLKID_AUDIO>,
            <&clkc CLKID_MPLL0>,
            <&clkc CLKID_MPLL1>,
            <&clkc CLKID_MPLL2>,
            <&clkc CLKID_MPLL3>,
            <&clkc CLKID_HIFI_PLL>,
            <&clkc CLKID_FCLK_DIV3>,
            <&clkc CLKID_FCLK_DIV4>,
            <&clkc CLKID_GP0_PLL>;
        clock-names = "pclk",
            "mst_in0",
            "mst_in1",
            "mst_in2",
            "mst_in3",
            "mst_in4",
            "mst_in5",
            "mst_in6",
            "mst_in7";
        resets = <&reset RESET_AUDIO>;
      };
    };
