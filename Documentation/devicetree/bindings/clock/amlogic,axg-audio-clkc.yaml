          - slv_lrclk8
          - slv_lrclk9

  resets:
    description: internal reset line

required:
  - compatible
  - '#clock-cells'
  - reg
  - clocks
  - clock-names
  - resets

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - amlogic,g12a-audio-clkc
              - amlogic,sm1-audio-clkc
    then:
      required:
        - '#reset-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/axg-clkc.h>
    #include <dt-bindings/reset/amlogic,meson-axg-reset.h>
    apb {
        #address-cells = <2>;
        #size-cells = <2>;

        clkc_audio: clock-controller@0 {
        compatible = "amlogic,axg-audio-clkc";
        reg = <0x0 0x0 0x0 0xb4>;
        #clock-cells = <1>;

        clocks = <&clkc CLKID_AUDIO>,
            <&clkc CLKID_MPLL0>,
            <&clkc CLKID_MPLL1>,
            <&clkc CLKID_MPLL2>,
            <&clkc CLKID_HIFI_PLL>,
            <&clkc CLKID_FCLK_DIV3>,
            <&clkc CLKID_FCLK_DIV4>,
            <&clkc CLKID_GP0_PLL>,
            <&codec_frame_clk>;
        clock-names = "pclk",
            "mst_in0",
            "mst_in1",
            "mst_in2",
            "mst_in4",
            "mst_in5",
            "mst_in6",
            "mst_in7",
            "slv_lrclk1";
        resets = <&reset RESET_AUDIO>;
      };
    };
