%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/ti,cdce6214.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI CDCE6214 programmable clock generator with PLL

maintainers:
  - Sascha Hauer <s.hauer@pengutronix.de>

description: >
  Ultra-Low Power Clock Generator With One PLL, Four Differential Outputs,
  Two Inputs, and Internal EEPROM

  - CDCE6214: https://www.ti.com/product/CDCE6214

properties:
  compatible:
    enum:
      - ti,cdce6214

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    minItems: 1
    items:
      - enum: [ priref, secref ]
      - const: secref

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  '#clock-cells':
    const: 1

patternProperties:
  '-pins$':
    type: object
    additionalProperties: false
    patternProperties:
      '^conf':
        type: object
        additionalProperties: false
        $ref: /schemas/pinctrl/pincfg-node.yaml#

        properties:
          pins:
            items:
              enum: [priref, secref, out0, out1, out2, out3, out4 ]
          io-standard:
            description: |
              1: CMOS
              2: LVDS
              3: Low-Power HCSL
              4: XTAL mode
              5: differential
            enum: [1, 2, 3, 4, 5]
            $ref: /schemas/types.yaml#/definitions/uint32
          xo-cload-femtofarad:
            description: >
              Load capacity for XO in Femtofarad
            $ref: /schemas/types.yaml#/definitions/uint32
          xo-bias-microampere:
            description: |
              Bias current setting of the XO
            $ref: /schemas/types.yaml#/definitions/uint32
          cmosp-mode:
            description: |
              Driving mode for CMOSN output:
              1: Low Polarity
              2: High Polrity
              3: Disable
            $ref: /schemas/types.yaml#/definitions/uint32
            maximum: 3
          cmosn-mode:
            description: |
              Driving mode for CMOSN output:
              1: Low Polarity
              2: High Polrity
              3: Disable
            $ref: /schemas/types.yaml#/definitions/uint32
            maximum: 3

        allOf:
          - if:
              properties:
                pins:
                  contains:
                    const: priref
            then:
              properties:
                io-standard:
                  enum: [ 1, 5 ]

          - if:
              properties:
                pins:
                  contains:
                    const: secref
            then:
              properties:
                io-standard:
                  enum: [ 1, 4, 5 ]

          - if:
              properties:
                pins:
                  contains:
                    const: out0
            then:
              properties:
                io-standard:
                  enum: [ 1 ]

          - if:
              properties:
                pins:
                  contains:
                    enum:
                      - out1
                      - out4
            then:
              properties:
                io-standard:
                  enum: [ 1, 2, 3 ]

          - if:
              properties:
                pins:
                  contains:
                    enum:
                      - out2
                      - out3
            then:
              properties:
                io-standard:
                  enum: [ 2, 3 ]

        required:
          - pins

required:
  - compatible
  - reg
  - clocks
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/ti,cdce6214.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        clock-generator@67 {
            compatible = "ti,cdce6214";
            reg = <0x67>;
            #address-cells = <1>;
            #size-cells = <0>;
            #clock-cells = <1>;
            clocks = <&clock_ref25m>;
            clock-names = "priref";

            cdce6214_pins: cdce6214-pins {
                conf1 {
                    pins = "secref";
                    io-standard = <CDCE6214_IOSTD_XTAL>;
                    xo-cload-femtofarad = <8100>;
                    xo-bias-microampere = <100>;
                };

                conf2 {
                    pins = "out1";
                    io-standard = <CDCE6214_IOSTD_CMOS>;
                    cmosp-mode = <CDCE6214_CMOS_MODE_HIGH>;
                    cmosn-mode = <CDCE6214_CMOS_MODE_LOW>;
                };

                conf3 {
                    pins = "out4";
                    io-standard = <CDCE6214_IOSTD_CMOS>;
                    cmosp-mode = <CDCE6214_CMOS_MODE_HIGH>;
                    cmosn-mode = <CDCE6214_CMOS_MODE_LOW>;
                };
            };
        };
    };
