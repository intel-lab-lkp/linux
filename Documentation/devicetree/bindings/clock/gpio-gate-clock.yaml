%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/gpio-gate-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Simple GPIO clock gate

maintainers:
  - Jyri Sarha <jsarha@ti.com>

properties:
  compatible:
    enum:
      - gpio-gate-clock
      - gpio-locked-fixed-clock

  clocks:
    maxItems: 1

  '#clock-cells':
    const: 0

  enable-gpios:
    description: GPIO reference for enabling and disabling the clock.
    maxItems: 1

  locked-gpios:
    description: GPIO that indicates whether the clock is enabled or disabled.
    maxItems: 1

required:
  - compatible
  - '#clock-cells'

allOf:
  - if:
      properties:
        compatible:
          const: gpio-gate-clock
    then:
      required:
        - enable-gpios
  - if:
      properties:
        compatible:
          const: gpio-locked-fixed-clock
    then:
      required:
        - locked-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    clock {
        compatible = "gpio-gate-clock";
        clocks = <&parentclk>;
        #clock-cells = <0>;
        enable-gpios = <&gpio 1 GPIO_ACTIVE_HIGH>;
    };

    clk_gpio_locked {
        compatible = "gpio-locked-fixed-clock";
        #clock-cells = <0>;
        clocks = <&pll>;
        locked-gpios = <&gpio0 4 GPIO_ACTIVE_HIGH>;
    };
