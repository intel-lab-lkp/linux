%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/amlogic,t7-pll-clkc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T7 PLL Clock Control Controller

maintainers:
  - Neil Armstrong <neil.armstrong@linaro.org>
  - Jerome Brunet <jbrunet@baylibre.com>
  - Jian Hu <jian.hu@amlogic.com>
  - Xianwei Zhao <xianwei.zhao@amlogic.com>

if:
  properties:
    compatible:
      contains:
        const: amlogic,t7-pll-mclk

then:
  properties:
    clocks:
      items:
        - description: mclk pll input oscillator gate
        - description: 24M oscillator input clock source for mclk_sel_0
        - description: fix 50Mhz input clock source for mclk_sel_0

    clock-names:
      items:
        - const: input
        - const: mclk_in0
        - const: mclk_in1

else:
  properties:
    clocks:
      items:
        - description: pll input oscillator gate

    clock-names:
      items:
        - const: input

properties:
  compatible:
    enum:
      - amlogic,t7-pll-gp0
      - amlogic,t7-pll-gp1
      - amlogic,t7-pll-hifi
      - amlogic,t7-pll-pcie
      - amlogic,t7-mpll
      - amlogic,t7-pll-hdmi
      - amlogic,t7-pll-mclk

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  clocks:
    minItems: 1
    maxItems: 3

  clock-names:
    minItems: 1
    maxItems: 3

required:
  - compatible
  - '#clock-cells'
  - reg
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    apb {
        #address-cells = <2>;
        #size-cells = <2>;

        clock-controller@8080 {
            compatible = "amlogic,t7-pll-gp0";
            reg = <0 0x8080 0 0x20>;
            clocks = <&scmi_clk 2>;
            clock-names = "input";
            #clock-cells = <1>;
        };

        clock-controller@8300 {
            compatible = "amlogic,t7-pll-mclk";
            reg = <0 0x8300 0 0x18>;
            clocks = <&scmi_clk 2>,
                     <&xtal>,
                     <&scmi_clk 31>;
            clock-names = "input", "mclk_in0", "mclk_in1";
            #clock-cells = <1>;
        };
    };
