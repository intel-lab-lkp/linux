%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/via,vt8500-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: VIA/Wondermedia VT8500 Clock Controller

maintainers:
  - Michael Turquette <mturquette@baylibre.com>
  - Stephen Boyd <sboyd@kernel.org>

description: |
  Clock controller bindings for VIA/Wondermedia VT8500 and Wondermedia WM8xxx
  series SoCs.

properties:
  compatible:
    enum:
      - via,vt8500-pll-clock
      - wm,wm8650-pll-clock
      - wm,wm8750-pll-clock
      - wm,wm8850-pll-clock
      - via,vt8500-device-clock

  reg:
    maxItems: 1
    description:
      Offset of the PLL register within the PMC register space.

  clocks:
    maxItems: 1
    description:
      Parent reference clock.

  "#clock-cells":
    const: 0

  enable-reg:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Offset of the clock enable register within the PMC register space.

  enable-bit:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 31
    description:
      Bit index controlling clock enable.

  divisor-reg:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Offset of the clock divisor register within the PMC register space.

  divisor-mask:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Bitmask describing the divisor field inside divisor-reg.

required:
  - compatible
  - "#clock-cells"

allOf:
  - if:
      properties:
        compatible:
          enum:
            - via,vt8500-pll-clock
            - wm,wm8650-pll-clock
            - wm,wm8750-pll-clock
            - wm,wm8850-pll-clock
    then:
      required:
        - reg
        - clocks

  - if:
      properties:
        compatible:
          const: via,vt8500-device-clock
    then:
      required:
        - clocks
      anyOf:
        - required:
            - enable-reg
            - enable-bit
        - required:
            - divisor-reg

additionalProperties: false

examples:
  - |
    / {
        #address-cells = <1>;
        #size-cells = <0>;

        ref25: ref25M {
            compatible = "fixed-clock";
            #clock-cells = <0>;
            clock-frequency = <25000000>;
        };

        plla: clock@200 {
            compatible = "wm,wm8650-pll-clock";
            reg = <0x200>;
            clocks = <&ref25>;
            #clock-cells = <0>;
        };

        clksdhc: clock {
            compatible = "via,vt8500-device-clock";
            clocks = <&plla>;
            divisor-reg = <0x328>;
            divisor-mask = <0x3f>;
            enable-reg = <0x254>;
            enable-bit = <18>;
            #clock-cells = <0>;
        };
    };
