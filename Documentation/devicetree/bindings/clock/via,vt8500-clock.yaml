%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/via,vt8500-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: VIA/Wondermedia VT8500 Clock Controller

maintainers:
  - Alexey Charkov <alchark@gmail.com>
  - Krzysztof Kozlowski <krzk@kernel.org>

description:
  Clock controller bindings for VIA/Wondermedia VT8500 and Wondermedia WM8xxx
  series SoCs.

properties:
  compatible:
    enum:
      - via,vt8500-pll-clock
      - wm,wm8650-pll-clock
      - wm,wm8750-pll-clock
      - wm,wm8850-pll-clock
      - via,vt8500-device-clock

  reg:
    description: Offset of the PLL register within the PMC register space.
    maxItems: 1

  clocks:
    maxItems: 1

  "#clock-cells":
    const: 0

  clock-output-names:
    maxItems: 1

  enable-reg:
    description: Offset of the clock enable register within the PMC register space.
    $ref: /schemas/types.yaml#/definitions/uint32

  enable-bit:
    description: Bit index controlling clock enable.
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 31

  divisor-reg:
    description: Offset of the clock divisor register within the PMC register space.
    $ref: /schemas/types.yaml#/definitions/uint32

  divisor-mask:
    description: Bitmask describing the divisor field inside divisor-reg.
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 0x1f

required:
  - compatible
  - clocks
  - "#clock-cells"

allOf:
  - if:
      properties:
        compatible:
          const: via,vt8500-device-clock
    then:
      properties:
        reg: false
      anyOf:
        - required:
            - enable-reg
            - enable-bit
        - required:
            - divisor-reg
  - if:
      properties:
        compatible:
          enum:
            - via,vt8500-pll-clock
            - wm,wm8650-pll-clock
            - wm,wm8750-pll-clock
            - wm,wm8850-pll-clock
    then:
      required:
        - reg

dependentRequired:
  enable-reg:
    - enable-bit
  enable-bit:
    - enable-reg
  divisor-mask:
    - divisor-reg

additionalProperties: false

examples:
  - |
    clocks {
        #address-cells = <1>;
        #size-cells = <0>;

        ref25: clock-25000000 {
            compatible = "fixed-clock";
            clock-frequency = <25000000>;
            #clock-cells = <0>;
        };

        plla: clock@200 {
            compatible = "wm,wm8650-pll-clock";
            reg = <0x200>;
            clocks = <&ref25>;
            #clock-cells = <0>;
        };

        pllb: clock@204 {
            compatible = "wm,wm8650-pll-clock";
            reg = <0x204>;
            clocks = <&ref25>;
            #clock-cells = <0>;
        };

        clksdhc: sdhc {
            compatible = "via,vt8500-device-clock";
            clocks = <&pllb>;
            #clock-cells = <0>;
            divisor-reg = <0x328>;
            divisor-mask = <0x3f>;
            enable-reg = <0x254>;
            enable-bit = <18>;
        };
    };
