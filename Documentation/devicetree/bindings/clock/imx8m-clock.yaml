# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/imx8m-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP i.MX8M Family Clock Control Module

maintainers:
  - Abel Vesa <abelvesa@kernel.org>
  - Peng Fan <peng.fan@nxp.com>

description: |
  NXP i.MX8M Mini/Nano/Plus/Quad clock control module is an integrated clock
  controller, which generates and supplies to all modules.

properties:
  compatible:
    enum:
      - fsl,imx8mm-ccm
      - fsl,imx8mn-ccm
      - fsl,imx8mp-ccm
      - fsl,imx8mq-ccm

  reg:
    maxItems: 1

  interrupts:
    maxItems: 2

  clocks:
    minItems: 7
    maxItems: 10

  clock-names:
    minItems: 7
    maxItems: 10

  '#clock-cells':
    const: 1
    description:
      The clock consumer should specify the desired clock by having the clock
      ID in its "clocks" phandle cell. See include/dt-bindings/clock/imx8m-clock.h
      for the full list of i.MX8M clock IDs.

  fsl,ssc-modfreq-hz:
    description:
      The values of modulation frequency (Hz unit) for each clock
      supporting spread spectrum.
    minItems: 7
    maxItems: 10

  fsl,ssc-modrate-percent:
    description:
      The percentage values of modulation rate for each clock
      supporting spread spectrum.
    minItems: 7
    maxItems: 10

  fsl,ssc-modmethod:
    $ref: /schemas/types.yaml#/definitions/non-unique-string-array
    description:
      The modulation techniques for each clock supporting spread
      spectrum.
    minItems: 7
    maxItems: 10
    items:
      enum:
        - ""
        - down-spread
        - up-spread
        - center-spread

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: fsl,imx8mq-ccm
    then:
      properties:
        clocks:
          items:
            - description: 32k osc
            - description: 25m osc
            - description: 27m osc
            - description: ext1 clock input
            - description: ext2 clock input
            - description: ext3 clock input
            - description: ext4 clock input
        clock-names:
          items:
            - const: ckil
            - const: osc_25m
            - const: osc_27m
            - const: clk_ext1
            - const: clk_ext2
            - const: clk_ext3
            - const: clk_ext4
        fsl,ssc-modfreq-hz: false
        fsl,ssc-modrate-percent: false
        fsl,ssc-modmethod: false

    else:
      properties:
        clocks:
          items:
            - description: 32k osc
            - description: 24m osc
            - description: ext1 clock input
            - description: ext2 clock input
            - description: ext3 clock input
            - description: ext4 clock input
            - description: audio1 PLL input
            - description: audio2 PLL input
            - description: dram PLL input
            - description: video PLL input

        clock-names:
          items:
            - const: osc_32k
            - const: osc_24m
            - const: clk_ext1
            - const: clk_ext2
            - const: clk_ext3
            - const: clk_ext4
            - const: audio_pll1
            - const: audio_pll2
            - const: dram_pll
            - const: video_pll

additionalProperties: false

examples:
  # Clock Control Module node:
  - |
    #include <dt-bindings/clock/imx8mm-clock.h>

    clock-controller@30380000 {
        compatible = "fsl,imx8mm-ccm";
        reg = <0x30380000 0x10000>;
        #clock-cells = <1>;
        clocks = <&osc_32k>, <&osc_24m>, <&clk_ext1>, <&clk_ext2>,
                 <&clk_ext3>, <&clk_ext4>,
                 <&anatop IMX8MM_ANATOP_AUDIO_PLL1>,
                 <&anatop IMX8MM_ANATOP_AUDIO_PLL1>,
                 <&anatop IMX8MM_ANATOP_DRAM_PLL>,
                 <&anatop IMX8MM_ANATOP_VIDEO_PLL>;
        clock-names = "osc_32k", "osc_24m", "clk_ext1", "clk_ext2",
                      "clk_ext3", "clk_ext4", "audio_pll1", "audio_pll2",
                      "dram_pll", "video_pll";
        fsl,ssc-modfreq-hz = <0>, <0>, <0>, <0>,
                             <0>, <0>,
                             <6818>,
                             <0>,
                             <0>,
                             <2419>;
        fsl,ssc-modrate-percent = <0>, <0>, <0>, <0>,
                             <0>, <0>,
                             <3>,
                             <0>,
                             <0>,
                             <7>;
        fsl,ssc-modmethod = "", "", "", "",
                            "", "",
                            "down-spread",
                            "",
                            "",
                            "center-spread";
    };

  - |
    clock-controller@30380000 {
        compatible = "fsl,imx8mq-ccm";
        reg = <0x30380000 0x10000>;
        #clock-cells = <1>;
        clocks = <&ckil>, <&osc_25m>, <&osc_27m>, <&clk_ext1>,
                 <&clk_ext2>, <&clk_ext3>, <&clk_ext4>;
        clock-names = "ckil", "osc_25m", "osc_27m", "clk_ext1",
                      "clk_ext2", "clk_ext3", "clk_ext4";
    };

...
