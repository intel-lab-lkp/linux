%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/aspeed,ast2600-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ASPEED PCIe Root Complex Controller

maintainers:
  - Jacky Chou <jacky_chou@aspeedtech.com>

description:
  The ASPEED PCIe Root Complex controller provides PCI Express Root Complex
  functionality for ASPEED SoCs, such as the AST2600 and AST2700.
  This controller enables connectivity to PCIe endpoint devices, supporting
  memory and I/O windows, MSI and legacy interrupts, and integration with
  the SoC's clock, reset, and pinctrl subsystems.

properties:
  compatible:
    enum:
      - aspeed,ast2600-pcie
      - aspeed,ast2700-pcie

  reg:
    maxItems: 1

  ranges:
    minItems: 2
    maxItems: 2

  interrupts:
    maxItems: 1
    description: IntX and MSI interrupt

  resets:
    items:
      - description: PCIe controller reset

  reset-names:
    items:
      - const: h2x

  msi-parent: true

  aspeed,ahbc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the ASPEED AHB Controller (AHBC) syscon node.
      This reference is used by the PCIe controller to access
      system-level configuration registers related to the AHB bus.
      To enable AHB access for the PCIe controller.

  aspeed,pciecfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the ASPEED PCIe configuration syscon node.
      This reference allows the PCIe controller to access
      SoC-specific PCIe configuration registers. There are the others
      functions such PCIe RC and PCIe EP will use this common register
      to configure the SoC interfaces.

  aspeed,pciephy:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the ASPEED PCIe PHY syscon node.
      This property provides access to the PCIe PHY control
      registers required for link initialization and management.
      The other functions such PCIe RC and PCIe EP will use this
      common register to configure the PHY interfaces and get some
      information from the PHY.

  interrupt-controller:
    description: Interrupt controller node for handling legacy PCI interrupts.
    type: object
    properties:
      '#address-cells':
        const: 0
      '#interrupt-cells':
        const: 1
      interrupt-controller: true

    required:
      - '#address-cells'
      - '#interrupt-cells'
      - interrupt-controller

    additionalProperties: false

allOf:
  - $ref: /schemas/pci/pci-bus-common.yaml#
  - $ref: /schemas/pci/pci-host-bridge.yaml#
  - $ref: /schemas/interrupt-controller/msi-controller.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: aspeed,ast2600-pcie
    then:
      required:
        - aspeed,ahbc
    else:
      properties:
        aspeed,ahbc: false

required:
  - reg
  - interrupts
  - bus-range
  - ranges
  - resets
  - reset-names
  - msi-parent
  - msi-controller
  - aspeed,pciecfg
  - interrupt-map-mask
  - interrupt-map
  - interrupt-controller

unevaluatedProperties: false

patternProperties:
  "^pcie@[0-9a-f,]+$":
    type: object
    properties:
      resets:
        items:
          - description: PCIe PERST
      reset-names:
        items:
          - const: perst
      clocks:
        maxItems: 1
        description: PCIe BUS clock
    required:
      - resets
      - reset-names
      - clocks
      - aspeed,pciephy

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/ast2600-clock.h>

    apb {
      #address-cells = <1>;
      #size-cells = <1>;

      pcie0: pcie@1e7700c0 {
        compatible = "aspeed,ast2600-pcie";
        device_type = "pci";
        reg = <0x1e7700c0 0x40>;
        linux,pci-domain = <0>;
        #address-cells = <3>;
        #size-cells = <2>;
        interrupts = <GIC_SPI 168 IRQ_TYPE_LEVEL_HIGH>;
        bus-range = <0x80 0xff>;

        ranges = <0x01000000 0x0 0x00018000 0x00018000 0x0 0x00008000
                  0x02000000 0x0 0x70000000 0x70000000 0x0 0x10000000>;

        resets = <&syscon ASPEED_RESET_H2X>;
        reset-names = "h2x";

        #interrupt-cells = <1>;
        msi-parent = <&pcie0>;
        msi-controller;

        aspeed,ahbc = <&ahbc>;
        aspeed,pciecfg = <&pcie_cfg>;

        interrupt-map-mask = <0 0 0 7>;
        interrupt-map = <0 0 0 1 &pcie_intc0 0>,
                        <0 0 0 2 &pcie_intc0 1>,
                        <0 0 0 3 &pcie_intc0 2>,
                        <0 0 0 4 &pcie_intc0 3>;
        pcie_intc0: interrupt-controller {
          interrupt-controller;
          #address-cells = <0>;
          #interrupt-cells = <1>;
        };

        pcie@8,0 {
          reg = <0x804000 0 0 0 0>;
          #address-cells = <3>;
          #size-cells = <2>;
          device_type = "pci";
          resets = <&syscon ASPEED_RESET_PCIE_RC_O>;
          reset-names = "perst";
          clocks = <&syscon ASPEED_CLK_GATE_BCLK>;
          pinctrl-names = "default";
          pinctrl-0 = <&pinctrl_pcierc1_default>;
          aspeed,pciephy = <&pcie_phy1>;
          ranges;
        };
      };
    };
