%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/spacemit,k1-pcie-rc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SpacemiT K1 PCI Express Root Complex

maintainers:
  - Alex Elder <elder@riscstar.com>

description:
  The SpacemiT K1 SoC PCIe root complex controller is based on the
  Synopsys DesignWare PCIe IP.

properties:
  compatible:
    const: spacemit,k1-pcie-rc.yaml

  reg:
    items:
      - description: DesignWare PCIe registers
      - description: ATU address space
      - description: PCIe configuration space
      - description: Link control registers

  reg-names:
    items:
      - const: dbi
      - const: atu
      - const: config
      - const: link

  clocks:
    items:
      - description: DWC PCIe Data Bus Interface (DBI) clock
      - description: DWC PCIe application AXI-bus Master interface clock
      - description: DWC PCIe application AXI-bus Slave interface clock.

  clock-names:
    items:
      - const: dbi
      - const: mstr
      - const: slv

  resets:
    items:
      - description: DWC PCIe Data Bus Interface (DBI) reset
      - description: DWC PCIe application AXI-bus Master interface reset
      - description: DWC PCIe application AXI-bus Slave interface reset.
      - description: Global reset; must be deasserted for PHY to function

  reset-names:
    items:
      - const: dbi
      - const: mstr
      - const: slv
      - const: global

  interrupts-extended:
    maxItems: 1

  spacemit,syscon-pmu:
    description:
      PHandle that refers to the APMU system controller, whose
      regmap is used in managing resets and link state.
    $ref: /schemas/types.yaml#/definitions/phandle

  device_type:
    const: pci

  max-link-speed:
    const: 2

  num-viewport:
    const: 8

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - reset-names
  - spacemit,syscon-pmu
  - "#address-cells"
  - "#size-cells"
  - device_type
  - max-link-speed
  - bus-range
  - num-viewport

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/spacemit,k1-syscon.h>
    pcie0: pcie@ca000000 {
        compatible = "spacemit,k1-pcie-rc";
        reg = <0x0 0xca000000 0x0 0x00001000>,
              <0x0 0xca300000 0x0 0x0001ff24>,
              <0x0 0x8f000000 0x0 0x00002000>,
              <0x0 0xc0b20000 0x0 0x00001000>;
        reg-names = "dbi",
                    "atu",
                    "config",
                    "link";

        ranges = <0x01000000 0x8f002000 0x0 0x8f002000 0x0 0x100000>,
                 <0x02000000 0x80000000 0x0 0x80000000 0x0 0x0f000000>;

        clocks = <&syscon_apmu CLK_PCIE0_DBI>,
                 <&syscon_apmu CLK_PCIE0_MASTER>,
                 <&syscon_apmu CLK_PCIE0_SLAVE>;
        clock-names = "dbi",
                      "mstr",
                      "slv";

        resets = <&syscon_apmu RESET_PCIE0_DBI>,
                 <&syscon_apmu RESET_PCIE0_MASTER>,
                 <&syscon_apmu RESET_PCIE0_SLAVE>,
                 <&syscon_apmu RESET_PCIE0_GLOBAL>;
        reset-names = "dbi",
                      "mstr",
                      "slv",
                      "global";

        interrupts-extended = <&plic 141>;

        spacemit,syscon-pmu = <&syscon_apmu 0x03cc>;

        #address-cells = <3>;
        #size-cells = <2>;

        device_type = "pci";
        max-link-speed = <2>;
        bus-range = <0x00 0xff>;
        num-viewport = <8>;

        status = "disabled";
    };
