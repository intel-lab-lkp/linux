%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/eswin,eic7700-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Eswin EIC7700 PCIe host controller

maintainers:
  - Yu Ning <ningyu@eswincomputing.com>
  - Senchuan Zhang <zhangsenchuan@eswincomputing.com>

description: |
  The PCIe controller on EIC7700 SoC.

properties:
  compatible:
    const: eswin,eic7700-pcie

  reg:
    maxItems: 3

  reg-names:
    items:
      - const: dbi
      - const: config
      - const: mgmt

  "#address-cells":
    const: 3
  "#size-cells":
    const: 2
  '#interrupt-cells':
    const: 1

  interrupts:
    maxItems: 9

  interrupt-names:
    items:
      - const: msi
      - const: inta
      - const: intb
      - const: intc
      - const: intd

  interrupt-controller:
    type: object

  interrupt-map:
    maxItems: 4

  interrupt-map-mask:
    items:
      - const: 0
      - const: 0
      - const: 0
      - const: 7

  clocks:
    maxItems: 4
    description: handles to clock for the pcie controller.

  clock-names:
    items:
      - const: pcie_aclk
      - const: pcie_cfg_clk
      - const: pcie_cr_clk
      - const: pcie_aux_clk
    description: the name of each clock.

  resets:
    description: resets to be used by the controller.

  reset-names:
    items:
      - const: pcie_cfg
      - const: pcie_powerup
      - const: pcie_pwren
    description: names of the resets listed in resets property in the same order.

  bus-range:
    items:
      - const: 0
      - const: 0xff

  device_type:
    const: pci

  ranges: true

  dma-noncoherent: true

  num-lanes:
    maximum: 4

  numa-node-id:
    maximum: 0

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - interrupt-parent
  - interrupt-map-mask
  - interrupt-map
  - '#address-cells'
  - '#size-cells'
  - '#interrupt-cells'
  - clocks
  - clock-names
  - resets
  - reset-names
  - bus-range
  - dma-noncoherent
  - num-lanes
  - ranges
  - numa-node-id

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        pcie: pcie@54000000 {
          compatible = "eswin,eic7700-pcie";
          clocks = <&clock 562>,
                   <&clock 563>,
                   <&clock 564>,
                   <&clock 565>;
          clock-names = "pcie_aclk", "pcie_cfg_clk", "pcie_cr_clk", "pcie_aux_clk";

          reset-names = "pcie_cfg", "pcie_powerup", "pcie_pwren";
          resets = <&reset 8 (1 << 0)>,
                   <&reset 8 (1 << 1)>,
                   <&reset 8 (1 << 2)>;

          #address-cells = <3>;
          #size-cells = <2>;
          #interrupt-cells = <1>;

          reg = <0x0 0x54000000 0x0 0x4000000>,
                <0x0 0x40000000 0x0 0x800000>,
                <0x0 0x50000000 0x0 0x100000>;
          reg-names = "dbi", "config", "mgmt";
          device_type = "pci";

          bus-range = <0x0 0xff>;
          ranges = <0x81000000 0x0 0x40800000 0x0 0x40800000 0x0 0x800000>,
                  <0x82000000 0x0 0x41000000 0x0 0x41000000 0x0 0xf000000>,
                  <0xc3000000 0x80 0x00000000 0x80 0x00000000 0x2 0x00000000>;

          num-lanes = <0x4>;
          interrupts = <220>, <179>, <180>, <181>, <182>, <183>, <184>, <185>, <186>;
          interrupt-names = "msi", "inta", "intb", "intc", "intd";
          interrupt-parent = <&plic>;
          interrupt-map-mask = <0x0 0x0 0x0 0x7>;
          interrupt-map = <0x0 0x0 0x0 0x1 &plic 179>,
                          <0x0 0x0 0x0 0x2 &plic 180>,
                          <0x0 0x0 0x0 0x3 &plic 181>,
                          <0x0 0x0 0x0 0x4 &plic 182>;
          status = "disabled";
          numa-node-id = <0>;
          dma-noncoherent;
        };
    };
