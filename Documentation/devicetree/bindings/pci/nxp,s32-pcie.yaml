%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/nxp,s32-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP S32G2xx/S32G3xx PCIe controller

maintainers:
  - Bogdan Hamciuc <bogdan.hamciuc@nxp.com>
  - Ionut Vicovan <ionut.vicovan@nxp.com>

description:
  This PCIe controller is based on the Synopsys DesignWare PCIe IP.
  The S32G SoC family has two PCIe controllers, which can be configured as
  either Root Complex or Endpoint.

properties:
  compatible:
    oneOf:
      - enum:
          - nxp,s32g2-pcie     # S32G2 SoCs RC mode
      - items:
          - const: nxp,s32g3-pcie
          - const: nxp,s32g2-pcie

  reg:
    maxItems: 7

  reg-names:
    items:
      - const: dbi
      - const: dbi2
      - const: atu
      - const: dma
      - const: ctrl
      - const: config
      - const: addr_space

  interrupts:
    maxItems: 8

  interrupt-names:
    items:
      - const: link-req-stat
      - const: dma
      - const: msi
      - const: phy-link-down
      - const: phy-link-up
      - const: misc
      - const: pcs
      - const: tlp-req-no-comp

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - ranges
  - phys

allOf:
  - $ref: /schemas/pci/snps,dw-pcie-common.yaml#
  - $ref: /schemas/pci/pci-bus.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/phy/phy.h>

    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        pcie@40400000 {
            compatible = "nxp,s32g3-pcie",
                         "nxp,s32g2-pcie";
            reg = <0x00 0x40400000 0x0 0x00001000>,   /* dbi registers */
                  <0x00 0x40420000 0x0 0x00001000>,   /* dbi2 registers */
                  <0x00 0x40460000 0x0 0x00001000>,   /* atu registers */
                  <0x00 0x40470000 0x0 0x00001000>,   /* dma registers */
                  <0x00 0x40481000 0x0 0x000000f8>,   /* ctrl registers */
                  /*
                   * RC configuration space, 4KB each for cfg0 and cfg1
                   * at the end of the outbound memory map
                   */
                  <0x5f 0xffffe000 0x0 0x00002000>,
                  <0x58 0x00000000 0x0 0x40000000>; /* 1GB EP addr space */
            reg-names = "dbi", "dbi2", "atu", "dma", "ctrl",
                        "config", "addr_space";
            dma-coherent;
            #address-cells = <3>;
            #size-cells = <2>;
            device_type = "pci";
            ranges =
                  /*
                   * downstream I/O, 64KB and aligned naturally just
                   * before the config space to minimize fragmentation
                   */
                  <0x81000000 0x0 0x00000000 0x5f 0xfffe0000 0x0 0x00010000>,
                  /*
                   * non-prefetchable memory, with best case size and
                   * alignment
                   */
                  <0x82000000 0x0 0x00000000 0x58 0x00000000 0x7 0xfffe0000>;

            bus-range = <0x0 0xff>;
            interrupts =  <GIC_SPI 124 IRQ_TYPE_LEVEL_HIGH>,
                          <GIC_SPI 123 IRQ_TYPE_LEVEL_HIGH>,
                          <GIC_SPI 125 IRQ_TYPE_LEVEL_HIGH>,
                          <GIC_SPI 126 IRQ_TYPE_LEVEL_HIGH>,
                          <GIC_SPI 127 IRQ_TYPE_LEVEL_HIGH>,
                          <GIC_SPI 132 IRQ_TYPE_LEVEL_HIGH>,
                          <GIC_SPI 133 IRQ_TYPE_LEVEL_HIGH>,
                          <GIC_SPI 134 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "link-req-stat", "dma", "msi",
                              "phy-link-down", "phy-link-up", "misc",
                              "pcs", "tlp-req-no-comp";
            #interrupt-cells = <1>;
            interrupt-map-mask = <0 0 0 0x7>;
            interrupt-map = <0 0 0 1 &gic 0 0 GIC_SPI 128 IRQ_TYPE_LEVEL_HIGH>,
                            <0 0 0 2 &gic 0 0 GIC_SPI 129 IRQ_TYPE_LEVEL_HIGH>,
                            <0 0 0 3 &gic 0 0 GIC_SPI 130 IRQ_TYPE_LEVEL_HIGH>,
                            <0 0 0 4 &gic 0 0 GIC_SPI 131 IRQ_TYPE_LEVEL_HIGH>;

            phys = <&serdes0 PHY_TYPE_PCIE 0 0>;
        };
    };
