%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/nvidia,tegra-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NVIDIA Tegra PCIe Controller

maintainers:
  - Thierry Reding <thierry.reding@gmail.com>
  - Jon Hunter <jonathanh@nvidia.com>

description: |
  PCIe controller found on NVIDIA Tegra SoCs including Tegra20, Tegra30,
  Tegra124, Tegra210, and Tegra186. Supports multiple root ports and
  platform-specific clock, reset, and power supply configurations.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - nvidia,tegra20-pcie
              - nvidia,tegra30-pcie
              - nvidia,tegra124-pcie
              - nvidia,tegra210-pcie
              - nvidia,tegra186-pcie

  reg:
    items:
      - description: PADS registers
      - description: AFI registers
      - description: Configuration space region

  reg-names:
    items:
      - const: pads
      - const: afi
      - const: cs

  device_type:
    const: pci

  interrupts:
    items:
      - description: Controller interrupt
      - description: MSI interrupt

  interrupt-names:
    items:
      - const: intr
      - const: msi

  clocks:
    oneOf:
      - items:
          - description: PCIe clock
          - description: AFI clock
          - description: PLL_E clock
      - items:
          - description: PCIe clock
          - description: AFI clock
          - description: PLL_E clock
          - description: CML clock

  clock-names:
    oneOf:
      - items:
          - const: pex
          - const: afi
          - const: pll_e
      - items:
          - const: pex
          - const: afi
          - const: pll_e
          - const: cml

  resets:
    items:
      - description: PCIe reset
      - description: AFI reset
      - description: PCIe X reset

  reset-names:
    items:
      - const: pex
      - const: afi
      - const: pcie_x

  power-domains:
    maxItems: 1
    description: |
      A phandle to the node that controls power to the respective PCIe
      controller and a specifier name for the PCIe controller.

  interconnects:
    minItems: 1
    maxItems: 2

  interconnect-names:
    minItems: 1
    maxItems: 2
    description:
      Should include name of the interconnect path for each interconnect
      entry. Consult TRM documentation for information about available
      memory clients, see DMA CONTROLLER and MEMORY WRITE sections.

  pinctrl-names:
    items:
      - const: default
      - const: idle

  pinctrl-0:
    $ref: /schemas/types.yaml#/definitions/phandle

  pinctrl-1:
    $ref: /schemas/types.yaml#/definitions/phandle

  nvidia,num-lanes:
    description: Number of PCIe lanes used
    $ref: /schemas/types.yaml#/definitions/uint32

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#
  - if:
      properties:
        compatible:
          contains:
            enum:
              - nvidia,tegra20-pcie
              - nvidia,tegra186-pcie
    then:
      properties:
        clocks:
          minItems: 3
          maxItems: 3
        clock-names:
          items:
            - const: pex
            - const: afi
            - const: pll_e
        resets:
          minItems: 3
          maxItems: 3
        reset-names:
          items:
            - const: pex
            - const: afi
            - const: pcie_x
  - if:
      properties:
        compatible:
          contains:
            enum:
              - nvidia,tegra30-pcie
              - nvidia,tegra124-pcie
              - nvidia,tegra210-pcie
    then:
      properties:
        clocks:
          minItems: 4
          maxItems: 4
        clock-names:
          items:
            - const: pex
            - const: afi
            - const: pll_e
            - const: cml
        resets:
          minItems: 3
          maxItems: 3
        reset-names:
          items:
            - const: pex
            - const: afi
            - const: pcie_x

  - if:
      properties:
        compatible:
          contains:
            enum:
              - nvidia,tegra20-pcie
              - nvidia,tegra30-pcie
              - nvidia,tegra186-pcie
    then:
      required:
        - power-domains

  - if:
      properties:
        compatible:
          contains:
            enum:
              - nvidia,tegra186-pcie
    then:
      required:
        - interconnects
  - if:
      properties:
        compatible:
          contains:
            enum:
              - nvidia,tegra210-pcie
    then:
      required:
        - pinctrl-names
        - pinctrl-0
        - pinctrl-1

unevaluatedProperties: false

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - interrupts
  - interrupt-map
  - interrupt-map-mask
  - ranges
  - bus-range
  - device_type
  - interconnects
  - pinctrl-names
  - nvidia,num-lanes

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    bus {
        #address-cells = <1>;
        #size-cells = <1>;

        pcie@80003000 {
            compatible = "nvidia,tegra20-pcie";
            device_type = "pci";
            reg = <0x80003000 0x00000800>,
                  <0x80003800 0x00000200>,
                  <0x90000000 0x10000000>;
            reg-names = "pads", "afi", "cs";
            interrupts = <GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 99 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "intr", "msi";
            interrupt-parent = <&intc>;

            #interrupt-cells = <1>;
            interrupt-map-mask = <0 0 0 0>;
            interrupt-map = <0 0 0 0 &intc GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>;

            bus-range = <0x00 0xff>;
            #address-cells = <3>;
            #size-cells = <2>;

            ranges = <0x02000000 0 0x80000000 0x80000000 0 0x00001000>,
                     <0x02000000 0 0x80001000 0x80001000 0 0x00001000>,
                     <0x01000000 0 0          0x82000000 0 0x00010000>,
                     <0x02000000 0 0xa0000000 0xa0000000 0 0x08000000>,
                     <0x42000000 0 0xa8000000 0xa8000000 0 0x18000000>;

            clocks = <&tegra_car 70>,
                     <&tegra_car 72>,
                     <&tegra_car 118>;
            clock-names = "pex", "afi", "pll_e";
            resets = <&tegra_car 70>,
                     <&tegra_car 72>,
                     <&tegra_car 74>;
            reset-names = "pex", "afi", "pcie_x";
            power-domains = <&pd_core>;
            operating-points-v2 = <&pcie_dvfs_opp_table>;

            status = "disabled";

            pci@1,0 {
                device_type = "pci";
                assigned-addresses = <0x82000800 0 0x80000000 0 0x1000>;
                reg = <0x000800 0 0 0 0>;
                bus-range = <0x00 0xff>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <2>;
            };

            pci@2,0 {
                device_type = "pci";
                assigned-addresses = <0x82001000 0 0x80001000 0 0x1000>;
                reg = <0x001000 0 0 0 0>;
                bus-range = <0x00 0xff>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <2>;
            };
        };
    };
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    bus {
        #address-cells = <1>;
        #size-cells = <1>;

        pcie@3000 {
            compatible = "nvidia,tegra30-pcie";
            device_type = "pci";
            reg = <0x00003000 0x00000800>,
                  <0x00003800 0x00000200>,
                  <0x10000000 0x10000000>;
            reg-names = "pads", "afi", "cs";
            interrupts = <GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 99 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "intr", "msi";
            interrupt-parent = <&intc>;

            #interrupt-cells = <1>;
            interrupt-map-mask = <0 0 0 0>;
            interrupt-map = <0 0 0 0 &intc GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>;

            bus-range = <0x00 0xff>;
            #address-cells = <3>;
            #size-cells = <2>;

            ranges = <0x02000000 0 0x00000000 0x00000000 0 0x00001000>,
                     <0x02000000 0 0x00001000 0x00001000 0 0x00001000>,
                     <0x02000000 0 0x00004000 0x00004000 0 0x00001000>,
                     <0x01000000 0 0          0x02000000 0 0x00010000>,
                     <0x02000000 0 0x20000000 0x20000000 0 0x08000000>,
                     <0x42000000 0 0x28000000 0x28000000 0 0x18000000>;

            clocks = <&tegra_car 70>,
                     <&tegra_car 72>,
                     <&tegra_car 193>,
                     <&tegra_car 215>;
            clock-names = "pex", "afi", "pll_e", "cml";
            resets = <&tegra_car 70>,
                     <&tegra_car 72>,
                     <&tegra_car 74>;
            reset-names = "pex", "afi", "pcie_x";
            power-domains = <&pd_core>;
            operating-points-v2 = <&pcie_dvfs_opp_table>;
            status = "disabled";

            pci@1,0 {
                device_type = "pci";
                assigned-addresses = <0x82000800 0 0x00000000 0 0x1000>;
                reg = <0x000800 0 0 0 0>;
                bus-range = <0x00 0xff>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <2>;
            };

            pci@2,0 {
                device_type = "pci";
                assigned-addresses = <0x82001000 0 0x00001000 0 0x1000>;
                reg = <0x001000 0 0 0 0>;
                bus-range = <0x00 0xff>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <2>;
            };

            pci@3,0 {
                device_type = "pci";
                assigned-addresses = <0x82001800 0 0x00004000 0 0x1000>;
                reg = <0x001800 0 0 0 0>;
                bus-range = <0x00 0xff>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <2>;
            };
        };
    };
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        pcie@1003000 {
            compatible = "nvidia,tegra124-pcie";
            device_type = "pci";
            reg = <0x0 0x01003000 0x0 0x00000800>,
                  <0x0 0x01003800 0x0 0x00000800>,
                  <0x0 0x02000000 0x0 0x10000000>;
            reg-names = "pads", "afi", "cs";
            interrupts = <GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 99 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "intr", "msi";
            interrupt-parent = <&gic>;

            #interrupt-cells = <1>;
            interrupt-map-mask = <0 0 0 0>;
            interrupt-map = <0 0 0 0 &gic GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>;

            bus-range = <0x00 0xff>;
            #address-cells = <3>;
            #size-cells = <2>;

            ranges = <0x02000000 0 0x01000000 0x0 0x01000000 0 0x00001000>,
                     <0x02000000 0 0x01001000 0x0 0x01001000 0 0x00001000>,
                     <0x01000000 0 0x0        0x0 0x12000000 0 0x00010000>,
                     <0x02000000 0 0x13000000 0x0 0x13000000 0 0x0d000000>,
                     <0x42000000 0 0x20000000 0x0 0x20000000 0 0x20000000>;

            clocks = <&tegra_car 70>,
                     <&tegra_car 72>,
                     <&tegra_car 231>,
                     <&tegra_car 268>;
            clock-names = "pex", "afi", "pll_e", "cml";
            resets = <&tegra_car 70>,
                     <&tegra_car 72>,
                     <&tegra_car 74>;
            reset-names = "pex", "afi", "pcie_x";
            status = "disabled";

            pci@1,0 {
                device_type = "pci";
                assigned-addresses = <0x82000800 0 0x01000000 0 0x1000>;
                reg = <0x000800 0 0 0 0>;
                bus-range = <0x00 0xff>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <2>;
            };

            pci@2,0 {
                device_type = "pci";
                assigned-addresses = <0x82001000 0 0x01001000 0 0x1000>;
                reg = <0x001000 0 0 0 0>;
                bus-range = <0x00 0xff>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <1>;
            };
        };
    };
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        pcie@1003000 {
            compatible = "nvidia,tegra210-pcie";
            device_type = "pci";
            reg = <0x0 0x01003000 0x0 0x00000800>,
                  <0x0 0x01003800 0x0 0x00000800>,
                  <0x0 0x02000000 0x0 0x10000000>;
            reg-names = "pads", "afi", "cs";
            interrupts = <GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 99 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "intr", "msi";
            interrupt-parent = <&gic>;

            #interrupt-cells = <1>;
            interrupt-map-mask = <0 0 0 0>;
            interrupt-map = <0 0 0 0 &gic GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>;


            bus-range = <0x00 0xff>;
            #address-cells = <3>;
            #size-cells = <2>;

            ranges = <0x02000000 0 0x01000000 0x0 0x01000000 0 0x00001000>,
                     <0x02000000 0 0x01001000 0x0 0x01001000 0 0x00001000>,
                     <0x01000000 0 0x0        0x0 0x12000000 0 0x00010000>,
                     <0x02000000 0 0x13000000 0x0 0x13000000 0 0x0d000000>,
                     <0x42000000 0 0x20000000 0x0 0x20000000 0 0x20000000>;

            clocks = <&tegra_car 70>,
                     <&tegra_car 72>,
                     <&tegra_car 263>,
                     <&tegra_car 300>;
            clock-names = "pex", "afi", "pll_e", "cml";
            resets = <&tegra_car 70>,
                     <&tegra_car 72>,
                     <&tegra_car 74>;
            reset-names = "pex", "afi", "pcie_x";

            pinctrl-names = "default", "idle";
            pinctrl-0 = <&pex_dpd_disable>;
            pinctrl-1 = <&pex_dpd_enable>;

            status = "disabled";

            pci@1,0 {
                device_type = "pci";
                assigned-addresses = <0x82000800 0 0x01000000 0 0x1000>;
                reg = <0x000800 0 0 0 0>;
                bus-range = <0x00 0xff>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <4>;
            };

            pci@2,0 {
                device_type = "pci";
                assigned-addresses = <0x82001000 0 0x01001000 0 0x1000>;
                reg = <0x001000 0 0 0 0>;
                bus-range = <0x00 0xff>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <1>;
            };
        };
    };
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/power/tegra186-powergate.h>
    #include <dt-bindings/memory/tegra186-mc.h>

    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        pcie@10003000 {
            compatible = "nvidia,tegra186-pcie";
            power-domains = <&bpmp TEGRA186_POWER_DOMAIN_PCX>;
            device_type = "pci";
            reg = <0x0 0x10003000 0x0 0x00000800>,
                  <0x0 0x10003800 0x0 0x00000800>,
                  <0x0 0x40000000 0x0 0x10000000>;
            reg-names = "pads", "afi", "cs";

            interrupts = <GIC_SPI 72 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 73 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "intr", "msi";
            interrupt-parent = <&gic>;

            #interrupt-cells = <1>;
            interrupt-map-mask = <0 0 0 0>;
            interrupt-map = <0 0 0 0 &gic GIC_SPI 72 IRQ_TYPE_LEVEL_HIGH>;

            bus-range = <0x00 0xff>;
            #address-cells = <3>;
            #size-cells = <2>;

            ranges = <0x02000000 0 0x10000000 0x0 0x10000000 0 0x00001000>,
                     <0x02000000 0 0x10001000 0x0 0x10001000 0 0x00001000>,
                     <0x02000000 0 0x10004000 0x0 0x10004000 0 0x00001000>,
                     <0x01000000 0 0x0        0x0 0x50000000 0 0x00010000>,
                     <0x02000000 0 0x50100000 0x0 0x50100000 0 0x07f00000>,
                     <0x42000000 0 0x58000000 0x0 0x58000000 0 0x28000000>;

            clocks = <&bpmp 3>,
                     <&bpmp 4>,
                     <&bpmp 512>;
            clock-names = "pex", "afi", "pll_e";

            resets = <&bpmp 29>,
                     <&bpmp 1>,
                     <&bpmp 30>;
            reset-names = "pex", "afi", "pcie_x";

            interconnects = <&mc TEGRA186_MEMORY_CLIENT_AFIR &emc>,
                            <&mc TEGRA186_MEMORY_CLIENT_AFIW &emc>;
            interconnect-names = "dma-mem", "write";

            iommus = <&smmu TEGRA186_SID_AFI>;
            iommu-map = <0x0 &smmu TEGRA186_SID_AFI 0x1000>;
            iommu-map-mask = <0x0>;

            status = "disabled";

            pci@1,0 {
                device_type = "pci";
                assigned-addresses = <0x82000800 0 0x10000000 0 0x1000>;
                reg = <0x000800 0 0 0 0>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <2>;
            };

            pci@2,0 {
                device_type = "pci";
                assigned-addresses = <0x82001000 0 0x10001000 0 0x1000>;
                reg = <0x001000 0 0 0 0>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <1>;
            };

            pci@3,0 {
                device_type = "pci";
                assigned-addresses = <0x82001800 0 0x10004000 0 0x1000>;
                reg = <0x001800 0 0 0 0>;
                status = "disabled";

                #address-cells = <3>;
                #size-cells = <2>;
                ranges;

                nvidia,num-lanes = <1>;
            };
        };
    };
