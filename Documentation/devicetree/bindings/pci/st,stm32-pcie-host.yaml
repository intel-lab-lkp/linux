%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/st,stm32-pcie-host.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STM32MP25 PCIe root complex driver

maintainers:
  - Christian Bruel <christian.bruel@foss.st.com>

description:
  PCIe root complex controller based on the Synopsys DesignWare PCIe core.

select:
  properties:
    compatible:
      const: st,stm32mp25-pcie-rc
  required:
    - compatible

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#
  - $ref: /schemas/pci/snps,dw-pcie-common.yaml#

properties:
  compatible:
    const: st,stm32mp25-pcie-rc

  reg:
    items:
      - description: Data Bus Interface (DBI) registers.
      - description: PCIe configuration registers.

  reg-names:
    items:
      - const: dbi
      - const: config

  resets:
    maxItems: 1

  reset-names:
    const: core

  clocks:
    maxItems: 1
    description: PCIe system clock

  clock-names:
    const: core

  phys:
    maxItems: 1

  phy-names:
    const: pcie-phy

  num-lanes:
    const: 1

  msi-parent:
    maxItems: 1

  reset-gpios:
    description: GPIO controlled connection to PERST# signal
    maxItems: 1

  wake-gpios:
    description: GPIO controlled connection to WAKE# input signal
    maxItems: 1

  st,limit-mrrs:
    description: If present limit downstream MRRS to 256B
    type: boolean

  st,max-payload-size:
    description: Maximum Payload size to use
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [128, 256]
    default: 128

  wakeup-source: true

  power-domains:
    maxItems: 1

  access-controllers:
    maxItems: 1

if:
  required:
    - wakeup-source
then:
  required:
    - wake-gpios

required:
  - interrupt-map
  - interrupt-map-mask
  - ranges
  - resets
  - reset-names
  - clocks
  - clock-names
  - phys
  - phy-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/st,stm32mp25-rcc.h>
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/phy/phy.h>
    #include <dt-bindings/reset/st,stm32mp25-rcc.h>

    pcie@48400000 {
        compatible = "st,stm32mp25-pcie-rc";
        device_type = "pci";
        num-lanes = <1>;
        reg = <0x48400000 0x400000>,
              <0x10000000 0x10000>;
        reg-names = "dbi", "config";
        #interrupt-cells = <1>;
        interrupt-map-mask = <0 0 0 7>;
        interrupt-map = <0 0 0 1 &intc 0 0 GIC_SPI 264 IRQ_TYPE_LEVEL_HIGH>,
                        <0 0 0 2 &intc 0 0 GIC_SPI 265 IRQ_TYPE_LEVEL_HIGH>,
                        <0 0 0 3 &intc 0 0 GIC_SPI 266 IRQ_TYPE_LEVEL_HIGH>,
                        <0 0 0 4 &intc 0 0 GIC_SPI 267 IRQ_TYPE_LEVEL_HIGH>;
        #address-cells = <3>;
        #size-cells = <2>;
        ranges = <0x01000000 0 0x10010000 0x10010000 0 0x10000>,
                 <0x02000000 0 0x10020000 0x10020000 0 0x7fe0000>,
                 <0x42000000 0 0x18000000 0x18000000 0 0x8000000>;
        bus-range = <0x00 0xff>;
        clocks = <&rcc CK_BUS_PCIE>;
        clock-names = "core";
        phys = <&combophy PHY_TYPE_PCIE>;
        phy-names = "pcie-phy";
        resets = <&rcc PCIE_R>;
        reset-names = "core";
        msi-parent = <&v2m0>;
        wakeup-source;
        wake-gpios = <&gpioh 5 (GPIO_ACTIVE_LOW | GPIO_PULL_UP)>;
        access-controllers = <&rifsc 76>;
        power-domains = <&CLUSTER_PD>;
    };
