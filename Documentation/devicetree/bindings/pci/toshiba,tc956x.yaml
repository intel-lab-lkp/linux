%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/toshiba,tc956x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Toshiba TC956x PCIe switch

maintainers:
  - Krishna chaitanya chundru <quic_krichai@quicinc.com>

description: |
  Toshiba TC956x PCIe switch has one upstream and three downstream
  ports. The 3rd downstream port has integrated endpoint device of
  Ethernet MAC. Other two downstream ports are supposed to connect
  to external device.

  The TC956x PCIe switch can be configured through I2C interface before
  PCIe link is established to change FTS, ASPM related entry delays,
  tx amplitude etc for better power efficiency and functionality.

properties:
  compatible:
    items:
      - enum:
          - "pci1179,0623"
      - const: pciclass,0604

  reg:
    maxItems: 1

  i2c-parent:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      A phandle to the parent I2C node and the slave address of the device
      used to do configure tc956x to change FTS, tx amplitude etc.
    items:
      - description: Phandle to the I2C controller node
      - description: I2C slave address

  vdd18-supply: true

  vdd09-supply: true

  vddc-supply: true

  vddio1-supply: true

  vddio2-supply: true

  vddio18-supply: true

  reset-gpios:
    maxItems: 1
    description:
      GPIO controlling the RESX# pin.

allOf:
  - $ref: "#/$defs/tc956x-node"

patternProperties:
  "^pcie@[1-3],0$":
    description:
      child nodes describing the internal downstream ports
      the tc956x switch.
    type: object
    $ref: "#/$defs/tc956x-node"
    unevaluatedProperties: false

$defs:
  tc956x-node:
    type: object

    properties:
      tc956x,tx-amplitude-microvolt:
        $ref: /schemas/types.yaml#/definitions/uint32
        description:
          Change Tx Margin setting for low power consumption.

      tc956x,no-dfe-support:
        type: boolean
        description:
          Disable DFE (Decision Feedback Equalizer), which mitigates
          intersymbol interference and some reflections caused by impedance mismatches.

    allOf:
      - $ref: /schemas/pci/pci-pci-bridge.yaml#

unevaluatedProperties: false

required:
  - vdd18-supply
  - vdd09-supply
  - vddc-supply
  - vddio1-supply
  - vddio2-supply
  - vddio18-supply
  - i2c-parent
  - reset-gpios

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    pcie {
        #address-cells = <3>;
        #size-cells = <2>;

        pcie@0 {
            device_type = "pci";
            reg = <0x0 0x0 0x0 0x0 0x0>;

            #address-cells = <3>;
            #size-cells = <2>;
            ranges;
            bus-range = <0x01 0xff>;

            pcie@0,0 {
                compatible = "pci1179,0623", "pciclass,0604";

                reg = <0x10000 0x0 0x0 0x0 0x0>;
                device_type = "pci";
                #address-cells = <3>;
                #size-cells = <2>;
                ranges;
                bus-range = <0x02 0xff>;

                i2c-parent = <&qup_i2c 0x77>;

                vdd18-supply = <&vdd>;
                vdd09-supply = <&vdd>;
                vddc-supply = <&vdd>;
                vddio1-supply = <&vdd>;
                vddio2-supply = <&vdd>;
                vddio18-supply = <&vdd>;

                reset-gpios = <&gpio 1 GPIO_ACTIVE_LOW>;

                pcie@1,0 {
                    reg = <0x20800 0x0 0x0 0x0 0x0>;
                    #address-cells = <3>;
                    #size-cells = <2>;
                    device_type = "pci";
                    ranges;
                    bus-range = <0x03 0xff>;

                    tc956x,no-dfe-support;
                };

                pcie@2,0 {
                    reg = <0x21000 0x0 0x0 0x0 0x0>;
                    #address-cells = <3>;
                    #size-cells = <2>;
                    device_type = "pci";
                    ranges;
                    bus-range = <0x04 0xff>;
                };

                pcie@3,0 {
                    reg = <0x21800 0x0 0x0 0x0 0x0>;
                    #address-cells = <3>;
                    #size-cells = <2>;
                    device_type = "pci";
                    ranges;
                    bus-range = <0x05 0xff>;

                    tc956x,tx-amplitude-microvolt = <10>;
                    ethernet@0,0 {
                        reg = <0x50000 0x0 0x0 0x0 0x0>;
                    };

                    ethernet@0,1 {
                        reg = <0x50100 0x0 0x0 0x0 0x0>;
                    };
                };
            };
        };
    };
