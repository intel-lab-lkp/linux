%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/airoha-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha Thermal Sensor and Monitor

maintainers:
  - Christian Marangi <ansuelsmth@gmail.com>

properties:
  compatible:
    enum:
      - airoha,en7581-thermal
      - airoha,an7583-thermal

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  airoha,chip-scu:
    description: phandle to the chip SCU syscon
    $ref: /schemas/types.yaml#/definitions/phandle

  '#thermal-sensor-cells':
    const: 0

required:
  - compatible
  - '#thermal-sensor-cells'

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: airoha,en7581-thermal
    then:
      required:
        - reg
        - interrupts
        - airoha,chip-scu

  - if:
      properties:
        compatible:
          contains:
            const: airoha,an7583-thermal
    then:
      properties:
        reg: false
        interrupts: false
        airoha,chip-scu: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    thermal-sensor@1efbd800 {
        compatible = "airoha,en7581-thermal";
        reg = <0x1efbd000 0xd5c>;
        interrupts = <GIC_SPI 23 IRQ_TYPE_LEVEL_HIGH>;
        airoha,chip-scu = <&chip_scu>;

        #thermal-sensor-cells = <0>;
    };

  - |
    thermal-sensor {
        compatible = "airoha,an7583-thermal";

        #thermal-sensor-cells = <0>;
    };
