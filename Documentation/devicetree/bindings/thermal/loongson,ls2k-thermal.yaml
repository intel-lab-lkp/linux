%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/loongson,ls2k-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Thermal sensors on Loongson-2 SoCs

maintainers:
  - zhanghongchen <zhanghongchen@loongson.cn>
  - Yinbo Zhu <zhuyinbo@loongson.cn>

properties:
  compatible:
    oneOf:
      - enum:
          - loongson,ls2k0300-thermal
          - loongson,ls2k1000-thermal
          - loongson,ls2k2000-thermal
      - items:
          - enum:
              - loongson,ls2k0500-thermal
          - const: loongson,ls2k1000-thermal

  reg:
    minItems: 1
    maxItems: 2

  interrupts:
    maxItems: 1

  '#thermal-sensor-cells':
    const: 1

  loongson,chipid:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the syscon with the Loongson-2K0300 CHIP ID.

required:
  - compatible
  - reg
  - interrupts

allOf:
  - $ref: /schemas/thermal/thermal-sensor.yaml#

  - if:
      properties:
        compatible:
          contains:
            const: loongson,ls2k0300-thermal
    then:
      properties:
        reg:
          items:
            - description: Thermal base register region
      required:
        - loongson,chipid

  - if:
      properties:
        compatible:
          contains:
            const: loongson,ls2k1000-thermal
    then:
      properties:
        loongson,chipid: false
        reg:
          items:
            - description: Thermal base register region

  - if:
      properties:
        compatible:
          contains:
            const: loongson,ls2k2000-thermal
    then:
      properties:
        loongson,chipid: false
        reg:
          items:
            - description: Thermal base register region
            - description: Thermal data output register region

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    thermal: thermal-sensor@1fe01500 {
        compatible = "loongson,ls2k1000-thermal";
        reg = <0x1fe01500 0x30>;
        interrupt-parent = <&liointc0>;
        interrupts = <7 IRQ_TYPE_LEVEL_LOW>;
        #thermal-sensor-cells = <1>;
    };

  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    thermal-sensor@16001500 {
       compatible = "loongson,ls2k0300-thermal";
       reg = <0x16001500 0x30>;
       interrupt-parent = <&liointc1>;
       interrupts = <20 IRQ_TYPE_LEVEL_HIGH>;
       loongson,chipid = <&chipid>;
       #thermal-sensor-cells = <1>;
    };
