%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/qcom,qmi-cooling.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm QMI based thermal mitigation (TMD) cooling devices

maintainers:
  - Gaurav Kohli <gaurav.kohli@oss.qualcomm.com>

description:
  Qualcomm QMI-based TMD cooling devices are used to mitigate thermal conditions
  across multiple remote subsystems. These devices operate based on junction
  temperature sensors (TSENS) associated with thermal zones for each subsystem.

properties:
  compatible:
    enum:
      - qcom,qmi-cooling-cdsp
      - qcom,qmi-cooling-cdsp1

patternProperties:
  "cdsp-tmd[0-9]*$":
    type: object

    description:
      Each subnode which represents qmi communication to CDSP.

    properties:
      label:
        maxItems: 1

      "#cooling-cells":
        $ref: /schemas/thermal/thermal-cooling-devices.yaml#/properties/#cooling-cells

    required:
      - label
      - "#cooling-cells"

    additionalProperties: false

required:
  - compatible

additionalProperties: false

examples:
  - |
    remoteproc-cdsp {
        cooling {
            compatible = "qcom,qmi-cooling-cdsp";

            cdsp_tmd0: cdsp-tmd0 {
              label = "cdsp_sw";
              #cooling-cells = <2>;
            };
        };
    };

  - |
    remoteproc-cdsp1 {
        cooling {
            compatible = "qcom,qmi-cooling-cdsp1";

            cdsp_tmd1: cdsp-tmd1 {
              label = "cdsp_sw";
              #cooling-cells = <2>;
            };
        };
    };
