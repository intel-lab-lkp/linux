%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/histb-dw-mshc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title:
  Hisilicon HiSTB SoCs specific extensions to the Synopsys DWMMC controller

maintainers:
  - Yang Xiwen <forbidden405@outlook.com>

description:
  The Synopsys designware mobile storage host controller is used to interface
  a SoC with storage medium such as eMMC or SD/MMC cards. This file documents
  differences between the core Synopsys dw mshc controller properties described
  by synopsys-dw-mshc.txt and the properties used by the Hisilicon HiSTB specific
  extensions to the Synopsys Designware Mobile Storage Host Controller.

properties:
  compatible:
    enum:
      - hisilicon,hi3798cv200-dw-mshc
      - hisilicon,hi3798mv200-dw-mshc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 4
    maxItems: 4
    description: A list of phandles for the clocks listed in clock-names

  clock-names:
    items:
      - const: ciu
      - const: biu
      - const: ciu-sample
      - const: ciu-drive
    description:
      Apart from the clock-names "biu" and "ciu" two more clocks
      "ciu-drive" and "ciu-sample" are added. They are used to
      control the clock phases, "ciu-sample" is required for tuning
      high speed modes.

  hisilicon,sap-dll-reg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      A phandle points to the sample delay-locked-loop(DLL)
      syscon node, used for tuning.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

allOf:
  - $ref: synopsys-dw-mshc-common.yaml#

  - if:
      properties:
        compatible:
          contains:
            const: hisilicon,hi3798mv200-dw-mshc
    then:
      required:
        - hisilicon,sap-dll-reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/histb-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    mmc@9830000 {
      compatible = "hisilicon,hi3798cv200-dw-mshc";
      reg = <0x9830000 0x10000>;
      interrupts = <GIC_SPI 35 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&crg HISTB_MMC_CIU_CLK>,
               <&crg HISTB_MMC_BIU_CLK>,
               <&crg HISTB_MMC_SAMPLE_CLK>,
               <&crg HISTB_MMC_DRV_CLK>;
      clock-names = "ciu", "biu", "ciu-sample", "ciu-drive";
      resets = <&crg 0xa0 4>;
      reset-names = "reset";
      pinctrl-names = "default";
      pinctrl-0 = <&emmc_pins_1 &emmc_pins_2
                   &emmc_pins_3 &emmc_pins_4>;
      fifo-depth = <256>;
      clock-frequency = <200000000>;
      cap-mmc-highspeed;
      mmc-ddr-1_8v;
      mmc-hs200-1_8v;
      non-removable;
      bus-width = <8>;
      status = "okay";
    };
  - |
    #include <dt-bindings/clock/histb-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    mmc@9830000 {
      compatible = "hisilicon,hi3798mv200-dw-mshc";
      reg = <0x9830000 0x10000>;
      interrupts = <GIC_SPI 35 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&crg HISTB_MMC_CIU_CLK>,
               <&crg HISTB_MMC_BIU_CLK>,
               <&crg HISTB_MMC_SAMPLE_CLK>,
               <&crg HISTB_MMC_DRV_CLK>;
      clock-names = "ciu", "biu", "ciu-sample", "ciu-drive";
      resets = <&crg 0xa0 4>;
      reset-names = "reset";
      pinctrl-names = "default";
      pinctrl-0 = <&emmc_pins>;
      fifo-depth = <256>;
      clock-frequency = <50000000>;
      max-frequency = <150000000>;
      cap-mmc-highspeed;
      mmc-ddr-1_8v;
      mmc-hs200-1_8v;
      mmc-hs400-1_8v;
      non-removable;
      bus-width = <8>;
      hisilicon,sap-dll-reg = <&emmc_sap_dll_reg>;
      status = "okay";
    };
