%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/imu/invensense,icm45600.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: InvenSense ICM-456xx Inertial Measurement Unit

maintainers:
  - Remi Buisson <remi.buisson@tdk.com>

description: |
  6-axis MotionTracking device that combines a 3-axis gyroscope and a 3-axis
  accelerometer.

  It has a configurable host interface that supports I3C, I2C and SPI serial
  communication, features up to 8kB FIFO and 2 programmable interrupts with
  ultra-low-power wake-on-motion support to minimize system power consumption.

  Other industry-leading features include InvenSense on-chip APEX Motion
  Processing engine for gesture recognition, activity classification, and
  pedometer, along with programmable digital filters, and an embedded
  temperature sensor.

  https://invensense.tdk.com/wp-content/uploads/documentation/DS-000576_ICM-45605.pdf

properties:
  compatible:
    enum:
      - invensense,icm45605
      - invensense,icm45686
      - invensense,icm45688p
      - invensense,icm45608
      - invensense,icm45634
      - invensense,icm45689
      - invensense,icm45606
      - invensense,icm45687

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 2

  interrupt-names:
    minItems: 1
    maxItems: 2
    items:
      enum:
        - INT1
        - INT2
    description: Choose chip interrupt pin to be used as interrupt input.

  drive-open-drain:
    type: boolean

  vdd-supply:
    description: Regulator that provides power to the sensor

  vddio-supply:
    description: Regulator that provides power to the bus

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        icm45605@68 {
            compatible = "invensense,icm45605";
            reg = <0x68>;
            interrupt-parent = <&gpio2>;
            interrupt-names = "INT1";
            interrupts = <7 IRQ_TYPE_EDGE_RAISING>;
            vdd-supply = <&vdd>;
            vddio-supply = <&vddio>;
            mount-matrix = "1", "0", "0",
                           "0", "1", "0",
                           "0", "0", "1";
        };
    };
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        icm45605@0 {
            compatible = "invensense,icm45605";
            reg = <0>;
            spi-max-frequency = <24000000>;
            interrupt-parent = <&gpio1>;
            interrupt-names = "INT1";
            interrupts = <6 IRQ_TYPE_EDGE_RAISING>;
            vdd-supply = <&vdd>;
            vddio-supply = <&vddio>;
            mount-matrix = "1", "0", "0",
                           "0", "1", "0",
                           "0", "0", "1";
        };
    };
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i3c {
        #address-cells = <3>;
        #size-cells = <0>;

        icm45600@68,46A00000011 {
            compatible = "invensense,icm45600";
            reg = <0x68 0x46A 0x84>;
            interrupt-parent = <&gpio1>;
            interrupt-names = "INT1";
            interrupts = <5 IRQ_TYPE_EDGE_RISING>;
            vdd-supply = <&vdd>;
            vddio-supply = <&vddio>;
            mount-matrix = "1", "0", "0",
                           "0", "1", "0",
                           "0", "0", "1";
        };
    };
