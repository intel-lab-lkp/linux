%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/proximity/tyhx,hx9023s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TYHX HX9023S capacitive proximity sensor

maintainers:
  - Yasin Lee <yasin.lee.x@gmail.com>

description: |
  TYHX HX9023S proximity sensor

allOf:
  - $ref: /schemas/iio/iio.yaml#

properties:
  compatible:
    const: tyhx,hx9023s

  reg:
    maxItems: 1

  interrupts:
    description: |
      Generated by device to announce preceding read request has finished
      and data is available or that a close/far proximity event has happened.
    maxItems: 1

  vdd-supply:
    true

  channel-in-use:
    description: |
      Bit flag indicating which channels are used,
      depends on the hardware circuit design.
    $ref: /schemas/types.yaml#/definitions/uint32

patternProperties:
  "^channel@[0-9]+$":
    type: object
    properties:
      reg:
        description: Channel register address
        $ref: /schemas/types.yaml#/definitions/uint32
      channel-positive:
        description: Positive channel assignments
        $ref: /schemas/types.yaml#/definitions/uint32
      channel-negative:
        description: Negative channel assignments
        $ref: /schemas/types.yaml#/definitions/uint32
    required:
      - reg
      - channel-positive
      - channel-negative

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;
      hx9023s@2a {
        compatible = "tyhx,hx9023s";
        reg = <0x2a>;
        interrupt-parent = <&pio>;
        interrupts = <16 IRQ_TYPE_EDGE_FALLING>;
        vdd-supply = <&pp1800_prox>;
        channel-in-use = <0x1F>;
        channel@0 {
          reg = <0>;
          channel-positive = <0>;
          channel-negative = <255>;
        };
        channel@1 {
          reg = <1>;
          channel-positive = <1>;
          channel-negative = <255>;
        };
        channel@2 {
          reg = <2>;
          channel-positive = <2>;
          channel-negative = <255>;
        };
        channel@3 {
          reg = <3>;
          channel-positive = <3>;
          channel-negative = <255>;
        };
        channel@4 {
          reg = <4>;
          channel-positive = <4>;
          channel-negative = <255>;
        };
      };
    };
