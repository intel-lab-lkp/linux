%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/avago,apds9300.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Avago Gesture, RGB, ALS and Proximity sensors

maintainers:
  - Jonathan Cameron <jic23@kernel.org>
  - Matt Ranostay <matt.ranostay@konsulko.com>

description: |
  Avago (Broadcom) optical and proximity sensors with I2C interfaces.
  Datasheet at https://docs.broadcom.com/doc/AV02-1077EN
  Datasheet at https://docs.broadcom.com/doc/AV02-4191EN

properties:
  compatible:
    oneOf:
      - items:
          - const: avago,apds9300
          - const: avago,apds9960
      - enum:
          - avago,apds9300
          - avago,apds9960

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg

allOf:
  - $ref: ../common.yaml#
  - if:
      properties:
        compatible:
          contains:
            enum:
              - avago,apds9960
    then:
      required:
        - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@39 {
            compatible = "avago,apds9300";
            reg = <0x39>;
            interrupt-parent = <&gpio2>;
            interrupts = <29 IRQ_TYPE_LEVEL_LOW>;
        };
    };
...
