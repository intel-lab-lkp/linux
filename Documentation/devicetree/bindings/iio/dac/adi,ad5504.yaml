%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/dac/adi,ad5504.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices AD5501 and AD5504 DACs

maintainers:
  - Lars-Peter Clausen <lars@metafoo.de>
  - Jonathan Cameron <jic23@kernel.org>

description:
  High voltage (up to 60V) DACs with temperature sensor alarm function

properties:
  compatible:
    enum:
      - adi,ad5501
      - adi,ad5504

  reg:
    maxItems: 1

  interrupts:
    description: Used for temperature alarm.
    maxItems: 1

  vcc-supply: true
  vlogic-supply: true

  adi,output-range-volts:
    description:
      Hard-wired /R_SEL pin state. 30 V when pin is high and 60 V when
      pin is low.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [30, 60]
    default: 60

  adi,output-range-gpios:
    description:
      GPIO connected to the R_SEL pin to select the output voltage range.
    maxItems: 1

  clear-gpios:
    description: GPIO that controls the /CLR pin (active low).
    maxItems: 1

  ldac-gpios:
    description: GPIO that controls the /LDAC pin (active low).
    maxItems: 1

additionalProperties: false

required:
  - compatible
  - reg
  - vcc-supply

allOf:
  - if:
      required:
        - adi,output-range-gpios
    then:
      properties:
        adi,output-range-volts: false

  - if:
      required:
        - adi,output-range-volts
    then:
      properties:
        adi,output-range-gpios: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;
        dac@0 {
            reg = <0>;
            compatible = "adi,ad5504";
            vcc-supply = <&dac_vcc>;
            interrupts = <55 IRQ_TYPE_EDGE_FALLING>;
        };
    };
...
