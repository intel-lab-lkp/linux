%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/accel/bosch,bma220.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bosch BMA220 Triaxial Acceleration Sensor

maintainers:
  - Jonathan Cameron <Jonathan.Cameron@huawei.com>

properties:
  compatible:
    enum:
      - bosch,bma220

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  bosch,watchdog:
    description:
      In order to prevent the built-in I2C slave to lock-up the I2C bus, a
      watchdog timer is introduced. The WDT observes internal I2C signals and
      resets the I2C interface if the bus is locked-up by the BMA220.
      0 - off
      1 - 1ms
      2 - 10ms
    enum: [0, 1, 2]
    $ref: /schemas/types.yaml#/definitions/uint32

  spi-cpha: true
  spi-cpol: true

  vdda-supply: true
  vddd-supply: true
  vddio-supply: true

required:
  - compatible
  - reg

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        accelerometer@0 {
            compatible = "bosch,bma220";
            reg = <0>;
            spi-max-frequency = <2500000>;
            spi-cpol;
            spi-cpha;
            interrupt-parent = <&gpio0>;
            interrupts = <0 IRQ_TYPE_EDGE_RISING>;
        };
    };
...
