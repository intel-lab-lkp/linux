%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/pressure/meas,ms5637.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Measurement Specialties ms5637 and similar pressure sensors

maintainers:
  - Louis Adamian <adamianlouis@gmail.com>

description:
  Measurement Specialties pressure and temperature sensors. The MS5803
  family supports both I2C and SPI interfaces. All other variants are I2C only.

properties:
  compatible:
    oneOf:
      - enum:
          - meas,ms5637-02ba
          - meas,ms5637-30ba
          - meas,ms5803-01ba
          - meas,ms5803-02ba
          - meas,ms5803-05ba
          - meas,ms5803-14ba
          - meas,ms5803-30ba
          - meas,ms5805
          - meas,ms5837-02ba
          - meas,ms5837-30ba
          - meas,ms8607-temppressure
      # These generic compatible strings do not identify the sub-variants of
      # the part. They are retained so that existing device trees continue
      # to bind, and each is treated as the -02BA variant of its family.
      - enum:
          - meas,ms5637
          - meas,ms5803
          - meas,ms5837
        deprecated: true

  reg:
    maxItems: 1

  vdd-supply:
    description: Regulator that provides power to the sensor

required:
  - compatible
  - reg
  - vdd-supply

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - meas,ms5803
              - meas,ms5803-01ba
              - meas,ms5803-02ba
              - meas,ms5803-05ba
              - meas,ms5803-14ba
              - meas,ms5803-30ba
    then:
      $ref: /schemas/spi/spi-peripheral-props.yaml#
      properties:
        spi-max-frequency:
          maximum: 20000000

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pressure@76 {
            compatible = "meas,ms5637-02ba";
            reg = <0x76>;
            vdd-supply = <&vcc_3v3>;
        };
    };
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        pressure@0 {
            compatible = "meas,ms5803-14ba";
            reg = <0>;
            vdd-supply = <&vcc_3v3>;
            spi-max-frequency = <20000000>;
        };
    };
