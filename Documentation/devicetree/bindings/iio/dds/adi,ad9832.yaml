%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/dds/adi,ad9832.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices AD9832 / AD9835 DDS

maintainers:
  - Hungyu Lin <dennylin0707@gmail.com>

description: |
  Analog Devices AD9832 and AD9835 are SPI-controlled direct digital
  synthesizers (DDS) capable of generating programmable frequency and
  phase output signals using an external master clock.

properties:
  compatible:
    enum:
      - adi,ad9832
      - adi,ad9835

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 20000000

  clocks:
    maxItems: 1

  clock-names:
    const: mclk

  avdd-supply:
    description: Analog power supply

  dvdd-supply:
    description: Digital power supply

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - avdd-supply
  - dvdd-supply

unevaluatedProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        ad9832@0 {
            compatible = "adi,ad9832";
            reg = <0>;
            spi-max-frequency = <20000000>;
            clocks = <&mclk>;
            clock-names = "mclk";
            avdd-supply = <&vdd_3v3>;
            dvdd-supply = <&vdd_3v3>;
        };
    };
