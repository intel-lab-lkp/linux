%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/xlnx,xadc.yaml#
$schema: http://devicetree.org/schemas/meta-schema.yaml#

title: Xilinx XADC device driver

maintainers:
  - Omer PALA <palaomer100@gmail.com>

description: |
  This binding document describes the bindings for the Xilinx 7 Series XADC as well
  as the UltraScale/UltraScale+ System Monitor.

properties:
  compatible:
    enum:
      - xlnx,zynq-xadc-1.00.a
      - xlnx,axi-xadc-1.00.a
      - xlnx,system-management-wiz-1.3

  reg:
    description: Address and length of the register set for the device
    maxItems: 1

  interrupts:
    description: Interrupt for the XADC control interface.
    maxItems: 1

  clocks:
    maxItems: 1

  interrupt-parent: true

  xlnx,external-mux:
    description: Selects the external mux mode.
    enum: [none, single, dual]
    default: none

  xlnx,external-mux-channel:
    description: >
      Configures which pair of pins is used to sample data in
      external mux mode.
    $ref: /schemas/types.yaml#/definitions/uint32

  xlnx,channels:
    type: object
    description: List of external channels that are connected to the ADC.
    properties:
      "#address-cells":
        const: 1
      "#size-cells":
        const: 0
    patternProperties:
      "^channel@[0-9a-f]+$":
        type: object
        properties:
          reg:
            description: Pair of pins the channel is connected to
            minimum: 0
            maximum: 16
          xlnx,bipolar:
            description: If set the channel is used in bipolar mode.
            $ref: /schemas/types.yaml#/definitions/flag
        required:
          - reg
        additionalProperties: false
    additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

allOf:
  - if:
      properties:
        xlnx,external-mux:
          const: single
    then:
      properties:
        xlnx,external-mux-channel:
          minimum: 0
          maximum: 16

  - if:
      properties:
        xlnx,external-mux:
          const: dual
    then:
      properties:
        xlnx,external-mux-channel:
          minimum: 1
          maximum: 8

examples:
  - |
    soc {
      #address-cells = <1>;
      #size-cells = <1>;

      xadc@f8007100 {
        compatible = "xlnx,zynq-xadc-1.00.a";
        reg = <0xf8007100 0x20>;
        interrupts = <0 7 4>;
        interrupt-parent = <&gic>;
        clocks = <&pcap_clk>;

        xlnx,channels {
          #address-cells = <1>;
          #size-cells = <0>;

          channel@0 {
            reg = <0>;
          };
          channel@1 {
            reg = <1>;
          };
          channel@8 {
            reg = <8>;
          };
        };
      };
      xadc@43200000 {
        compatible = "xlnx,axi-xadc-1.00.a";
        reg = <0x43200000 0x1000>;
        interrupts = <0 53 4>;
        interrupt-parent = <&gic>;
        clocks = <&fpga1_clk>;

        xlnx,channels {
          #address-cells = <1>;
          #size-cells = <0>;
          channel@0 {
            reg = <0>;
            xlnx,bipolar;
          };
        };
      };
      adc@80000000 {
        compatible = "xlnx,system-management-wiz-1.3";
        reg = <0x80000000 0x1000>;
        interrupts = <0 81 4>;
        interrupt-parent = <&gic>;
        clocks = <&fpga1_clk>;

        xlnx,channels {
          #address-cells = <1>;
          #size-cells = <0>;
          channel@0 {
            reg = <0>;
            xlnx,bipolar;
          };
        };
      };
    };
