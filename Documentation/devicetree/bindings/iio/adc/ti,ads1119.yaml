%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/ti,ads1119.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments ADS1119 ADC

maintainers:
  - João Paulo Gonçalves <jpaulo.silvagoncalves@gmail.com>

description: |
  The TI ADS1119 is a precision 16-bit ADC over I2C that offers single-ended and
  differential measurements using a multiplexed input. It features a programmable
  gain, a programmable sample rate, an internal oscillator and voltage reference,
  and a 50/60Hz rejection filter.

properties:
  compatible:
    const: ti,ads1119

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vref-supply:
    description:
      ADC external reference voltage (VREF).

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  "#io-channel-cells":
    const: 1

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

patternProperties:
  "^channel@([0-6])$":
    $ref: adc.yaml
    type: object
    description: |
      ADC channels.

    properties:
      reg:
        description: |
          0: Voltage over AIN0 and AIN1.
          1: Voltage over AIN2 and AIN3.
          2: Voltage over AIN1 and AIN2.
          3: Voltage over AIN0 and GND.
          4: Voltage over AIN1 and GND.
          5: Voltage over AIN2 and GND.
          6: Voltage over AIN3 and GND.
        items:
          - minimum: 0
            maximum: 6

      ti,gain:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: |
          PGA gain value.
        enum: [1, 4]
        default: 1

      ti,datarate:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: |
          Data acquisition rate in samples per second.
        enum: [20, 90, 330, 1000]
        default: 20

    required:
      - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        adc@40 {
            compatible = "ti,ads1119";
            reg = <0x40>;
            #address-cells = <1>;
            #size-cells = <0>;
            #io-channel-cells = <1>;

            channel@0 {
                reg = <0>;
                ti,gain = <4>;
                ti,datarate = <330>;
            };

            channel@4 {
                reg = <4>;
                ti,datarate = <1000>;
            };

            channel@5 {
                reg = <5>;
                ti,gain = <4>;
            };
        };
    };
