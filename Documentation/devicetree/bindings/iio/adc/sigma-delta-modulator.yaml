%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/sigma-delta-modulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sigma delta modulator

maintainers:
  - Arnaud Pouliquen <arnaud.pouliquen@foss.st.com>

properties:
  compatible:
    description: |
      "sd-modulator" can be used as a generic SD modulator,
      if the modulator is not specified in the compatible list.
    enum:
      - sd-modulator
      - ads1201

  '#io-backend-cells':
    const: 0

  '#io-channel-cells':
    const: 0

  reg:
    maxItems: 1

  vref-supply:
    description: Phandle to the vref input analog reference voltage.

required:
  - compatible

allOf:
  - anyOf:
    - required: ['#io-backend-cells']
    - required: ['#io-channel-cells']

additionalProperties: false

examples:
  - |
    // Exemple1: SD modulator is an IIO backend device
    ads1201_0 {
      compatible = "ti,ads1201";
      #io-backend-cells = <0>;
    };

    //Example2: SD modulator is an IIO channel provider
    ads1201_1 {
      compatible = "sd-modulator";
      #io-channel-cells = <0>;
    };

...
