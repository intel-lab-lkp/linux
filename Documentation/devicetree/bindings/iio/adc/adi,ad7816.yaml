%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/adi,ad7816.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices ADC AD7816

maintainers:
  - Omer PALA <palaomer100@gmail.com>

description: |
  This schema defines devicetree rules for
  Analog Devices ADC AD7816

properties:
  compatible:
    enum:
      - adi,ad7816
      - adi,ad7817
      - adi,ad7818

  reg:
    maxItems: 1

  spi-max-frequency: true

  interrupts:
    maxItems: 1
    description: Base interrupt pin for AD7816

  rdwr-gpios:
    maxItems: 1
    description: I/O control pin

  convert-gpios:
    maxItems: 1
    description: Conversion start pin

  busy-gpios:
    maxItems: 1
    description: Busy pin

required:
  - compatible
  - reg
  - rdwr-gpios
  - convert-gpios

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

  - if:
      properties:
        compatible:
          contains:
            enum:
              - adi,ad7816
              - adi,ad7817

    then:
      required:
        - busy-gpios

unevaluatedProperties: false

examples:
  - |
    spi {
      #address-cells = <1>;
      #size-cells = <0>;

      adc@0 {
        compatible = "adi,ad7816";
        reg = <0>;
        spi-max-frequency = <1000000>;

        rdwr-gpios = <&gpio0 1 0>;
        convert-gpios = <&gpio0 2 0>;
        busy-gpios = <&gpio0 3 0>;
      };
    };
