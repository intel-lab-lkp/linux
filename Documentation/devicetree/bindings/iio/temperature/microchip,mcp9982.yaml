%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/temperature/microchip,mcp9982.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip MCP998X/33 and MCP998XD/33D Multichannel Automotive
       Temperature Monitor Family

maintainers:
  - Victor Duicu <victor.duicu@microchip.com>

description: |
  The MCP998X/33 and MCP998XD/33D family is a high-accuracy 2-wire multichannel
  automotive temperature monitor.
  The datasheet can be found here:
    https://ww1.microchip.com/downloads/aemDocuments/documents/MSLD/ProductDocuments/DataSheets/MCP998X-Family-Data-Sheet-DS20006827.pdf

properties:
  compatible:
    enum:
      - microchip,mcp9933
      - microchip,mcp9933d
      - microchip,mcp9982
      - microchip,mcp9982d
      - microchip,mcp9983
      - microchip,mcp9983d
      - microchip,mcp9984
      - microchip,mcp9984d
      - microchip,mcp9985
      - microchip,mcp9985d

  reg:
    maxItems: 1

  interrupts:
    maxItems: 2

  interrupt-names:
    description:
      alert1 indicates a HIGH or LOW limit was exceeded.
      alert2 indicates a THERM limit was exceeded.
    items:
      - const: alert1
      - const: alert2

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  microchip,apdd-state:
    description:
      Enable anti-parallel diode mode operation.
      MCP9984/84D/85/85D and MCP9933/33D support reading two external diodes
      in anti-parallel connection on the same set of pins.
      Omit this tag to disable anti-parallel diode mode.
    type: boolean

  microchip,recd12:
    description:
      Enable resistance error correction for external channels 1 and 2.
      Omit this tag to disable REC for channels 1 and 2.
    type: boolean

  microchip,recd34:
    description:
      Enable resistance error correction for external channels 3 and 4.
      Omit this tag to disable REC for channels 3 and 4.
    type: boolean

  label:
    description: Unique name to identify which device this is.

  vdd-supply: true

patternProperties:
  "^channel@[1-4]$":
    description:
      Represents the external temperature channels to which
      a remote diode is connected.
    type: object

    properties:
      reg:
        items:
          minimum: 1
          maximum: 4

      microchip,ideality-factor:
        description:
          Each channel has an ideality factor.
          Beta compensation and resistance error correction automatically
          correct for most ideality errors. So ideality factor does not need
          to be adjusted in general.
          Omit this tag in order to set the default value.
        $ref: /schemas/types.yaml#/definitions/uint32
        default: 18

      label:
        description: Unique name to identify which channel this is.

    required:
      - reg

    additionalProperties: false

required:
  - compatible
  - reg
  - vdd-supply

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - microchip,mcp9982
              - microchip,mcp9982d
              - microchip,mcp9983
              - microchip,mcp9983d
    then:
      properties:
        microchip,apdd-state: false
  - if:
      properties:
        compatible:
          contains:
            enum:
              - microchip,mcp9982
              - microchip,mcp9982d
              - microchip,mcp9933
              - microchip,mcp9933d
    then:
      properties:
        microchip,recd34: false

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        temperature-sensor@4c {
            compatible = "microchip,mcp9985";
            reg = <0x4c>;

            #address-cells = <1>;
            #size-cells = <0>;

            label = "temperature-sensor";

            microchip,apdd-state;
            microchip,recd12;
            microchip,recd34;
            vdd-supply = <&vdd>;

            channel@1 {
                reg = <0x1>;
                label = "CPU Temperature";
            };

            channel@2 {
                reg = <0x2>;
                label = "GPU Temperature";
            };
        };
    };

...
