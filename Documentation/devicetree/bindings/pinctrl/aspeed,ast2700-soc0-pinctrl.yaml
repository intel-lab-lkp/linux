%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/aspeed,ast2700-soc0-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ASPEED AST2700 SoC0 Pin Controller

maintainers:
  - Billy Tsai <billy_tsai@aspeedtech.com>

description:
  The AST2700 features a dual-SoC architecture with two interconnected SoCs,
  each having its own System Control Unit (SCU) for independent pin control.
  This pin controller manages the pin multiplexing for SoC0.

  The SoC0 pin controller manages pin functions including eMMC, VGA DDC,
  dual USB3/USB2 ports (A and B), JTAG, and PCIe root complex interfaces.

properties:
  compatible:
    const: aspeed,ast2700-soc0-pinctrl

patternProperties:
  '-state$':
    type: object
    allOf:
      - $ref: pinmux-node.yaml#
      - $ref: pincfg-node.yaml#
    additionalProperties: false

    properties:
      function:
        enum:
          - EMMC
          - JTAGDDR
          - JTAGM0
          - JTAGPCIEA
          - JTAGPCIEB
          - JTAGPSP
          - JTAGSSP
          - JTAGTSP
          - JTAGUSB3A
          - JTAGUSB3B
          - PCIERC0PERST
          - PCIERC1PERST
          - TSPRSTN
          - UFSCLKI
          - USB2AD0
          - USB2AD1
          - USB2AH
          - USB2AHP
          - USB2AHPD0
          - USB2AXH
          - USB2AXH2B
          - USB2AXHD1
          - USB2AXHP
          - USB2AXHP2B
          - USB2AXHPD1
          - USB2BD0
          - USB2BD1
          - USB2BH
          - USB2BHP
          - USB2BHPD0
          - USB2BXH
          - USB2BXH2A
          - USB2BXHD1
          - USB2BXHP
          - USB2BXHP2A
          - USB2BXHPD1
          - USB3AXH
          - USB3AXH2B
          - USB3AXHD
          - USB3AXHP
          - USB3AXHP2B
          - USB3AXHPD
          - USB3BXH
          - USB3BXH2A
          - USB3BXHD
          - USB3BXHP
          - USB3BXHP2A
          - USB3BXHPD
          - VB
          - VGADDC

      groups:
        enum:
          - EMMCCDN
          - EMMCG1
          - EMMCG4
          - EMMCG8
          - EMMCWPN
          - JTAG0
          - PCIERC0PERST
          - PCIERC1PERST
          - TSPRSTN
          - UFSCLKI
          - USB2A
          - USB2AAP
          - USB2ABP
          - USB2ADAP
          - USB2AH
          - USB2AHAP
          - USB2B
          - USB2BAP
          - USB2BBP
          - USB2BDBP
          - USB2BH
          - USB2BHBP
          - USB3A
          - USB3AAP
          - USB3ABP
          - USB3B
          - USB3BAP
          - USB3BBP
          - VB0
          - VB1
          - VGADDC

required:
  - compatible

allOf:
  - $ref: pinctrl.yaml#

additionalProperties: false
