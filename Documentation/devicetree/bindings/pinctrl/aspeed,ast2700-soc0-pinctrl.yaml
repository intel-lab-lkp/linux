%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/aspeed,ast2700-soc0-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ASPEED AST2700 SoC0 Pin Controller

maintainers:
  - Billy Tsai <billy_tsai@aspeedtech.com>

description:
  The AST2700 features a dual-SoC architecture with two interconnected SoCs,
  each having its own System Control Unit (SCU) for independent pin control.
  This pin controller manages the pin multiplexing for SoC0.

  The SoC0 pin controller manages pin functions including eMMC, VGA DDC,
  dual USB3/USB2 ports (A and B), JTAG, and PCIe root complex interfaces.

properties:
  compatible:
    const: aspeed,ast2700-soc0-pinctrl

patternProperties:
  '-state$':
    type: object
    $ref: pinmux-node.yaml#
    additionalProperties: false

    properties:
      function:
        enum:
          - EMMC
          - VB
          - TSPRSTN
          - UFSCLKI
          - VGADDC
          - USB3AXHD
          - USB3AXHPD
          - USB3AXH
          - USB3AXHP
          - USB3AXH2B
          - USB3AXHP2B
          - USB3BXHD
          - USB3BXHPD
          - USB3BXH
          - USB3BXHP
          - USB3BXH2A
          - USB3BXHP2A
          - USB2AXHD1
          - USB2AXHPD1
          - USB2AXH
          - USB2AXHP
          - USB2AXH2B
          - USB2AXHP2B
          - USB2AD1
          - USB2AHPD0
          - USB2AH
          - USB2AHP
          - USB2AD0
          - USB2BXHD1
          - USB2BXHPD1
          - USB2BXH
          - USB2BXHP
          - USB2BXH2A
          - USB2BXHP2A
          - USB2BD1
          - USB2BHPD0
          - USB2BH
          - USB2BHP
          - USB2BD0
          - JTAGPSP
          - JTAGSSP
          - JTAGTSP
          - JTAGDDR
          - JTAGUSB3A
          - JTAGUSB3B
          - JTAGPCIEA
          - JTAGPCIEB
          - JTAGM0
          - PCIERC0PERST
          - PCIERC1PERST

      groups:
        enum:
          - EMMCG1
          - EMMCG4
          - EMMCG8
          - EMMCWPN
          - EMMCCDN
          - VGADDC
          - VB1
          - VB0
          - TSPRSTN
          - UFSCLKI
          - USB3A
          - USB3AAP
          - USB3ABP
          - USB3B
          - USB3BAP
          - USB3BBP
          - USB2A
          - USB2AAP
          - USB2ABP
          - USB2ADAP
          - USB2AH
          - USB2AHAP
          - USB2B
          - USB2BBP
          - USB2BAP
          - USB2BDBP
          - USB2BH
          - USB2BHBP
          - JTAG0
          - PCIERC0PERST
          - PCIERC1PERST

    pins:
      $ref: /schemas/types.yaml#/definitions/string-array
    drive-strength:
      minimum: 0
      maximum: 15

allOf:
  - $ref: pinctrl.yaml#

required:
  - compatible

additionalProperties: false
