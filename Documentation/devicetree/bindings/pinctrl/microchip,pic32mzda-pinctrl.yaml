%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/microchip,pic32mzda-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip PIC32 Pin Controller

maintainers:
  - Linus Walleij <linusw@kernel.org>

description: |
  PIC32 pin configuration node is a node of a group of pins which can be used
  for a specific device or function. This node represents configurations of
  pins, optional function, and optional mux related configuration.

properties:
  compatible:
    const: microchip,pic32mzda-pinctrl

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

patternProperties:
  '^[a-z0-9]+[_-].*$':
    type: object
    description: |
      Pin configuration node with pin muxing and configuration properties.
      Can be either a direct pin configuration node or a container node
      with child pin configuration nodes.

    properties:
      pins:
        description: |
          List of pins to which the configuration applies.
        items:
          type: string
        minItems: 1

      bias-pull-up: true
      bias-pull-down: true
      input-enable: true
      output-low: true
      output-high: true

      microchip,digital:
        description: Enable digital I/O.
        type: boolean

      microchip,analog:
        description: Enable analog I/O.
        type: boolean

    patternProperties:
      '^[a-z]+[0-9]+-[a-z]+$':
        type: object
        description: |
          Child pin configuration node.

        properties:
          pins:
            items:
              type: string
            minItems: 1

          function:
            description: |
              A string containing the name of the function to mux pin.
            enum: [ U2TX, U2RX, U4TX, U4RX ]

          bias-pull-up: true
          bias-pull-down: true
          input-enable: true
          output-low: true
          output-high: true

          microchip,digital:
            description: Enable digital I/O.
            type: boolean

          microchip,analog:
            description: Enable analog I/O.
            type: boolean

        required:
          - pins

        additionalProperties: false

    additionalProperties: false

required:
  - compatible
  - reg
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/microchip,pic32-clock.h>

    pic32_pinctrl: pinctrl@1f801400 {
        #address-cells = <1>;
        #size-cells = <1>;
        compatible = "microchip,pic32mzda-pinctrl";
        reg = <0x1f801400 0x400>;
        clocks = <&rootclk PB1CLK>;

        pinctrl_uart2: pinctrl_uart2 {
            uart2-tx {
                pins = "G9";
                function = "U2TX";
                microchip,digital;
                output-low;
            };

            uart2-rx {
                pins = "B0";
                function = "U2RX";
                microchip,digital;
                input-enable;
            };
        };
    };

    uart2: serial@1f822200 {
        compatible = "microchip,pic32mzda-uart";
        reg = <0x1f822200 0x50>;
        pinctrl-names = "default";
        pinctrl-0 = <&pinctrl_uart2>;
    };
