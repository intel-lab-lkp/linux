%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/amlogic,meson-pinctrl-a4.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic A4 pinmux controller

maintainers:
  - Neil Armstrong <neil.armstrong@linaro.org>
  - Xianwei Zhao <xianwei.zhao@amlogic.com>

allOf:
  - $ref: amlogic,meson-pinctrl-common.yaml#

properties:
  compatible:
    enum:
      - amlogic,a4-aobus-pinctrl
      - amlogic,a4-periphs-pinctrl

required:
  - compatible

patternProperties:
  "^bank@[0-9a-f]+$":
    $ref: amlogic,meson-pinctrl-common.yaml#/$defs/meson-gpio

    unevaluatedProperties: false

    properties:
      reg:
        maxItems: 2

      reg-names:
        items:
          - const: mux
          - const: gpio

      gpio-controller: true

      "#gpio-cells":
        const: 3

      gpio-line-names:
        minItems: 8
        maxItems: 73

unevaluatedProperties:
  type: object
  $ref: amlogic,meson-pinctrl-common.yaml#/$defs/meson-pins

examples:
  - |
    bus {
      #address-cells = <2>;
      #size-cells = <2>;

      periphs_pinctrl: pinctrl@4000 {
        compatible = "amlogic,a4-periphs-pinctrl";
        #address-cells = <2>;
        #size-cells = <2>;
        ranges = <0x0 0x0 0x0 0x4000 0x0 0x02e0>;

        bank@0 {
          reg = <0x0 0x0 0x0 0x0050>,
                <0x0 0xc0 0x0 0x0220>;
          reg-names = "mux", "gpio";
          gpio-controller;
          #gpio-cells = <3>;
          gpio-ranges = <&periphs_pinctrl 0 0 73>;
        };

        cec_ao_a_h_pins: cec_ao_a_h {
          mux {
            groups = "cec_ao_a_h";
            function = "cec_ao_a_h";
            bias-disable;
          };
        };
      };
    };
