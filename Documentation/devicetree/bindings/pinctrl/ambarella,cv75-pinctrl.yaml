%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/ambarella,cv75-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ambarella CV75 Pin Controller

maintainers:
  - Long Zhao <longzhao@ambarella.com>

description:
  The Ambarella CV75 pin controller configures pin multiplexing, bias and
  drive strength for the main GPIO banks. Pin groups and their mux settings
  are defined by the pin controller driver and selected by function and group
  names.

allOf:
  - $ref: pinctrl.yaml#

properties:
  compatible:
    const: ambarella,cv75-pinctrl

  reg:
    maxItems: 1
    description: IOMUX registers

  ambarella,drive-strength-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: RCT syscon containing the drive-strength registers.

  ambarella,pull-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Secure scratchpad syscon containing the pull registers.

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges: true

patternProperties:
  "^gpio@[0-9a-f]+$":
    type: object
    additionalProperties: false

    properties:
      reg:
        maxItems: 1

      interrupts:
        maxItems: 1

      gpio-controller: true

      "#gpio-cells":
        const: 2

      gpio-ranges:
        maxItems: 1

      interrupt-controller: true

      "#interrupt-cells":
        const: 2

    required:
      - reg
      - interrupts
      - gpio-controller
      - "#gpio-cells"
      - gpio-ranges
      - interrupt-controller
      - "#interrupt-cells"

  "^[a-z0-9-]+-pins$":
    type: object
    allOf:
      - $ref: pinmux-node.yaml#
      - $ref: pincfg-node.yaml#
    additionalProperties: false

    properties:
      function:
        const: uart0

      groups:
        $ref: /schemas/types.yaml#/definitions/string-array
        items:
          enum: [uart0tx, uart0rx]
        minItems: 2
        maxItems: 2
        uniqueItems: true

      bias-disable: true
      bias-pull-down: true
      bias-pull-up: true

      drive-strength:
        enum: [3, 4, 5, 6, 7, 8, 9, 12]

    required:
      - function
      - groups

required:
  - compatible
  - reg
  - ambarella,drive-strength-syscon
  - ambarella,pull-syscon
  - "#address-cells"
  - "#size-cells"
  - ranges

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    rct: rct {
    };

    scratchpad: scratchpad {
    };

    pinctrl: pinctrl@e4010000 {
        compatible = "ambarella,cv75-pinctrl";
        #address-cells = <1>;
        #size-cells = <1>;
        reg = <0xe4010000 0x1000>;
        ranges;
        ambarella,drive-strength-syscon = <&rct>;
        ambarella,pull-syscon = <&scratchpad>;

        gpio0: gpio@e4013000 {
            reg = <0xe4013000 0x1000>;
            interrupts = <GIC_SPI 163 IRQ_TYPE_LEVEL_HIGH>;
            gpio-controller;
            #gpio-cells = <2>;
            gpio-ranges = <&pinctrl 0 0 32>;
            interrupt-controller;
            #interrupt-cells = <2>;
        };

        gpio1: gpio@e4014000 {
            reg = <0xe4014000 0x1000>;
            interrupts = <GIC_SPI 164 IRQ_TYPE_LEVEL_HIGH>;
            gpio-controller;
            #gpio-cells = <2>;
            gpio-ranges = <&pinctrl 0 32 32>;
            interrupt-controller;
            #interrupt-cells = <2>;
        };

        gpio2: gpio@e4015000 {
            reg = <0xe4015000 0x1000>;
            interrupts = <GIC_SPI 165 IRQ_TYPE_LEVEL_HIGH>;
            gpio-controller;
            #gpio-cells = <2>;
            gpio-ranges = <&pinctrl 0 64 32>;
            interrupt-controller;
            #interrupt-cells = <2>;
        };

        uart0-pins {
            function = "uart0";
            groups = "uart0tx", "uart0rx";
            bias-disable;
            drive-strength = <8>;
        };
    };
