%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/st,led1202.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ST LED1202 LED controllers

maintainers:
  - Vicentiu Galanopulo <vicentiu.galanopulo@remote-tech.co.uk>

description:
  The LED1202 is a 12-channel low quiescent current LED controller
  programmable via I2C; The output current can be adjusted separately
  for each channel by 8-bit analog and 12-bit digital dimming control.

  Datasheet available at
  https://www.st.com/en/power-management/led1202.html

properties:
  compatible:
    enum:
      - st,led1202

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^led@[0-9a-f]+$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        minimum: 0
        maximum: 11

    required:
      - reg

additionalProperties: true

examples:
  - |
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@58 {
            compatible = "st,led1202";
            reg = <0x58>;
            address-cells = <1>;
            size-cells = <0>;

            led@0 {
                reg = <0>;
                label = "led1_r";
                active = <1>;
            };

            led@1 {
                reg = <1>;
                label = "led1_g";
                active = <1>;
            };

            led@2 {
                reg = <2>;
                label = "led1_b";
                active = <1>;
            };

            led@3 {
                reg = <3>;
                label = "led2_r";
                active = <1>;
            };

            led@4 {
                reg = <4>;
                label = "led2_g";
                active = <1>;
            };

            led@5 {
                reg = <5>;
                label = "led2_b";
                active = <1>;
            };

            led@6 {
                reg = <6>;
                label = "led3_r";
                active = <1>;
            };

            led@7 {
                reg = <7>;
                label = "led3_g";
                active = <1>;
            };

            led@8 {
                reg = <8>;
                label = "led3_b";
                active = <1>;
            };

            led@9 {
                reg = <9>;
                active = <0>;
            };

            led@a {
                reg = <10>;
                active = <0>;
            };

            led@b {
                reg = <11>;
                active = <0>;
            };
        };
    };

...
