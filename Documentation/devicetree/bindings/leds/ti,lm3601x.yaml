%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/ti,lm3601x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments - lm3601x Single-LED Flash Driver

description: |
  The LM3601X are ultra-small LED flash drivers
  that provide a high level of adjustability.

  For more product information please see the links below:
  https://www.ti.com/product/LM36010
  https://www.ti.com/product/LM36011

maintainers:
  - Dan Murphy <dmurphy@ti.com>

properties:
  compatible:
    enum:
      - "ti,lm36010"
      - "ti,lm36011"

  reg:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  "^led@[0,1]?([0-9]|[a-z])$":
    type: object
    $ref: common.yaml#
    properties:
      reg:
        description: |
          0 - Indicates IR mode
          1 - Indicates Torch (white LED) mode
        minimum: 0
        maximum: 1

      flash-max-microamp:
        minimum: 11
        maximum: 1500000

      flash-max-timeout-us:
        minimum: 40
        maximum: 1600000

      led-max-microamp:
        minimum: 24
        maximum: 376000

    required:
      - reg
      - flash-max-microamp
      - flash-max-timeout-us
      - led-max-microamp

    unevaluatedProperties: true

required:
  - compatible
  - reg
  - '#address-cells'
  - '#size-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@64 {
            compatible = "ti,lm36010";
            #address-cells = <1>;
            #size-cells = <0>;
            reg = <0x64>;

            led@1 {
                reg = <1>;
                function = LED_FUNCTION_TORCH;
                color = <LED_COLOR_ID_WHITE>;
                led-max-microamp = <376000>;
                flash-max-microamp = <1500000>;
                flash-max-timeout-us = <1600000>;
            };
        };
    };
...

