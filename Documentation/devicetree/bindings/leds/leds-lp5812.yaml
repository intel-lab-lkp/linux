%YAML 1.2

title: LED driver for LP5812 LED from Texas Instruments.

maintainers:

description: |
  The LP5812 is an I2C LED Driver that can support LED matrix 4x3.

properties:
  compatible:
    const: ti,lp5812

  reg:
    description: I2C slave address
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c1 {
      lp5812@1b {
        compatible = "ti,lp5812";
        reg = <0x1b>;
      };
    };

...
