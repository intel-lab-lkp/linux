%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/mps,mp3326.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MPS MP3326 RGB/White LED Driver

maintainers:
  - Yuxi Wang <Yuxi.Wang@monolithicpower.com>

description: |
  The MP3326 is a RGB/White LED driver with I2C interface.

  For more product information please see the link below:
  https://www.monolithicpower.com/en/products/mp3326.html

properties:
  compatible:
    const: mps,mp3326

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  reg:
    maxItems: 1

  multi-led:
    type: object
    unevaluatedProperties: false

    properties:
      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

      color:
        description: RGB module

    patternProperties:
      "^led@[0-3]$":
        type: object
        $ref: common.yaml#
        unevaluatedProperties: false

        properties:
          reg:
            description: Index of the LED.
            minimum: 1
            maximum: 16

        required:
          - reg
          - color

    required:
      - "#address-cells"
      - "#size-cells"
      - color

patternProperties:
  "^led@[0-9]$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        description: Index of the LED.
        minimum: 1
        maximum: 16

    required:
      - reg

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@30 {
            #address-cells = <1>;
            #size-cells = <0>;
            compatible = "mps,mp3326";
            reg = <0x30>;
            multi-led {
              #address-cells = <1>;
              #size-cells = <0>;
              color = <LED_COLOR_ID_RGB>;

              led@0 {
                  reg  = <1>;
                  color = <LED_COLOR_ID_RED>;
              };

              led@1 {
                  reg = <2>;
                  color = <LED_COLOR_ID_GREEN>;
              };

              led@2 {
                  reg = <3>;
                  color = <LED_COLOR_ID_BLUE>;
              };
            };
        };
    };

  - |
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        led-controller@30 {
            compatible = "mps,mp3326";
            reg = <0x30>;
            #address-cells = <1>;
            #size-cells = <0>;

            led@0 {
                reg= <5>;
                color = <LED_COLOR_ID_WHITE>;
            };
        };
    };
...
