%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/cix/cix,sky1-system-control.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cix Sky1 SoC system control register region

maintainers:
  - Gary Yang <gary.yang@cixtech.com>

description:
  An wide assortment of registers of the system controller on Sky1 SoC,
  including resets, usb, wakeup sources and so on.

properties:
  compatible:
    items:
      - enum:
          - cix,sky1-system-control
          - cix,sky1-s5-system-control
          - cix,sky1-audss-system-control
      - const: syscon

  reg:
    maxItems: 1

  '#reset-cells':
    const: 1

  power-domains:
    maxItems: 1

  resets:
    maxItems: 1

  clock-controller:
    type: object
    properties:
      compatible:
        const: cix,sky1-audss-clock
    required:
      - compatible
    additionalProperties: true

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: cix,sky1-audss-system-control
    then:
      required:
        - clock-controller
        - power-domains
        - resets
    else:
      properties:
        clock-controller: false
        power-domains: false
        resets: false

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@4160000 {
      compatible = "cix,sky1-system-control", "syscon";
      reg = <0x4160000 0x100>;
      #reset-cells = <1>;
    };
  - |
    audss_syscon: system-controller@7110000 {
        compatible = "cix,sky1-audss-system-control", "syscon";
        reg = <0x7110000 0x10000>;
        power-domains = <&smc_devpd 0>;
        resets = <&s5_syscon 31>;
        #reset-cells = <1>;

        clock-controller {
            compatible = "cix,sky1-audss-clock";
            #clock-cells = <1>;
            clocks = <&scmi_clk 0>, <&scmi_clk 2>, <&scmi_clk 4>, <&scmi_clk 5>;
            clock-names = "x8k", "x11k", "sys", "48m";
        };
    };
