%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/imx/fsl,imx93-media-blk-ctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP i.MX93 Media blk-ctrl

maintainers:
  - Peng Fan <peng.fan@nxp.com>

description:
  The i.MX93 MEDIAMIX domain contains control and status registers known
  as MEDIAMIX Block Control (MEDIAMIX BLK_CTRL). These registers include
  clocking, reset, and miscellaneous top-level controls for peripherals
  within the MEDIAMIX domain

properties:
  compatible:
    items:
      - const: fsl,imx93-media-blk-ctrl
      - const: syscon

  reg:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

  '#power-domain-cells':
    const: 1

  power-domains:
    maxItems: 1

  clocks:
    maxItems: 10

  clock-names:
    items:
      - const: apb
      - const: axi
      - const: nic
      - const: disp
      - const: cam
      - const: pxp
      - const: lcdif
      - const: isi
      - const: csi
      - const: dsi

  bridge@60:
    type: object
    additionalProperties: false

    properties:
      compatible:
        const: nxp,imx93-pdfc

      reg:
        maxItems: 1

      ports:
        $ref: /schemas/graph.yaml#/properties/ports

        properties:
          port@0:
            $ref: /schemas/graph.yaml#/properties/port
            description: Input port node to receive pixel data.

          port@1:
            $ref: /schemas/graph.yaml#/properties/port
            description: Output port node to downstream pixel data receivers.

        required:
          - port@0
          - port@1

    required:
      - compatible
      - reg
      - ports

required:
  - compatible
  - reg
  - '#address-cells'
  - '#size-cells'
  - power-domains
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx93-clock.h>
    #include <dt-bindings/power/fsl,imx93-power.h>

    system-controller@4ac10000 {
      compatible = "fsl,imx93-media-blk-ctrl", "syscon";
      reg = <0x4ac10000 0x10000>;
      power-domains = <&mediamix>;
      clocks = <&clk IMX93_CLK_MEDIA_APB>,
               <&clk IMX93_CLK_MEDIA_AXI>,
               <&clk IMX93_CLK_NIC_MEDIA_GATE>,
               <&clk IMX93_CLK_MEDIA_DISP_PIX>,
               <&clk IMX93_CLK_CAM_PIX>,
               <&clk IMX93_CLK_PXP_GATE>,
               <&clk IMX93_CLK_LCDIF_GATE>,
               <&clk IMX93_CLK_ISI_GATE>,
               <&clk IMX93_CLK_MIPI_CSI_GATE>,
               <&clk IMX93_CLK_MIPI_DSI_GATE>;
               clock-names = "apb", "axi", "nic", "disp", "cam",
                             "pxp", "lcdif", "isi", "csi", "dsi";
      #address-cells = <1>;
      #size-cells = <1>;
      #power-domain-cells = <1>;

      bridge@60 {
        compatible = "nxp,imx93-pdfc";
        reg = <0x60 0x4>;

        ports {
          #address-cells = <1>;
          #size-cells = <0>;

          port@0 {
            reg = <0>;

            pdfc_from_lcdif: endpoint {
              remote-endpoint = <&lcdif_to_pdfc>;
            };
          };

          port@1 {
            reg = <1>;

            pdfc_to_panel: endpoint {
              remote-endpoint = <&panel_from_pdfc>;
            };
          };
        };
      };
    };
