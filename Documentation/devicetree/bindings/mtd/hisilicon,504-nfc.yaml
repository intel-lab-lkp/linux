%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/hisilicon,504-nfc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hip04 NAND Flash Controller

maintainers:
  - Miquel Raynal <miquel.raynal@bootlin.com>
  - Richard Weinberger <richard@nod.at>

description:
  The HiSilicon 504 NFC is a NAND flash memory controller used in the
  Hip04 SoC. It supports hardware ECC for NAND devices and provides
  register and buffer regions for NAND operations.

allOf:
  - $ref: nand-controller.yaml#

properties:
  compatible:
    const: hisilicon,504-nfc

  reg:
    minItems: 2
    maxItems: 2

  interrupts:
    maxItems: 1

  nand-bus-width:
    enum: [8, 16]

  nand-ecc-mode:
    enum:
      - none
      - hw

  nand-ecc-strength:
    const: 16

  nand-ecc-step-size:
    const: 1024

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  partitions:
    $ref: /schemas/mtd/partitions/fixed-partitions.yaml#

required:
  - compatible
  - reg
  - interrupts
  - nand-bus-width
  - nand-ecc-mode
  - "#address-cells"
  - "#size-cells"

unevaluatedProperties: false

examples:
  - |
    nand-controller@4020000 {
        compatible = "hisilicon,504-nfc";
        reg = <0x04020000 0x10000>, <0x05000000 0x1000>;
        interrupts = <0 379 4>;
        nand-bus-width = <8>;
        nand-ecc-mode = "hw";
        nand-ecc-strength = <16>;
        nand-ecc-step-size = <1024>;
        #address-cells = <1>;
        #size-cells = <0>;

        partitions {
             compatible = "fixed-partitions";
             #address-cells = <1>;
             #size-cells = <1>;

             partition@0 {
                 label = "nand_text";
                 reg = <0x0 0x400000>;
            };
        };
    };
...
