%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/nvidia,tegra20-nand.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NVIDIA Tegra NAND Flash Controller

maintainers:
  - Jonathan Hunter <jonathanh@nvidia.com>

description:
  Device tree bindings for the NVIDIA Tegra NAND Flash Controller (NFC).
  The controller supports a single NAND chip with specific properties.

properties:
  compatible:
    const: nvidia,tegra20-nand

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: nand

  resets:
    maxItems: 1

  reset-names:
    items:
      - const: nand

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  power-domains:
    maxItems: 1

  operating-points-v2:
    maxItems: 1

patternProperties:
  "^nand@[0-5]$":
    type: object
    description: Individual NAND chip connected to the NAND controller
    properties:
      reg:
        maxItems: 1

      nand-ecc-mode:
        description:
          Operation mode of the NAND ECC, currently only hardware
          mode supported
        const: hw

      nand-ecc-algo:
        description: Algorithm for NAND ECC when using hw ECC mode
        enum:
          - rs
          - bch

      nand-bus-width:
        description: Width of the NAND flash bus in bits
        enum: [8, 16]
        default: 8

      nand-on-flash-bbt:
        description: Use an on-flash bad block table to track bad blocks
        type: boolean

      nand-ecc-maximize:
        description:
          Maximize ECC strength for the NAND chip, overriding
          default strength selection
        type: boolean

      nand-ecc-strength:
        description: Number of bits to correct per ECC step (512 bytes)
        enum: [4, 6, 8, 14, 16]

      nand-is-boot-medium:
        description: Ensures ECC strengths are compatible with the boot ROM
        type: boolean

      wp-gpios:
        description: GPIO specifier for the write protect pin
        maxItems: 1

      '#address-cells':
        const: 1

      '#size-cells':
        const: 1

    patternProperties:
      "^partition@[0-9a-f]+$":
        $ref: /schemas/mtd/mtd.yaml#
        description:
          Optional MTD partitions for the NAND chip, as defined in mtd.yaml

    required:
      - reg

    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - '#address-cells'
  - '#size-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/tegra20-car.h>
    #include <dt-bindings/gpio/tegra-gpio.h>

    nand-controller@70008000 {
        compatible = "nvidia,tegra20-nand";
        reg = <0x70008000 0x100>;
        interrupts = <GIC_SPI 24 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&tegra_car TEGRA20_CLK_NDFLASH>;
        clock-names = "nand";
        resets = <&tegra_car 13>;
        reset-names = "nand";
        #address-cells = <1>;
        #size-cells = <0>;

        nand@0 {
            reg = <0>;
            #address-cells = <1>;
            #size-cells = <1>;
            nand-bus-width = <8>;
            nand-on-flash-bbt;
            nand-ecc-algo = "bch";
            nand-ecc-strength = <8>;
            wp-gpios = <&gpio TEGRA_GPIO(S, 0) GPIO_ACTIVE_LOW>;
        };
    };
...
