%YAML 1.2
---
$id: http://devicetree.org/schemas/hwmon/aspeed,g5-pwm-tacho.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ASPEED AST2400/AST2500 PWM and Fan Tacho controller

maintainers:
  - Billy Tsai <billy_tsai@aspeedtech.com>

description: |
  The ASPEED PWM controller can support up to 8 PWM outputs. The ASPEED Fan
  Tacho controller can support up to 16 Fan tachometer inputs.

  There can be up to 8 fans supported. Each fan can have one PWM output and
  one/two Fan tach inputs.

properties:
  compatible:
    enum:
      - aspeed,ast2400-pwm-tacho
      - aspeed,ast2500-pwm-tacho

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

patternProperties:
  "^fan@[0-9]+$":
    $ref: fan-common.yaml#
    unevaluatedProperties: false
    properties:
      aspeed,fan-tach-ch:
        description:
          The tach channel used for the fan.
        $ref: /schemas/types.yaml#/definitions/uint8-array

    required:
      - reg
      - aspeed,fan-tach-ch

required:
  - compatible
  - "#address-cells"
  - "#size-cells"
  - reg
  - pinctrl-names
  - pinctrl-0
  - clocks
  - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/aspeed-clock.h>
    pwm_tacho: pwmtachocontroller@1e786000 {
        #address-cells = <1>;
        #size-cells = <0>;
        #cooling-cells = <2>;
        reg = <0x1E786000 0x1000>;
        compatible = "aspeed,ast2500-pwm-tacho";
        clocks = <&syscon ASPEED_CLK_APB>;
        resets = <&syscon ASPEED_RESET_PWM>;
        pinctrl-names = "default";
        pinctrl-0 = <&pinctrl_pwm0_default &pinctrl_pwm1_default>;

        fan@0 {
                reg = <0x00>;
                cooling-levels = /bits/ 8 <125 151 177 203 229 255>;
                aspeed,fan-tach-ch = /bits/ 8 <0x00>;
        };

        fan@1 {
                reg = <0x01>;
                aspeed,fan-tach-ch = /bits/ 8 <0x01 0x02>;
        };
    };
