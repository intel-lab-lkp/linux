%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/nvidia,tegra20-apbdma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NVIDIA Tegra APB DMA Controller

description: |
  The NVIDIA Tegra APB DMA controller is a hardware component that
  enables direct memory access (DMA) on Tegra systems. It facilitates
  data transfer between I/O devices and main memory without constant
  CPU intervention.

maintainers:
  - Jonathan Hunter <jonathanh@nvidia.com>

properties:
  compatible:
    oneOf:
      - const: nvidia,tegra20-apbdma
      - items:
          - const: nvidia,tegra30-apbdma
          - const: nvidia,tegra20-apbdma

  "#dma-cells":
    description:
      Must be <1>. This dictates the length of DMA specifiers
      in client node's dmas properties.
    const: 1

  clocks:
    maxItems: 1

  reg:
    maxItems: 1

  interrupts:
    description:
      Should contain all of the per-channel DMA interrupts in
      ascending order with respect to the DMA channel index.
    minItems: 1
    maxItems: 32

  resets:
    maxItems: 1

  reset-names:
    const: dma

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - reset-names
  - "#dma-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/reset/tegra186-reset.h>
    dma@6000a000 {
        compatible = "nvidia,tegra30-apbdma", "nvidia,tegra20-apbdma";
        reg = <0x6000a000 0x1200>;
        interrupts = <0 136 0x04>,
                     <0 137 0x04>,
                     <0 138 0x04>,
                     <0 139 0x04>,
                     <0 140 0x04>,
                     <0 141 0x04>,
                     <0 142 0x04>,
                     <0 143 0x04>,
                     <0 144 0x04>,
                     <0 145 0x04>,
                     <0 146 0x04>,
                     <0 147 0x04>,
                     <0 148 0x04>,
                     <0 149 0x04>,
                     <0 150 0x04>,
                     <0 151 0x04>;
        clocks = <&tegra_car 34>;
        resets = <&tegra_car 34>;
        reset-names = "dma";
        #dma-cells = <1>;
    };
...
