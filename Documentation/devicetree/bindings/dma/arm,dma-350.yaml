%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/arm,dma-350.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arm CoreLink DMA-350 Controller

maintainers:
  - Robin Murphy <robin.murphy@arm.com>

allOf:
  - $ref: dma-controller.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: cix,sky1-dma350
    then:
      required:
        - clocks

properties:
  compatible:
    oneOf:
      - const: arm,dma-350
      - items:
          - const: cix,sky1-dma350
          - const: arm,dma-350

  reg:
    items:
      - description: Base and size of the full register map

  interrupts:
    minItems: 1
    items:
      - description: Channel 0 interrupt
      - description: Channel 1 interrupt
      - description: Channel 2 interrupt
      - description: Channel 3 interrupt
      - description: Channel 4 interrupt
      - description: Channel 5 interrupt
      - description: Channel 6 interrupt
      - description: Channel 7 interrupt

  "#dma-cells":
    const: 1
    description: The cell is the trigger input number

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  memory-region:
    maxItems: 1
    description:
      Reserved memory region used for DMA allocations when the controller
      cannot reach all of system memory.

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false
