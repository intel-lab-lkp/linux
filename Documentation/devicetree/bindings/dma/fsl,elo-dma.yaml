%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/fsl,elo-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale Elo DMA Controller

maintainers:
  - J. Neuschäfer <j.ne@posteo.net>

description: |
  This is a little-endian 4-channel DMA controller, used in Freescale mpc83xx
  series chips such as mpc8315, mpc8349, mpc8379 etc.

  Note on DMA channel compatible properties: The compatible property must say
  "fsl,elo-dma-channel" or "fsl,eloplus-dma-channel" to be used by the Elo DMA
  driver (fsldma).  Any DMA channel used by fsldma cannot be used by another
  DMA driver, such as the SSI sound drivers for the MPC8610.  Therefore, any
  DMA channel that should be used for another driver should not use
  "fsl,elo-dma-channel" or "fsl,eloplus-dma-channel".  For the SSI drivers, for
  example, the compatible property should be "fsl,ssi-dma-channel".  See
  ssi.txt for more information.

properties:
  compatible:
    items:
      - enum:
          - fsl,mpc8313-dma
          - fsl,mpc8315-dma
          - fsl,mpc8323-dma
          - fsl,mpc8347-dma
          - fsl,mpc8349-dma
          - fsl,mpc8360-dma
          - fsl,mpc8377-dma
          - fsl,mpc8378-dma
          - fsl,mpc8379-dma
      - const: fsl,elo-dma

  reg:
    maxItems: 1
    description:
      DMA General Status Register, i.e. DGSR which contains status for
      all the 4 DMA channels.

  ranges: true

  cell-index:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Controller index. 0 for controller @ 0x8100.

  interrupts:
    maxItems: 1

patternProperties:
  "^dma-channel@.*$":
    type: object

    properties:
      compatible:
        items:
          - enum:
              - fsl,mpc8315-dma-channel
              - fsl,mpc8323-dma-channel
              - fsl,mpc8347-dma-channel
              - fsl,mpc8349-dma-channel
              - fsl,mpc8360-dma-channel
              - fsl,mpc8377-dma-channel
              - fsl,mpc8378-dma-channel
              - fsl,mpc8379-dma-channel
          - const: fsl,elo-dma-channel

      reg:
        maxItems: 1

      cell-index:
        description: DMA channel index starts at 0.

      interrupts: true

required:
  - compatible
  - reg
  - interrupts

additionalProperties: true

examples:
  - |
    dma@82a8 {
        #address-cells = <1>;
        #size-cells = <1>;
        compatible = "fsl,mpc8349-dma", "fsl,elo-dma";
        reg = <0x82a8 4>;
        ranges = <0 0x8100 0x1a4>;
        interrupt-parent = <&ipic>;
        interrupts = <71 8>;
        cell-index = <0>;
        dma-channel@0 {
            compatible = "fsl,mpc8349-dma-channel", "fsl,elo-dma-channel";
            cell-index = <0>;
            reg = <0 0x80>;
            interrupt-parent = <&ipic>;
            interrupts = <71 8>;
        };
        dma-channel@80 {
            compatible = "fsl,mpc8349-dma-channel", "fsl,elo-dma-channel";
            cell-index = <1>;
            reg = <0x80 0x80>;
            interrupt-parent = <&ipic>;
            interrupts = <71 8>;
        };
        dma-channel@100 {
            compatible = "fsl,mpc8349-dma-channel", "fsl,elo-dma-channel";
            cell-index = <2>;
            reg = <0x100 0x80>;
            interrupt-parent = <&ipic>;
            interrupts = <71 8>;
        };
        dma-channel@180 {
            compatible = "fsl,mpc8349-dma-channel", "fsl,elo-dma-channel";
            cell-index = <3>;
            reg = <0x180 0x80>;
            interrupt-parent = <&ipic>;
            interrupts = <71 8>;
        };
    };

...
