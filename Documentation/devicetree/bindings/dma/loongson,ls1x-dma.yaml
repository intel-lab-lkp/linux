%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/loongson,ls1x-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Loongson-1 DMA Controller

maintainers:
  - Keguang Zhang <keguang.zhang@gmail.com>

description: |
  Loongson-1 DMA controller provides 3 independent channels for
  peripherals such as NAND and AC97.

properties:
  compatible:
    enum:
      - loongson,ls1b-dma
      - loongson,ls1c-dma

  reg:
    maxItems: 1

  interrupts:
    description: Each channel has a dedicated interrupt line.
    minItems: 1
    maxItems: 3

  interrupt-names:
    minItems: 1
    items:
      - pattern: ch0
      - pattern: ch1
      - pattern: ch2

  '#dma-cells':
    description: The single cell represents the channel index.
    const: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - '#dma-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    dma: dma-controller@1fd01160 {
        compatible = "loongson,ls1b-dma";
        reg = <0x1fd01160 0x18>;

        interrupt-parent = <&intc0>;
        interrupts = <13 IRQ_TYPE_EDGE_RISING>,
        	     <14 IRQ_TYPE_EDGE_RISING>,
        	     <15 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "ch0", "ch1", "ch2";

        #dma-cells = <1>;
    };
