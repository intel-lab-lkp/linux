%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/intel,ldma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Lightning Mountain centralized DMA controllers.

maintainers:
  - yzhu@maxlinear.com

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    enum:
      - intel,lgm-ldma

  reg:
    maxItems: 1

  "#dma-cells":
    const: 3
    description:
      The first cell is the peripheral's DMA request line.
      The second cell is the peripheral's (port) number corresponding to the channel.
      The third cell is the burst length of the channel.

  dma-channels:
    minimum: 1
    maximum: 16

  dma-channel-mask:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  reset-names:
    items:
      - const: ctrl

  interrupts:
    maxItems: 1

  intel,dma-poll-cnt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      DMA descriptor polling counter is used to control the poling mechanism
      for the descriptor fetching for all channels.

  intel,dma-byte-en:
    type: boolean
    description:
      DMA byte enable is only valid for DMA write(RX).
      Byte enable(1) means DMA write will be based on the number of dwords
      instead of the whole burst.

  intel,dma-drb:
    type: boolean
    description:
      DMA descriptor read back to make sure data and desc synchronization.

  intel,dma-dburst-wr:
    type: boolean
    description:
      Enable RX dynamic burst write. When it is enabled, the DMA does RX dynamic burst;
      if it is disabled, the DMA RX will still support programmable fixed burst size of 2,4,8,16.
      It only applies to RX DMA and memcopy DMA.

  intel,dma-flowctrl:
    type: boolean
    description:
      DMA per-channel flow control.

  intel,dma-fod:
    type: boolean
    description:
      DMA fetch-on-demand.
      It should only be enabled when DMA connected to a component that can
      provide fetch-on-demand signal to DMA.

  intel,dma-desc-in-sram:
    type: boolean
    description:
      DMA descriptor in sram.
      It only affects legacy DMA(V22)
      DMA version V31 onwards, it is always enabled and setting ignored by
      DMA HW.

  intel,dma-desc-fack:
    type: boolean
    description:
      DMA descriptor fetch acknowledgement.
      This feature only takes effects if DMA fetch-on-demand is enabled.

  intel,dma-orrc:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      DMA outstanding descriptor read.
      The maximum orrc count is 16.

  intel,dma-type:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      DMA type. Only valid for DMAV31 onwards.
      DMA type TX is 0.
      DMA type RX is 1.
      DMA type MCPY is 2.

  intel,dma-name:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Name of the DMA.

required:
  - compatible
  - reg
  - intel,dma-name

additionalProperties: false

examples:
  - |
    dma0: dma-controller@e0e00000 {
      compatible = "intel,lgm-ldma";
      reg = <0xe0e00000 0x1000>;
      #dma-cells = <3>;
      dma-channels = <16>;
      dma-channel-mask = <0xFFFF>;
      interrupt-parent = <&ioapic1>;
      interrupts = <82 1>;
      resets = <&rcu0 0x30 0>;
      reset-names = "ctrl";
      clocks = <&cgu0 80>;
      intel,dma-poll-cnt = <4>;
      intel,dma-byte-en;
      intel,dma-drb;
      intel,dma-name = "dma0";
    };
  - |
    dma3: dma-controller@ec800000 {
      compatible = "intel,lgm-ldma";
      reg = <0xec800000 0x1000>;
      clocks = <&cgu0 71>;
      resets = <&rcu0 0x10 9>;
      #dma-cells = <3>;
      intel,dma-poll-cnt = <16>;
      intel,dma-byte-en;
      intel,dma-dburst-wr;
      intel,dma-type = <2>;
      intel,dma-desc-in-sram;
      intel,dma-name = "dma3";
      intel,dma-orrc = <16>;
    };
