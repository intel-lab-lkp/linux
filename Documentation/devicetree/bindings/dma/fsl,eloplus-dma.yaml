%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/fsl,eloplus-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale EloPlus DMA Controller

maintainers:
  - J. Neuschäfer <j.ne@posteo.net>

description: |
  This is a 4-channel DMA controller with extended addresses and chaining,
  mainly used in Freescale mpc85xx/86xx, Pxxx and BSC series chips, such as
  mpc8540, mpc8641 p4080, bsc9131 etc.

  Note on DMA channel compatible properties: The compatible property must say
  "fsl,elo-dma-channel" or "fsl,eloplus-dma-channel" to be used by the Elo DMA
  driver (fsldma).  Any DMA channel used by fsldma cannot be used by another
  DMA driver, such as the SSI sound drivers for the MPC8610.  Therefore, any DMA
  channel that should be used for another driver should not use
  "fsl,elo-dma-channel" or "fsl,eloplus-dma-channel".  For the SSI drivers, for
  example, the compatible property should be "fsl,ssi-dma-channel".  See ssi.txt
  for more information.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - fsl,mpc8540-dma
              - fsl,mpc8541-dma
              - fsl,mpc8548-dma
              - fsl,mpc8555-dma
              - fsl,mpc8560-dma
              - fsl,mpc8572-dma
              - fsl,mpc8641-dma
          - const: fsl,eloplus-dma
      - const: fsl,eloplus-dma

  reg:
    maxItems: 1
    description:
      DMA General Status Register, i.e. DGSR which contains
      status for all the 4 DMA channels

  cell-index:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      controller index.  0 for controller @ 0x21000, 1 for controller @ 0xc000

  interrupts:
    maxItems: 1

patternProperties:
  "^dma-channel@.*$":
    type: object

    properties:
      compatible:
        items:
          - enum:
              - fsl,mpc8540-dma-channel
              - fsl,mpc8541-dma-channel
              - fsl,mpc8548-dma-channel
              - fsl,mpc8555-dma-channel
              - fsl,mpc8560-dma-channel
              - fsl,mpc8572-dma-channel
          - const: fsl,eloplus-dma-channel

      reg:
        maxItems: 1

      cell-index:
        description: DMA channel index starts at 0.

      interrupts: true

examples:
  - |
    dma@21300 {
        #address-cells = <1>;
        #size-cells = <1>;
        compatible = "fsl,mpc8540-dma", "fsl,eloplus-dma";
        reg = <0x21300 4>;
        ranges = <0 0x21100 0x200>;
        cell-index = <0>;
        dma-channel@0 {
            compatible = "fsl,mpc8540-dma-channel", "fsl,eloplus-dma-channel";
            reg = <0 0x80>;
            cell-index = <0>;
            interrupt-parent = <&mpic>;
            interrupts = <20 2>;
        };
        dma-channel@80 {
            compatible = "fsl,mpc8540-dma-channel", "fsl,eloplus-dma-channel";
            reg = <0x80 0x80>;
            cell-index = <1>;
            interrupt-parent = <&mpic>;
            interrupts = <21 2>;
        };
        dma-channel@100 {
            compatible = "fsl,mpc8540-dma-channel", "fsl,eloplus-dma-channel";
            reg = <0x100 0x80>;
            cell-index = <2>;
            interrupt-parent = <&mpic>;
            interrupts = <22 2>;
        };
        dma-channel@180 {
            compatible = "fsl,mpc8540-dma-channel", "fsl,eloplus-dma-channel";
            reg = <0x180 0x80>;
            cell-index = <3>;
            interrupt-parent = <&mpic>;
            interrupts = <23 2>;
        };
    };

additionalProperties: true

...
