%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/brcm,bcm2835-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: BCM2835 DMA controller

maintainers:
  - Nicolas Saenz Julienne <nsaenz@kernel.org>

description: |
  The BCM2835 DMA controller has 16 channels in total. Only the lower
  13 channels have an associated IRQ. Some arbitrary channels are used by the
  VideoCore firmware (1,3,6,7 in the current firmware version). The channels
  0, 2 and 3 have special functionality and should not be used by the driver.

  On BCM2711 the channels 11 to 14 of the same DMA block have a different
  programming model, which allows them to address 40 bits, and are described
  by a separate node.

  The channel numbers used in the channel mask and in the interrupt names
  always refer to the whole DMA block, also when a node only describes some
  of its channels.

allOf:
  - $ref: dma-controller.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: brcm,bcm2711-dma
    then:
      properties:
        interrupts:
          maxItems: 4
        interrupt-names:
          maxItems: 4
      required:
        - interrupt-names

properties:
  compatible:
    enum:
      - brcm,bcm2711-dma
      - brcm,bcm2835-dma

  reg:
    maxItems: 1

  interrupts:
    description:
      Should contain the DMA interrupts associated to the DMA channels in
      ascending order.
    minItems: 1
    maxItems: 16

  interrupt-names:
    minItems: 1
    maxItems: 16
    items:
      pattern: "^dma([0-9]|1[0-4]|-shared-all)$"

  '#dma-cells':
    description: |
      The single cell contains the DREQ number in bits 0-4, optionally
      combined with the following per-channel flags:
        bits 16-19: AXI priority
        bits 20-23: AXI panic priority
        bit 24: use wide (128-bit) source reads
        bit 25: use wide (128-bit) destination writes
        bit 27: do not wait for AXI write responses
        bit 28: wait for outstanding writes before signalling completion
        bit 29: do not pause the channel when the debug signal is asserted
        bit 30: use multi-beat bursts
    const: 1

  dma-channel-mask:
    maxItems: 1

  brcm,dma-channel-mask:
    $ref: /schemas/types.yaml#/definitions/uint32
    deprecated: true
    description:
      Bitmask of available DMA channels in ascending order that are
      not reserved by firmware and are available to the
      kernel. i.e. first channel corresponds to LSB.
      Use the generic dma-channel-mask property instead.

unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - "#dma-cells"

anyOf:
  - required:
      - dma-channel-mask
  - required:
      - brcm,dma-channel-mask

examples:
  - |
    dma-controller@7e007000 {
      compatible = "brcm,bcm2835-dma";
      reg = <0x7e007000 0xf00>;
      interrupts = <1 16>,
                   <1 17>,
                   <1 18>,
                   <1 19>,
                   <1 20>,
                   <1 21>,
                   <1 22>,
                   <1 23>,
                   <1 24>,
                   <1 25>,
                   <1 26>,
                   /* dma channel 11-14 share one irq */
                   <1 27>,
                   <1 27>,
                   <1 27>,
                   <1 27>,
                   /* unused shared irq for all channels */
                   <1 28>;
      interrupt-names = "dma0",
                        "dma1",
                        "dma2",
                        "dma3",
                        "dma4",
                        "dma5",
                        "dma6",
                        "dma7",
                        "dma8",
                        "dma9",
                        "dma10",
                        "dma11",
                        "dma12",
                        "dma13",
                        "dma14",
                        "dma-shared-all";
        #dma-cells = <1>;
        dma-channel-mask = <0x7f35>;
    };

  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    dma-controller@7e007b00 {
      compatible = "brcm,bcm2711-dma";
      reg = <0x7e007b00 0x400>;
      interrupts = <GIC_SPI 89 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 90 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 91 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 92 IRQ_TYPE_LEVEL_HIGH>;
      interrupt-names = "dma11",
                        "dma12",
                        "dma13",
                        "dma14";
      #dma-cells = <1>;
      dma-channel-mask = <0x7000>;
    };

...
