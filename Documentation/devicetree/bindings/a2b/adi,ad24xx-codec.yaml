%YAML 1.2
---
$id: http://devicetree.org/schemas/a2b/adi,ad24xx-codec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices Inc. AD24xx I2S/TDM functional block

maintainers:
  - Alvin Šipraga <alsi@bang-olufsen.dk>

allOf:
  - $ref: /schemas/sound/dai-common.yaml#

properties:
  compatible:
    enum:
      - adi,ad2403-codec
      - adi,ad2410-codec
      - adi,ad2425-codec
      - adi,ad2428-codec
      - adi,ad2429-codec

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - '#sound-dai-cells'

unevaluatedProperties: false

examples:
  - |
    a2b {
      #address-cells = <1>;
      #size-cells = <0>;

      node@2 {
        compatible = "adi,ad2428-node";
        reg = <2>;
        interrupts = <2>;
        adi,tdm-mode = <8>;
        adi,tdm-slot-size = <32>;

        codec {
          compatible = "adi,ad2428-codec";
          #sound-dai-cells = <0>;
          sound-name-prefix = "A2B Sub2";
        };
      };
    };
