%YAML 1.2
---
$id: http://devicetree.org/schemas/a2b/adi,ad24xx-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices Inc. AD24xx clock functional block

maintainers:
  - Alvin Šipraga <alsi@bang-olufsen.dk>

allOf:
  - $ref: /schemas/clock/clock.yaml

properties:
  compatible:
    enum:
      - adi,ad2420-clk
      - adi,ad2421-clk
      - adi,ad2422-clk
      - adi,ad2425-clk
      - adi,ad2426-clk
      - adi,ad2427-clk
      - adi,ad2428-clk
      - adi,ad2429-clk

required:
  - compatible
  - clock-output-names

unevaluatedProperties: false

examples:
  - |
    a2b {
      #address-cells = <1>;
      #size-cells = <0>;

      node@1 {
        compatible = "adi,ad2425-node";
        reg = <1>;
        interrupts = <1>;
        adi,tdm-mode = <16>;
        adi,tdm-slot-size = <32>;

        clock {
          compatible = "adi,ad2425-clk";
          #clock-cells = <1>;
          clock-indices = <1>;
          clock-output-names = "A2B1 CLKOUT2";
        };
      };
    };
