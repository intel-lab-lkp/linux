%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/onnn,ar0233.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ON Semiconductor AR0233 MIPI CSI-2 sensor

maintainers:
  - Alexander Shiyan <eagle.alexander923@gmail.com>

description:
  The AR0233 is a 1/2.5" CMOS digital image sensor with MIPI CSI-2 and
  I2C-compatible control interface.

properties:
  compatible:
    const: onnn,ar0233

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: extclk

  vaa-supply:
    description:
      Supply for the VAA analog voltage (2.8V).

  vaapix-supply:
    description:
      Supply for the VAA_PIX pixel voltage (2.8V).

  vddio-supply:
    description:
      Supply for the VDD_IO I/O digital voltage (1.8V/2.8V).

  vddphy-supply:
    description:
      Supply for the VDD_PHY digital voltage (1.2V).

  vdd-supply:
    description:
      Supply for the VDD core digital voltage (1.2V).

  reset-gpios:
    description: Reset GPIO, active low.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false
    description:
      Video output port.

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            const: 4

          data-lanes:
            anyOf:
              - items:
                  - const: 1
              - items:
                  - const: 1
                  - const: 2
              - items:
                  - const: 1
                  - const: 2
                  - const: 3
                  - const: 4

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/media/video-interfaces.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "onnn,ar0233";
            reg = <0x10>;

            clocks = <&clk27m>;
            clock-names = "extclk";

            reset-gpios = <&ser0 0 GPIO_ACTIVE_LOW>;

            port {
                ar0233_out: endpoint {
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <375000000>;
                    remote-endpoint = <&ub953_csi_in>;
                };
            };
        };
    };
