%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov2735.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OV2735 Image Sensor

maintainers:
  - Himanshu Bhavani <himanshu.bhavani@siliconsignals.io>

description: |
  The OmniVision OV2735 is a 2MP (1920x1080) color CMOS image sensor controlled
  through an I2C-compatible SCCB bus. it outputs RAW10 format and uses a 1/2.7"
  optical format.

properties:
  compatible:
    const: ovti,ov2735

  reg:
    maxItems: 1

  clocks:
    items:
      - description: XVCLK clock

  clock-names:
    items:
      - const: xvclk

  AVDD-supply:
    description: Analog Domain Power Supply

  DOVDD-supply:
    description: I/O Domain Power Supply

  DVDD-supply:
    description: Digital Domain Power Supply

  reset-gpios:
    maxItems: 1
    description: Reset Pin GPIO Control (active low)

  pwdn-gpios:
    maxItems: 1
    description: Powerdown Pin GPIO Control (active low)

  port:
    description: MIPI CSI-2 transmitter port
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2

        required:
          - data-lanes

required:
  - compatible
  - reg
  - clocks
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/rk3399-cru.h>
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera-sensor@3c {
            compatible = "ovti,ov2735";
            reg = <0x3c>;
            clocks = <&ov2735_clk>;

            assigned-clocks = <&ov2735_clk>;
            assigned-clock-parents = <&ov2735_clk_parent>;
            assigned-clock-rates = <24000000>;

            reset-gpios = <&gpio1 6 GPIO_ACTIVE_LOW>;
            pwdn-gpios = <&gpio2 11 GPIO_ACTIVE_LOW>;

            port {
                cam_out: endpoint {
                    remote-endpoint = <&mipi_in_cam>;
                    data-lanes = <1 2>;
                };
            };
        };
    };
