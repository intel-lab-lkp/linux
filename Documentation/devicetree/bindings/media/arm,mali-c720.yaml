%YAML 1.2
---
$id: http://devicetree.org/schemas/media/arm,mali-c720.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ARM Mali-C720 Image Signal Processor

maintainers:
  - Anthony McGivern <anthony.mcgivern@arm.com>

properties:
  compatible:
    const: arm,mali-c720

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    items:
      - description: ISP main interrupt
      - description: ISP fault interrupt

  interrupt-names:
    minItems: 1
    items:
      - const: isp
      - const: fault

  iommus:
    minItems: 1
    maxItems: 3

  clocks:
    items:
      - description: ISP main processing clock

  clock-names:
    items:
      - const: vclk

  resets:
    items:
      - description: ISP main processing clock domain reset

  reset-names:
    items:
      - const: reset

  memory-region:
    maxItems: 1
    description: Reserved memory pool for ISP DMA allocations.

  power-domains:
    description: Power domain containing the ISP.
    maxItems: 1

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    description: Parallel video input ports.

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input port 0

        properties:
          reg:
            const: 0

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input port 1

        properties:
          reg:
            const: 1

      port@2:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input port 2

        properties:
          reg:
            const: 2

      port@3:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input port 3

        properties:
          reg:
            const: 3

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names

additionalProperties: false

examples:
  - |
    mali_c720: isp@400000 {
      compatible = "arm,mali-c720";
      reg = <0x400000 0x200000>;
      clocks = <&clk 0>;
      clock-names = "vclk";
      resets = <&resets 0>;
      reset-names = "reset";
      memory-region = <&isp_reserved>;
      interrupts = <0>;
      interrupt-names = "isp";
      power-domains = <&power 0>;

      ports {
        #address-cells = <1>;
        #size-cells = <0>;

        port@0 {
          reg = <0>;
          isp_in: endpoint {
            remote-endpoint = <&csi2_rx_out>;
          };
        };
      };
    };
...
