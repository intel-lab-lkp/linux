%YAML 1.2
---
$id: http://devicetree.org/schemas/media/nxp,wave633c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Chips&Media Wave6 Series multi-standard codec IP on NXP i.MX SoCs.

maintainers:
  - Nas Chung <nas.chung@chipsnmedia.com>
  - Jackson Lee <jackson.lee@chipsnmedia.com>

description:
  The Chips&Media Wave6 codec IP is a multi-standard video encoder/decoder.
  On NXP i.MX SoCs, Wave6 codec IP functionality is split between the VPU control device
  (vpu-ctrl) and the VPU device (vpu). The VPU control device manages shared resources
  such as firmware access and power domains, while the VPU device provides encoding
  and decoding capabilities. The VPU devie cannot operate independently
  without the VPU control device.

properties:
  compatible:
    items:
      - enum:
          - nxp,imx95-wave633c-ctrl
          - nxp,imx95-wave633c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: VPU clock
      - description: VPU associated block clock

  clock-names:
    items:
      - const: vpu
      - const: vpublk_wave

  power-domains:
    minItems: 1
    items:
      - description: Main VPU power domain
      - description: Performance power domain

  power-domain-names:
    items:
      - const: vpumix
      - const: vpuperf

  cnm,ctrl:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle of the VPU control device node. Required for VPU operation.

  boot:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle of the boot memory region node for the VPU control device.

  sram:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle of the SRAM memory region node for the VPU control device.

  '#cooling-cells':
    const: 2

  support-follower:
    type: boolean
    description: Indicates whether the VPU domain power always on.

patternProperties:
  "^vpu-ctrl@[0-9a-f]+$":
    type: object
    properties:
      compatible:
        items:
          - enum:
              - nxp,imx95-wave633c-ctrl
      reg: true
      clocks: true
      clock-names: true
      power-domains:
        items:
          - description: Main VPU power domain
          - description: Performance power domain
      power-domain-names:
        items:
          - const: vpumix
          - const: vpuperf
      sram: true
      boot: true
      '#cooling-cells': true
      support-follower: true
    required:
      - compatible
      - reg
      - clocks
      - clock-names
      - power-domains
      - power-domain-names
      - sram
      - boot

    additionalProperties: false

  "^vpu@[0-9a-f]+$":
    type: object
    properties:
      compatible:
        items:
          - enum:
              - nxp,imx95-wave633c
      reg: true
      interrupts: true
      clocks: true
      clock-names: true
      power-domains:
        maxItems: 1
        description: Main VPU power domain
      cnm,ctrl: true
    required:
      - compatible
      - reg
      - interrupts
      - clocks
      - clock-names
      - power-domains
      - cnm,ctrl

    additionalProperties: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/nxp,imx95-clock.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      vpuctrl: vpu-ctrl@4c4c0000 {
        compatible = "nxp,imx95-wave633c-ctrl";
        reg = <0x0 0x4c4c0000 0x0 0x10000>;
        clocks = <&scmi_clk 115>,
            <&vpu_blk_ctrl IMX95_CLK_VPUBLK_WAVE>;
        clock-names = "vpu", "vpublk_wave";
        power-domains = <&scmi_devpd 21>, <&scmi_perf 10>;
        power-domain-names = "vpumix", "vpuperf";
        #cooling-cells = <2>;
        boot = <&vpu_boot>;
        sram = <&sram1>;
      };

      vpu0: vpu@4c480000 {
        compatible = "nxp,imx95-wave633c";
        reg = <0x0 0x4c480000 0x0 0x10000>;
        interrupts = <GIC_SPI 299 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&scmi_clk 115>,
                <&vpu_blk_ctrl IMX95_CLK_VPUBLK_WAVE>;
        clock-names = "vpu", "vpublk_wave";
        power-domains = <&scmi_devpd 21>;
        cnm,ctrl = <&vpuctrl>;
      };

      vpu1: vpu@4c490000 {
        compatible = "nxp,imx95-wave633c";
        reg = <0x0 0x4c490000 0x0 0x10000>;
        interrupts = <GIC_SPI 300 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&scmi_clk 115>,
                <&vpu_blk_ctrl IMX95_CLK_VPUBLK_WAVE>;
        clock-names = "vpu", "vpublk_wave";
        power-domains = <&scmi_devpd 21>;
        cnm,ctrl = <&vpuctrl>;
      };

      vpu2: vpu@4c4a0000 {
        compatible = "nxp,imx95-wave633c";
        reg = <0x0 0x4c4a0000 0x0 0x10000>;
        interrupts = <GIC_SPI 301 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&scmi_clk 115>,
                <&vpu_blk_ctrl IMX95_CLK_VPUBLK_WAVE>;
        clock-names = "vpu", "vpublk_wave";
        power-domains = <&scmi_devpd 21>;
        cnm,ctrl = <&vpuctrl>;
      };

      vpu3: vpu@4c4b0000 {
        compatible = "nxp,imx95-wave633c";
        reg = <0x0 0x4c4b0000 0x0 0x10000>;
        interrupts = <GIC_SPI 302 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&scmi_clk 115>,
                <&vpu_blk_ctrl IMX95_CLK_VPUBLK_WAVE>;
        clock-names = "vpu", "vpublk_wave";
        power-domains = <&scmi_devpd 21>;
        cnm,ctrl = <&vpuctrl>;
      };
    };
