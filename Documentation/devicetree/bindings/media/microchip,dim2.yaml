%YAML 1.2
---
$id: http://devicetree.org/schemas/media/microchip,dim2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip MediaLB DIM2 Controller

maintainers:
  - Andrey Shvetsov <andrey.shvetsov@k2l.de>

description:
  MediaLB DIM2 module found in Freescale i.MX6Q, Renesas R-Car Gen2 and
  Gen3 SoCs, and Xilinx FPGAs.

properties:
  compatible:
    enum:
      - fsl,imx6q-mlb150
      - renesas,rcar-gen3-mlp
      - xlnx,axi4-os62420_3pin-1.00.a
      - xlnx,axi4-os62420_6pin-1.00.a

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: MediaLB Interrupt
      - description: AHB0 Interrupt

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    minItems: 1
    items:
      - const: core
      - const: pll8_mlb

  microchip,clock-frequency:
    $ref: /schemas/types.yaml#/definitions/string
    enum:
      - 256fs
      - 512fs
      - 1024fs
      - 2048fs
      - 3072fs
      - 4096fs
      - 6144fs
      - 8192fs
    description:
      DIM2 clock speed as a multiple of the frame sync frequency.

required:
  - compatible
  - reg
  - interrupts
  - microchip,clock-frequency

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: fsl,imx6q-mlb150
    then:
      required:
        - clocks
        - clock-names
      properties:
        clocks:
          minItems: 2
        clock-names:
          minItems: 2

  - if:
      properties:
        compatible:
          contains:
            const: renesas,rcar-gen3-mlp
    then:
      required:
        - clocks
      properties:
        clocks:
          maxItems: 1
        clock-names: false

  - if:
      properties:
        compatible:
          contains:
            enum:
              - xlnx,axi4-os62420_3pin-1.00.a
              - xlnx,axi4-os62420_6pin-1.00.a
    then:
      properties:
        clocks: false
        clock-names: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    mlb@218e000 {
        compatible = "fsl,imx6q-mlb150";
        reg = <0x0218e000 0x4000>;
        interrupts = <0 150 IRQ_TYPE_LEVEL_HIGH>,
                     <0 151 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clks 1>, <&clks 2>;
        clock-names = "core", "pll8_mlb";
        microchip,clock-frequency = "2048fs";
    };
  - |
    /* Renesas example */
    mlp@e6050000 {
        compatible = "renesas,rcar-gen3-mlp";
        reg = <0xe6050000 0x1000>;
        interrupts = <GIC_SPI 144 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 145 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&cpg 123>;
        microchip,clock-frequency = "2048fs";
    };
  - |
    /* Xilinx example */
    dim2@43c00000 {
        compatible = "xlnx,axi4-os62420_3pin-1.00.a";
        reg = <0x43c00000 0x10000>;
        interrupts = <0 144 IRQ_TYPE_LEVEL_HIGH>,
                     <0 145 IRQ_TYPE_LEVEL_HIGH>;
        microchip,clock-frequency = "2048fs";
    };
