%YAML 1.2
---
$id: http://devicetree.org/schemas/media/intel,dprx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Intel DisplayPort RX IP

maintainers:
  - Paweł Anikiel <panikiel@google.com>

properties:
  compatible:
    const: intel,dprx

  reg:
    items:
      - description: core registers
      - description: irq registers

  interrupts:
    maxItems: 1

  intel,has-mst:
    type: boolean
    description: The device supports Multi-Stream Transport

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: SST main link

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: MST virtual channel 0 or SST main link

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: MST virtual channel 1

      port@2:
        $ref: /schemas/graph.yaml#/properties/port
        description: MST virtual channel 2

      port@3:
        $ref: /schemas/graph.yaml#/properties/port
        description: MST virtual channel 3

required:
  - compatible
  - reg
  - interrupts

allOf:
  - if:
      required:
        - intel,has-mst
    then:
      required:
        - ports
    else:
      required:
        - port

additionalProperties: false

examples:
  - |
    dprx@c0062000 {
        compatible = "intel,dprx";
        reg = <0xc0062000 0x800>,
              <0xc0060f80 0x10>;
        interrupts = <GIC_SPI 27 IRQ_TYPE_LEVEL_HIGH>;
        intel,has-mst;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                dprx_mst_0: endpoint {
                    remote-endpoint = <&fb_mst0_0>;
                };
            };

            port@1 {
                reg = <1>;
                dprx_mst_1: endpoint {
                    remote-endpoint = <&fb_mst1_0>;
                };
            };

            port@2 {
                reg = <2>;
                dprx_mst_2: endpoint {
                    remote-endpoint = <&fb_mst2_0>;
                };
            };

            port@3 {
                reg = <3>;
                dprx_mst_3: endpoint {
                    remote-endpoint = <&fb_mst3_0>;
                };
            };
        };
    };

  - |
    dprx@c0064000 {
        compatible = "intel,dprx";
        reg = <0xc0064000 0x800>,
              <0xc0060fe0 0x10>;
        interrupts = <GIC_SPI 33 IRQ_TYPE_LEVEL_HIGH>;

        port {
            dprx_sst_0: endpoint {
                remote-endpoint = <&fb_sst_0>;
            };
        };
    };
