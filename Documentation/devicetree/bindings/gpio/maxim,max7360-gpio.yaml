%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/maxim,max7360-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX7360 GPIO controller

maintainers:
  - Kamel Bouhara <kamel.bouhara@bootlin.com>
  - Mathieu Dubois-Briand <mathieu.dubois-briand@bootlin.com>

description: |
  Maxim MAX7360 GPIO controller, in MAX7360 chipset
  https://www.analog.com/en/products/max7360.html

properties:
  compatible:
    enum:
      - maxim,max7360-gpio
      - maxim,max7360-gpo

  gpio-controller: true

  "#gpio-cells":
    const: 2

  ngpios:
    minimum: 0
    maximum: 8

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  maxim,constant-current-disable:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Bit field, each bit disables constant-current output of the associated
      GPIO, starting from the least significant bit for the first GPIO.


required:
  - compatible
  - gpio-controller
  - ngpios

if:
  properties:
    compatible:
      contains:
        enum:
          - maxim,max7360-gpio
then:
  required:
    - interrupt-controller
else:
  properties:
    interrupt-controller: false
    maxim,constant-current-disable: false

    ngpios:
      maximum: 6

additionalProperties: false

examples:
  - |
    gpio {
      compatible = "maxim,max7360-gpio";

      gpio-controller;
      #gpio-cells = <0x2>;
      ngpios = <8>;
      maxim,constant-current-disable = <0x06>;

      interrupt-controller;
      #interrupt-cells = <0x2>;
      };
