%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/pl061-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ARM PL061 GPIO controller

maintainers:
  - Linus Walleij <linusw@kernel.org>
  - Rob Herring <robh@kernel.org>

# We need a select here so we don't match all nodes with 'arm,primecell'
select:
  properties:
    compatible:
      contains:
        enum:
          - arm,pl061
          - ambarella,cv75-gpio
  required:
    - compatible

properties:
  $nodename:
    pattern: "^gpio@[0-9a-f]+$"

  compatible:
    oneOf:
      - items:
          - const: arm,pl061
          - const: arm,primecell
      - items:
          - const: ambarella,cv75-gpio
          - const: arm,primecell

  reg:
    maxItems: 1

  interrupts:
    oneOf:
      - maxItems: 1
      - maxItems: 8

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  clocks:
    maxItems: 1

  clock-names: true

  arm,primecell-periphid:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Override for the PrimeCell peripheral ID.

  "#gpio-cells":
    const: 2

  gpio-controller: true

  gpio-line-names: true

  gpio-ranges:
    minItems: 1
    maxItems: 8

required:
  - compatible
  - reg
  - clocks
  - "#gpio-cells"
  - gpio-controller

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: ambarella,cv75-gpio
    then:
      properties:
        arm,primecell-periphid:
          const: 0x000e8061
      required:
        - arm,primecell-periphid
        - gpio-ranges

additionalProperties: false

...
