%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/realtek,rtd-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek DHC GPIO controller

maintainers:
  - TY Chang <tychang@realtek.com>

properties:
  compatible:
    enum:
      - realtek,rtd-gpio
      - realtek,rtd1295-misc-gpio
      - realtek,rtd1295-iso-gpio
      - realtek,rtd1395-iso-gpio
      - realtek,rtd1619-iso-gpio

  reg:
    maxItems: 2

  interrupts:
    maxItems: 2

  gpio-ranges: true

  gpio-controller: true

  "#gpio-cells":
    const: 2

required:
  - compatible
  - reg
  - interrupts
  - gpio-ranges
  - gpio-controller
  - "#gpio-cells"

additionalProperties: false

examples:
  - |
    gpio@100 {
      compatible = "realtek,rtd-gpio";
      reg = <0x100 0x100>,
            <0x000 0x0b0>;
      interrupt-parent = <&iso_irq_mux>;
      interrupts = <19>, <20>;
      gpio-ranges = <&pinctrl 0 0 82>;
      gpio-controller;
      #gpio-cells = <2>;
    };
