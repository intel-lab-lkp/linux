%YAML 1.2
---
$id: http://devicetree.org/schemas/bus/ti,omap3-l3-smx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI OMAP3 L3 (SMX) Interconnect

maintainers:
  - Santosh Shilimkar <santosh.shilimkar@ti.com>
  - Sricharan R <r.sricharan@ti.com>

description:
  The L3 interconnect for OMAP3 is based on the SonicsMX (SMX) architecture.

properties:
  compatible:
    items:
      - const: ti,omap3-l3-smx
      - const: simple-bus

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: l3-dbg-irq
      - description: l3-app-irq

  ti,hwmods:
    description: hwmod names for each domain.
    $ref: /schemas/types.yaml#/definitions/string
    const: l3_main
    deprecated: true

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges: true

patternProperties:
  "^.*@[0-9a-f]+$":
    type: object

required:
  - compatible
  - reg
  - interrupts
  - "#address-cells"
  - "#size-cells"
  - ranges

additionalProperties: false

examples:
  - |
    l3-noc@68000000 {
        compatible = "ti,omap3-l3-smx", "simple-bus";
        reg = <0x68000000 0x10000>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;
        interrupts = <9>, <10>;
        ti,hwmods = "l3_main";
    };
