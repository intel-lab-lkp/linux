%YAML 1.2
---
$id: http://devicetree.org/schemas/bus/ti,omap-l3-noc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI OMAP L3 Network On Chip (NoC) Interconnect

maintainers:
  - Santosh Shilimkar <santosh.shilimkar@ti.com>
  - Sricharan R <r.sricharan@ti.com>

description:
  The L3 interconnect is an implementation of the generic NoC IP provided by
  Arteris.

properties:
  compatible:
    enum:
      - ti,omap4-l3-noc
      - ti,omap5-l3-noc
      - ti,dra7-l3-noc
      - ti,am4372-l3-noc

  reg:
    minItems: 2
    items:
      - description: L3_MAIN_1 / L3F
      - description: L3_MAIN_2 / L3S
      - description: L3_MAIN_3

  interrupts:
    items:
      - description: l3-dbg-irq
      - description: l3-app-irq

required:
  - compatible
  - reg
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - ti,omap4-l3-noc
              - ti,omap5-l3-noc
    then:
      properties:
        reg:
          minItems: 3
    else:
      properties:
        reg:
          maxItems: 2

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    l3-noc@44000000 {
        compatible = "ti,omap4-l3-noc";
        reg = <0x44000000 0x1000>,
              <0x44800000 0x2000>,
              <0x45000000 0x1000>;
        interrupts = <GIC_SPI 9 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 10 IRQ_TYPE_LEVEL_HIGH>;
    };
