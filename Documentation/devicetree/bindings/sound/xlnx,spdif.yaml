%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/xlnx,spdif.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xilinx SPDIF IP

description:
  The IP supports playback and capture of SPDIF audio.

maintainers:
  - Vincenzo Frascino <vincenzo.frascino@arm.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    enum:
      - xlnx,spdif-2.0

  reg:
    maxItems: 1

  interrupt-names:
    items:
      - const: spdif_interrupt

  interrupts:
    maxItems: 1
    description: |
      List of Interrupt numbers.

  clock-names:
    items:
      - const: aud_clk_i
      - const: s_axi_aclk
    description: |
      List of input clocks.

  clocks:
    maxItems: 2
    description: |
      Input clock specifier. Refer to common clock bindings.

  xlnx,spdif-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum:
      - 0
      - 1
    description: |
      0 - receiver
      1 - transmitter

  xlnx,aud_clk_i:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Input audio clock value.

required:
  - compatible
  - reg
  - interrupt-names
  - interrupts
  - clock-names
  - clocks

additionalProperties: false

examples:
  - |
    spdif_0: spdif@80010000 {
      clock-names = "aud_clk_i", "s_axi_aclk";
      clocks = <&misc_clk_0>, <&clk 71>;
      compatible = "xlnx,spdif-2.0";
      interrupt-names = "spdif_interrupt";
      interrupt-parent = <&gic>;
      interrupts = <0 91 4>;
      reg = <0x80010000 0x10000>;
      xlnx,spdif-mode = <1>;
      xlnx,aud_clk_i = <49152913>;
    };

...
