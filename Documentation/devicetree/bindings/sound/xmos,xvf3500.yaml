%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/xmos,xvf3500.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: XMOS XVF3500 VocalFusion Voice Processor

maintainers:
  - Javier Carrasco <javier.carrasco@wolfvision.net>

description:
  The XMOS XVF3500 VocalFusion Voice Processor is a low-latency, 32-bit
  multicore controller for voice processing.
  https://www.xmos.com/xvf3500/

properties:
  compatible:
    const: usb20b1,0013

  reset-gpios:
    maxItems: 1

  vdd-supply:
    description:
      Regulator for the 1V0 supply.

  vdd2-supply:
    description:
      Regulator for the 3V3 supply.

required:
  - compatible
  - reset-gpios
  - vdd-supply
  - vdd2-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    xvf3500 {
      compatible = "usb20b1,0013";
      reset-gpios = <&gpio 5 GPIO_ACTIVE_LOW>;
      vdd-supply = <&vcc1v0>;
      vdd2-supply = <&vcc3v3>;
    };

...
