%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/ti,omap2-mcbsp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments OMAP2+ McBSP

maintainers:
  - Eduard Bostina <egbostina@gmail.com>

properties:
  compatible:
    enum:
      - ti,omap2420-mcbsp
      - ti,omap2430-mcbsp
      - ti,omap3-mcbsp
      - ti,omap4-mcbsp

  reg:
    minItems: 1
    maxItems: 2
    description: |
      Register location and size. For OMAP4+ it may be an array containing:
      - MPU access base address
      - L3 interconnect address (or sidetone)

  reg-names:
    minItems: 1
    maxItems: 2
    items:
      enum: [mpu, sidetone, dma]

  interrupts:
    minItems: 1
    maxItems: 4

  interrupt-names:
    minItems: 1
    maxItems: 4
    items:
      enum: [common, tx, rx, sidetone]

  ti,buffer-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Size of the FIFO on the port (OMAP2430 and newer SoCs).

  ti,hwmods:
    $ref: /schemas/types.yaml#/definitions/string-array
    minItems: 1
    maxItems: 2
    description: Name of the hwmod(s) associated with the McBSP port.

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    minItems: 1
    maxItems: 2

  dmas:
    minItems: 1
    maxItems: 2

  dma-names:
    minItems: 1
    maxItems: 2

  "#sound-dai-cells":
    const: 0

  port:
    $ref: /schemas/sound/audio-graph-port.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    mcbsp@49022000 {
        compatible = "ti,omap3-mcbsp";
        reg = <0x49022000 0xff>,
              <0x49028000 0xff>;
        reg-names = "mpu", "sidetone";
        interrupts = <0 17 0x4>, /* OCP compliant */
                     <0 62 0x4>, /* TX */
                     <0 63 0x4>, /* RX */
                     <0 4 0x4>;  /* Sidetone */
        interrupt-names = "common", "tx", "rx", "sidetone";
        interrupt-parent = <&intc>;
        ti,buffer-size = <1280>;
        ti,hwmods = "mcbsp2";
    };
