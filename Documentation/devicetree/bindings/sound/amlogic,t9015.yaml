# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amlogic,t9015.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic T9015 Internal Audio DAC

maintainers:
  - Jerome Brunet <jbrunet@baylibre.com>

properties:
  $nodename:
    pattern: "^audio-controller@.*"

  "#sound-dai-cells":
    const: 0

  compatible:
    items:
      - enum:
          - amlogic,t9015
          - amlogic,t9015-a1

  clocks:
    items:
      - description: Peripheral clock

  clock-names:
    items:
      - const: pclk

  reg:
    maxItems: 1

  resets:
    maxItems: 1

  AVDD-supply:
    description:
      Analogue power supply.

  sound-name-prefix: true

  lineout-left:
    $ref: /schemas/types.yaml#/definitions/string
  lineout-right:
    $ref: /schemas/types.yaml#/definitions/string
  linein-left:
    $ref: /schemas/types.yaml#/definitions/string
  linein-right:
    $ref: /schemas/types.yaml#/definitions/string
  micbias:
    $ref: /schemas/types.yaml#/definitions/string

required:
  - "#sound-dai-cells"
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - AVDD-supply


allOf:
  - $ref: dai-common.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: amlogic,t9015-a1
    then:
      properties:
        lineout-left:
          items:
            - enum:
                - none
                - right
                - left-inverted
        lineout-right:
          items:
            - enum:
                - none
                - left
                - right-inverted
        linein-left:
          items:
            - enum:
                - none
                - differential
                - positive
                - negative
        linein-right:
          items:
            - enum:
                - none
                - differential
                - positive
                - negative
        micbias:
          items:
            - enum:
                - 2.0V
                - 2.1V
                - 2.3V
                - 2.5V
                - 2.8V
    else:
      lineout-left: false
      lineout-right: false
      linein-left: false
      linein-right: false
      micbias: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/g12a-clkc.h>
    #include <dt-bindings/reset/amlogic,meson-g12a-reset.h>

    acodec: audio-controller@32000 {
        compatible = "amlogic,t9015";
        reg = <0x32000 0x14>;
        #sound-dai-cells = <0>;
        clocks = <&clkc CLKID_AUDIO_CODEC>;
        clock-names = "pclk";
        resets = <&reset RESET_AUDIO_CODEC>;
        AVDD-supply = <&vddao_1v8>;
    };
