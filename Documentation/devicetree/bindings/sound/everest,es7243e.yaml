%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/everest,es7243e.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Everest ES7243E audio ADC

maintainers:
  - Igor Prusov <ivprusov@salutedevices.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: everest,es7243e

  reg:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: sclk
      - const: lrclk

required:
  - compatible
  - reg
  - "#sound-dai-cells"
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;
      es7243e: audio-codec@14 {
        compatible = "everest,es7243e";
        reg = <0x14>;
        #sound-dai-cells = <0>;
        clocks = <&clk_audio_sclk>,
                 <&clk_audio_lrclk>;
        clock-names = "sclk", "lrclk";
      };
    };
