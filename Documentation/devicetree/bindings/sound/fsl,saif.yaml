%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/fsl,saif.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale MXS Serial Audio Interface (SAIF)

maintainers:
  - Lukasz Majewski <lukma@denx.de>

description: |
  The SAIF is based on I2S module that is used to communicate with audio codecs,
  but only with half-duplex manner (i.e. it can either transmit or receive PCM
  audio).

properties:
  compatible:
    const: fsl,imx28-saif

  reg:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

  assigned-clock-parents: true
  assigned-clock-rates: true
  assigned-clocks: true

  interrupts:
    maxItems: 1

  dmas:
    maxItems: 1

  dma-names:
    const: rx-tx

  clocks:
    maxItems: 1

  fsl,saif-master:
    description: Indicate that saif is a slave and its phandle points to master
    $ref: /schemas/types.yaml#/definitions/phandle

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - dmas
  - dma-names
  - "#sound-dai-cells"

unevaluatedProperties: false

examples:
  - |
    saif0: saif@80042000 {
        #sound-dai-cells = <0>;
        compatible = "fsl,imx28-saif";
        reg = <0x80042000 2000>;
        interrupts = <59>;
        clocks = <&clks 53>;
        dmas = <&dma_apbx 4>;
        dma-names = "rx-tx";
    };
  - |
    saif1: saif@80046000 {
        #sound-dai-cells = <0>;
        compatible = "fsl,imx28-saif";
        reg = <0x80046000 2000>;
        interrupts = <58>;
        clocks = <&clks 53>;
        dmas = <&dma_apbx 5>;
        dma-names = "rx-tx";
        fsl,saif-master = <&saif0>;
    };
