%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nvidia,tegra30-ahub.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NVIDIA Tegra Audio Hub (AHUB)

maintainers:
  - Jonathan Hunter <jonathanh@nvidia.com>

description:
  The NVIDIA Tegra AHUB (Audio Hub) is an audio interconnect block used to
  route data between various audio clients such as I2S, DAM, SPDIF, and
  APBIF. It exposes multiple register regions and supports different
  configurations depending on the Tegra SoC generation. The AHUB also
  provides a configlink bus for child audio components, which use CIF
  (Client Interface) IDs to identify their data paths. The number of DMA
  channels, reset lines, and additional modules varies across Tegra30,
  Tegra114, and Tegra124 platforms.

properties:
  compatible:
    oneOf:
      - enum:
          - nvidia,tegra114-ahub
          - nvidia,tegra124-ahub
          - nvidia,tegra30-ahub
      - items:
          - const: nvidia,tegra132-ahub
          - const: nvidia,tegra124-ahub

  reg:
    minItems: 2
    maxItems: 3

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Clock for the D_AUDIO domain
      - description: Clock for the APBIF interface

  clock-names:
    items:
      - const: d_audio
      - const: apbif

  resets:
    minItems: 11
    maxItems: 21

  reset-names:
    minItems: 11
    maxItems: 21

  dmas:
    minItems: 8
    maxItems: 20

  dma-names:
    minItems: 8
    items:
      - const: rx0
      - const: tx0
      - const: rx1
      - const: tx1
      - const: rx2
      - const: tx2
      - const: rx3
      - const: tx3
      - const: rx4
      - const: tx4
      - const: rx5
      - const: tx5
      - const: rx6
      - const: tx6
      - const: rx7
      - const: tx7
      - const: rx8
      - const: tx8
      - const: rx9
      - const: tx9

  "#address-cells":
    enum: [1, 2]

  "#size-cells":
    enum: [1, 2]

  ranges: true

patternProperties:
  "^i2s@[0-9a-f]+$":
    $ref: /schemas/sound/nvidia,tegra30-i2s.yaml#
    unevaluatedProperties: false

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: nvidia,tegra30-ahub
    then:
      properties:
        reg:
          minItems: 2
          maxItems: 2

        resets:
          minItems: 11
          maxItems: 11

        reset-names:
          items:
            - const: d_audio
            - const: apbif
            - const: i2s0
            - const: i2s1
            - const: i2s2
            - const: i2s3
            - const: i2s4
            - const: dam0
            - const: dam1
            - const: dam2
            - const: spdif

        dmas:
          minItems: 8
          maxItems: 8

        dma-names:
          minItems: 8
          maxItems: 8

        "#address-cells":
          const: 1

        "#size-cells":
          const: 1

  - if:
      properties:
        compatible:
          contains:
            const: nvidia,tegra114-ahub
    then:
      properties:
        reg:
          minItems: 3
          maxItems: 3

        resets:
          minItems: 13
          maxItems: 13

        reset-names:
          items:
            - const: d_audio
            - const: apbif
            - const: i2s0
            - const: i2s1
            - const: i2s2
            - const: i2s3
            - const: i2s4
            - const: dam0
            - const: dam1
            - const: dam2
            - const: spdif
            - const: amx
            - const: adx

        dmas:
          minItems: 20
          maxItems: 20

        dma-names:
          minItems: 20
          maxItems: 20

        "#address-cells":
          const: 1

        "#size-cells":
          const: 1

  - if:
      properties:
        compatible:
          contains:
            const: nvidia,tegra124-ahub
    then:
      properties:
        reg:
          minItems: 3
          maxItems: 3

        resets:
          minItems: 21
          maxItems: 21

        reset-names:
          items:
            - const: d_audio
            - const: apbif
            - const: i2s0
            - const: i2s1
            - const: i2s2
            - const: i2s3
            - const: i2s4
            - const: dam0
            - const: dam1
            - const: dam2
            - const: spdif
            - const: amx
            - const: amx1
            - const: adx
            - const: adx1
            - const: afc0
            - const: afc1
            - const: afc2
            - const: afc3
            - const: afc4
            - const: afc5

        dmas:
          minItems: 20
          maxItems: 20

        dma-names:
          minItems: 20
          maxItems: 20

        "#address-cells":
          const: 2

        "#size-cells":
          const: 2

required:
  - reg
  - compatible
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - dmas
  - dma-names
  - "#address-cells"
  - "#size-cells"
  - ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/tegra30-car.h>
    ahub@70080000 {
        compatible = "nvidia,tegra30-ahub";
        reg = <0x70080000 0x200>, <0x70080200 0x100>;
        interrupts = <GIC_SPI 103 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&tegra_car TEGRA30_CLK_D_AUDIO>,
                 <&tegra_car TEGRA30_CLK_APBIF>;
        clock-names = "d_audio", "apbif";
        resets = <&tegra_car 106>, <&tegra_car 107>,
                 <&tegra_car 30>, <&tegra_car 11>,
                 <&tegra_car 18>, <&tegra_car 101>,
                 <&tegra_car 102>, <&tegra_car 108>,
                 <&tegra_car 109>, <&tegra_car 110>,
                 <&tegra_car 10>;
        reset-names = "d_audio", "apbif",
                      "i2s0", "i2s1", "i2s2", "i2s3", "i2s4",
                      "dam0", "dam1", "dam2",
                      "spdif";
        dmas = <&apbdma 1>, <&apbdma 1>,
               <&apbdma 2>, <&apbdma 2>,
               <&apbdma 3>, <&apbdma 3>,
               <&apbdma 4>, <&apbdma 4>;
        dma-names = "rx0", "tx0", "rx1", "tx1",
                    "rx2", "tx2", "rx3", "tx3";
        ranges;
        #address-cells = <1>;
        #size-cells = <1>;

        i2s@70080300 {
            compatible = "nvidia,tegra30-i2s";
            reg = <0x70080300 0x100>;
            nvidia,ahub-cif-ids = <4 4>;
            clocks = <&tegra_car TEGRA30_CLK_I2S0>;
            resets = <&tegra_car 30>;
            reset-names = "i2s";
        };
    };
...
