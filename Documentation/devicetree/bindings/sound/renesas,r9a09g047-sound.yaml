%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/renesas,r9a09g047-sound.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas RZ/G3E Sound Controller

maintainers:
  - Kuninori Morimoto <kuninori.morimoto.gx@renesas.com>
  - John Madieu <john.madieu.xa@bp.renesas.com>

description:
  The RZ/G3E (R9A09G047) integrates an R-Car compatible sound controller
  with extended DMA channel support (up to 5 DMACs per direction), additional
  clock domains, and additional reset lines compared to the R-Car Gen2/Gen3
  variants.

allOf:
  - $ref: renesas,rsnd-common.yaml#

properties:
  compatible:
    const: renesas,r9a09g047-sound

  reg:
    maxItems: 5

  reg-names:
    items:
      - const: scu
      - const: adg
      - const: ssiu
      - const: ssi
      - const: audmapp

  clocks:
    maxItems: 47

  clock-names:
    items:
      - const: ssi-all
      - const: ssi.9
      - const: ssi.8
      - const: ssi.7
      - const: ssi.6
      - const: ssi.5
      - const: ssi.4
      - const: ssi.3
      - const: ssi.2
      - const: ssi.1
      - const: ssi.0
      - const: src.9
      - const: src.8
      - const: src.7
      - const: src.6
      - const: src.5
      - const: src.4
      - const: src.3
      - const: src.2
      - const: src.1
      - const: src.0
      - const: mix.1
      - const: mix.0
      - const: ctu.1
      - const: ctu.0
      - const: dvc.0
      - const: dvc.1
      - const: clk_a
      - const: clk_b
      - const: clk_c
      - const: clk_i
      - const: ssif_supply
      - const: scu
      - const: scu_x2
      - const: scu_supply
      - const: adg.ssi.9
      - const: adg.ssi.8
      - const: adg.ssi.7
      - const: adg.ssi.6
      - const: adg.ssi.5
      - const: adg.ssi.4
      - const: adg.ssi.3
      - const: adg.ssi.2
      - const: adg.ssi.1
      - const: adg.ssi.0
      - const: audmapp
      - const: adg

  resets:
    maxItems: 14

  reset-names:
    items:
      - const: ssi-all
      - const: ssi.9
      - const: ssi.8
      - const: ssi.7
      - const: ssi.6
      - const: ssi.5
      - const: ssi.4
      - const: ssi.3
      - const: ssi.2
      - const: ssi.1
      - const: ssi.0
      - const: scu
      - const: adg
      - const: audmapp

  rcar_sound,dvc:
    description: DVC subnode.
    type: object
    patternProperties:
      "^dvc-[0-1]$":
        type: object
        additionalProperties: false
        properties:
          dmas:
            maxItems: 5
          dma-names:
            maxItems: 5
            allOf:
              - items:
                  enum:
                    - tx
        required:
          - dmas
          - dma-names
    additionalProperties: false

  rcar_sound,src:
    description: SRC subnode.
    type: object
    patternProperties:
      "^src-[0-9]$":
        type: object
        additionalProperties: false
        properties:
          interrupts:
            maxItems: 1
          dmas:
            maxItems: 10
          dma-names:
            maxItems: 10
            allOf:
              - items:
                  enum:
                    - tx
                    - rx
    additionalProperties: false

  rcar_sound,ssiu:
    description: SSIU subnode.
    type: object
    patternProperties:
      "^ssiu-[0-9]+$":
        type: object
        additionalProperties: false
        properties:
          dmas:
            maxItems: 10
          dma-names:
            maxItems: 10
            allOf:
              - items:
                  enum:
                    - tx
                    - rx
        required:
          - dmas
          - dma-names
    additionalProperties: false

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - reset-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    snd_rzg3e: sound@13c00000 {
        #sound-dai-cells = <1>;
        #clock-cells = <0>;
        compatible = "renesas,r9a09g047-sound";
        reg = <0x13c00000 0x10000>,
              <0x13c20000 0x10000>,
              <0x13c30000 0x1000>,
              <0x13c31000 0x1f000>,
              <0x13c50000 0x10000>;
        reg-names = "scu", "adg", "ssiu", "ssi", "audmapp";

        clocks = <&cpg 245>,
                 <&cpg 394>, <&cpg 393>,
                 <&cpg 392>, <&cpg 391>,
                 <&cpg 390>, <&cpg 389>,
                 <&cpg 388>, <&cpg 387>,
                 <&cpg 386>, <&cpg 385>,
                 <&cpg 381>, <&cpg 380>,
                 <&cpg 379>, <&cpg 378>,
                 <&cpg 377>, <&cpg 376>,
                 <&cpg 375>, <&cpg 374>,
                 <&cpg 373>, <&cpg 372>,
                 <&cpg 371>, <&cpg 370>,
                 <&cpg 371>, <&cpg 370>,
                 <&cpg 368>, <&cpg 369>,
                 <&audio_clk_a>, <&audio_clk_b>,
                 <&audio_clk_c>, <&audio_clk_i>,
                 <&cpg 384>,
                 <&cpg 246>, <&cpg 247>,
                 <&cpg 382>,
                 <&cpg 361>, <&cpg 360>,
                 <&cpg 359>, <&cpg 358>,
                 <&cpg 357>, <&cpg 356>,
                 <&cpg 355>, <&cpg 354>,
                 <&cpg 353>, <&cpg 352>,
                 <&cpg 248>, <&cpg 249>;

        clock-names = "ssi-all",
                      "ssi.9", "ssi.8",
                      "ssi.7", "ssi.6",
                      "ssi.5", "ssi.4",
                      "ssi.3", "ssi.2",
                      "ssi.1", "ssi.0",
                      "src.9", "src.8",
                      "src.7", "src.6",
                      "src.5", "src.4",
                      "src.3", "src.2",
                      "src.1", "src.0",
                      "mix.1", "mix.0",
                      "ctu.1", "ctu.0",
                      "dvc.0", "dvc.1",
                      "clk_a", "clk_b",
                      "clk_c", "clk_i",
                      "ssif_supply",
                      "scu", "scu_x2",
                      "scu_supply",
                      "adg.ssi.9", "adg.ssi.8",
                      "adg.ssi.7", "adg.ssi.6",
                      "adg.ssi.5", "adg.ssi.4",
                      "adg.ssi.3", "adg.ssi.2",
                      "adg.ssi.1", "adg.ssi.0",
                      "audmapp", "adg";

        power-domains = <&cpg>;

        resets = <&cpg 225>,
                 <&cpg 235>, <&cpg 234>, <&cpg 233>, <&cpg 232>,
                 <&cpg 231>, <&cpg 230>, <&cpg 229>, <&cpg 228>,
                 <&cpg 227>, <&cpg 226>,
                 <&cpg 236>, <&cpg 238>, <&cpg 237>;
        reset-names = "ssi-all",
                      "ssi.9", "ssi.8", "ssi.7", "ssi.6",
                      "ssi.5", "ssi.4", "ssi.3", "ssi.2",
                      "ssi.1", "ssi.0",
                      "scu", "adg", "audmapp";

        rcar_sound,ssi {
            ssi0: ssi-0 {
                interrupts = <GIC_SPI 889 IRQ_TYPE_LEVEL_HIGH>;
            };
            ssi3: ssi-3 {
                interrupts = <GIC_SPI 892 IRQ_TYPE_LEVEL_HIGH>;
            };
            ssi4: ssi-4 {
                interrupts = <GIC_SPI 893 IRQ_TYPE_LEVEL_HIGH>;
                shared-pin;
            };
        };

        rcar_sound,ssiu {
            ssiu30: ssiu-12 {
                dmas = <&dmac0 0x1d79>, <&dmac0 0x1d7a>,
                       <&dmac1 0x1d79>, <&dmac1 0x1d7a>,
                       <&dmac2 0x1d79>, <&dmac2 0x1d7a>,
                       <&dmac3 0x1d79>, <&dmac3 0x1d7a>,
                       <&dmac4 0x1d79>, <&dmac4 0x1d7a>;
                dma-names = "tx", "rx", "tx", "rx", "tx", "rx",
                            "tx", "rx", "tx", "rx";
            };
            ssiu40: ssiu-16 {
                dmas = <&dmac0 0x1d81>, <&dmac0 0x1d82>,
                       <&dmac1 0x1d81>, <&dmac1 0x1d82>,
                       <&dmac2 0x1d81>, <&dmac2 0x1d82>,
                       <&dmac3 0x1d81>, <&dmac3 0x1d82>,
                       <&dmac4 0x1d81>, <&dmac4 0x1d82>;
                dma-names = "tx", "rx", "tx", "rx", "tx", "rx",
                            "tx", "rx", "tx", "rx";
            };
        };

        rcar_sound,src {
            src0: src-0 {
                interrupts = <GIC_SPI 902 IRQ_TYPE_LEVEL_HIGH>;
                dmas = <&dmac0 0x1d9f>, <&dmac0 0x1da9>,
                       <&dmac1 0x1d9f>, <&dmac1 0x1da9>,
                       <&dmac2 0x1d9f>, <&dmac2 0x1da9>,
                       <&dmac3 0x1d9f>, <&dmac3 0x1da9>,
                       <&dmac4 0x1d9f>, <&dmac4 0x1da9>;
                dma-names = "rx", "tx", "rx", "tx", "rx", "tx",
                            "rx", "tx", "rx", "tx";
            };
            src1: src-1 {
                interrupts = <GIC_SPI 903 IRQ_TYPE_LEVEL_HIGH>;
                dmas = <&dmac0 0x1da0>, <&dmac0 0x1daa>,
                       <&dmac1 0x1da0>, <&dmac1 0x1daa>,
                       <&dmac2 0x1da0>, <&dmac2 0x1daa>,
                       <&dmac3 0x1da0>, <&dmac3 0x1daa>,
                       <&dmac4 0x1da0>, <&dmac4 0x1daa>;
                dma-names = "rx", "tx", "rx", "tx", "rx", "tx",
                            "rx", "tx", "rx", "tx";
            };
        };

        rcar_sound,dvc {
            dvc0: dvc-0 {
                dmas = <&dmac0 0x1db3>,
                       <&dmac1 0x1db3>,
                       <&dmac2 0x1db3>,
                       <&dmac3 0x1db3>,
                       <&dmac4 0x1db3>;
                dma-names = "tx", "tx", "tx", "tx", "tx";
            };
            dvc1: dvc-1 {
                dmas = <&dmac0 0x1db4>,
                       <&dmac1 0x1db4>,
                       <&dmac2 0x1db4>,
                       <&dmac3 0x1db4>,
                       <&dmac4 0x1db4>;
                dma-names = "tx", "tx", "tx", "tx", "tx";
            };
        };

        rcar_sound,dai {
            dai0 {
                playback = <&ssi3>, <&src1>, <&dvc1>;
                capture = <&ssi4>, <&src0>, <&dvc0>;
            };
        };

        ports {
            #address-cells = <1>;
            #size-cells = <0>;
            rsnd_port0: port@0 {
                reg = <0>;
                rsnd_endpoint0: endpoint {
                    remote-endpoint = <&codec_endpoint>;
                    dai-format = "i2s";
                    bitclock-master = <&rsnd_endpoint0>;
                    frame-master = <&rsnd_endpoint0>;
                    playback = <&ssi3>, <&src1>, <&dvc1>;
                    capture = <&ssi4>, <&src0>, <&dvc0>;
                };
            };
        };
    };

    codec {
        port {
            codec_endpoint: endpoint {
                remote-endpoint = <&rsnd_endpoint0>;
            };
        };
    };
