%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt8196-mt6681.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8196 ASoC sound card

maintainers:
  - Darren Ye <darren.ye@mediatek.com>

allOf:
  - $ref: sound-card-common.yaml#

properties:
  compatible:
    oneOf:
      - enum:
          - mediatek,mt8196-mt6681-sound
          - mediatek,mt8196-nau8825-sound
          - mediatek,mt8196-rt5682s-sound
          - mediatek,mt8196-rt5650-sound
      - items:
          - const: mediatek,mt8196-mt6681-sound
          - const: mediatek,mt8196-nau8825-sound

  audio-routing:
    description:
      Valid names could be the input or output widgets of audio components,
      power supplies, MicBias of codec and the software switch.

  mediatek,platform:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The phandle of MT8188 ASoC platform.

  mediatek,adsp:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The phandle of the MT8188 ADSP platform, which is the optional Audio DSP
      hardware that provides additional audio functionalities if present.
      The AFE will link to ADSP when the phandle is provided.

patternProperties:
  "^dai-link-[0-9]+$":
    type: object
    description:
      Container for dai-link level properties and CODEC sub-nodes.

    properties:
      link-name:
        description:
          This property corresponds to the name of the BE dai-link to which
          we are going to update parameters in this node.
        items:
          enum:
            - TDM_DPTX_BE
            - I2SOUT6_BE
            - I2SIN6_BE
            - I2SOUT4_BE
            - I2SOUT3_BE

      codec:
        description: Holds subnode which indicates codec dai.
        type: object
        additionalProperties: false
        properties:
          sound-dai:
            minItems: 1
            maxItems: 2
        required:
          - sound-dai

      dai-format:
        description: audio format.
        items:
          enum:
            - i2s
            - right_j
            - left_j
            - dsp_a
            - dsp_b

      mediatek,clk-provider:
        $ref: /schemas/types.yaml#/definitions/string
        description: Indicates dai-link clock master.
        items:
          enum:
            - cpu
            - codec

    additionalProperties: false

    required:
      - link-name

unevaluatedProperties: false

required:
  - compatible
  - mediatek,platform

examples:
  - |
    sound {
        compatible = "mediatek,mt8196-mt6681-sound";
        model = "mt8196-mt6681";
        mediatek,platform = <&afe>;
        audio-routing = "I2SOUT4", "I2SIN4_GPIO",
                        "I2SOUT4", "I2OUT4_GPIO",
                        "I2SOUT6", "I2SIN6_GPIO",
                        "I2SOUT6", "I2SOUT6_GPIO";

        dai-link-0 {
            link-name = "I2SOUT6_BE";
            dai-format = "i2s";
            mediatek,clk-provider = "cpu";
            codec {
                sound-dai = <&nau8825>;
            };
        };
    };

