%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,wsa881x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm WSA8810/WSA8815 Class-D Smart Speaker Amplifier

maintainers:
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

description: |
  WSA8810 is a class-D smart speaker amplifier and WSA8815
  is a high-output power class-D smart speaker amplifier.
  This family of amplifiers support two operating modes:
  SoundWire digital audio interface which is a primary mode
  and analog mode when device is configured via i2c only.
  This binding describes both modes.

properties:
  compatible:
    enum:
      - qcom,wsa8810
      - qcom,wsa8815
      - sdw10217201000

  reg:
    maxItems: 1

  powerdown-gpios:
    description: GPIO spec for Powerdown/Shutdown line to use
    maxItems: 1

  '#thermal-sensor-cells':
    const: 0

  '#sound-dai-cells':
    const: 0

  clocks:
    maxItems: 1

  mclk-gpios:
    description: GPIO spec for control signal to the clock gating circuit
    maxItems: 1

required:
  - compatible
  - reg
  - powerdown-gpios
  - '#thermal-sensor-cells'
  - '#sound-dai-cells'

allOf:
  - $ref: dai-common.yaml#
  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,wsa8810
              - qcom,wsa8815
    then:
      properties:
        reg:
          description:
            In case of analog mode this should be I2C address of the digital
            part of the device. The I2C address of analog part of an amplifier
            is expected to be located at the fixed offset.
          maxItems: 1
          items:
            minimum: 0x0e
            maximum: 0x0f
      required:
        - clocks
        - mclk-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/sound/qcom,q6afe.h>

    soundwire@c2d0000 {
        #address-cells = <2>;
        #size-cells = <0>;
        reg = <0x0c2d0000 0x2000>;

        speaker@0,1 {
            compatible = "sdw10217201000";
            reg = <0 1>;
            powerdown-gpios = <&wcdpinctrl 2 0>;
            #thermal-sensor-cells = <0>;
            #sound-dai-cells = <0>;
        };

        speaker@0,2 {
            compatible = "sdw10217201000";
            reg = <0 2>;
            powerdown-gpios = <&wcdpinctrl 2 0>;
            #thermal-sensor-cells = <0>;
            #sound-dai-cells = <0>;
        };
    };

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        amplifier@e {
            compatible = "qcom,wsa8810";
            reg = <0x0e>;
            clocks = <&q6afecc LPASS_CLK_ID_MCLK_3 LPASS_CLK_ATTRIBUTE_COUPLE_NO>;
            powerdown-gpios = <&lpass_tlmm 16 GPIO_ACTIVE_LOW>;
            mclk-gpios = <&lpass_tlmm 18 GPIO_ACTIVE_HIGH>;
            #sound-dai-cells = <0>;
            #thermal-sensor-cells = <0>;
       };
    };
...
