%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/xlnx,audio-formatter.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xilinx PL audio formatter

description: |
  The IP core supports DMA, data formatting(AES<->PCM conversion)
  of audio samples.

maintainers:
  - Vincenzo Frascino <vincenzo.frascino@arm.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    enum:
      - xlnx,audio-formatter-1.0

  reg:
    minItems: 1
    maxItems: 4
    description: |
      Base address and size of the IP core instance.

  interrupt-names:
    minItems: 1
    maxItems: 3
    description: |
      Names specified to list of interrupts in same order mentioned under
      "interrupts".

  interrupts:
    minItems: 1
    maxItems: 3
    description: |
      List of Interrupt numbers.

  clock-names:
    minItems: 2
    maxItems: 3
    description: |
      List of input clocks.

  clocks:
    minItems: 2
    maxItems: 3
    description: |
      Input clock specifier. Refer to common clock bindings.

required:
  - compatible
  - reg
  - interrupt-names
  - interrupts
  - clock-names
  - clocks

additionalProperties: true

examples:
  - |
    audio_ss_0_audio_formatter_0: audio_formatter@80010000 {
      compatible = "xlnx,audio-formatter-1.0";
      interrupt-names = "irq_mm2s", "irq_s2mm";
      interrupt-parent = <&gic>;
      interrupts = <0 104 4>, <0 105 4>;
      reg = <0x0 0x80010000 0x0 0x1000>;
      clock-names = "s_axi_lite_aclk", "aud_mclk";
      clocks = <&clk 71>, <&clk_wiz_1 0>;
    };
...
