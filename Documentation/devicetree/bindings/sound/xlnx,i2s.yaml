%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/xlnx,i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Device-Tree bindings for Xilinx I2S PL block

description: |
  The IP supports I2S based playback/capture audio.

maintainers:
  - Vincenzo Frascino <vincenzo.frascino@arm.com>
  - Maruthi Srinivas Bayyavarapu <maruthi.srinivas.bayyavarapu@xilinx.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    oneOf:
      - const: xlnx,i2s-receiver-1.0
      - const: xlnx,i2s-transmitter-1.0

  reg:
    maxItems: 1
    description: |
      Base address and size of the IP core instance.

  "#sound-dai-cells":
    const: 0

  "#address-cells":
    maxItems: 1

  "#size-cells":
    maxItems: 1

  xlnx,dwidth:
    $ref: /schemas/types.yaml#/definitions/uint32
    maxItems: 1
    oneOf:
      - const: 16
      - const: 24
    description: |
      Sample data width. Can be any of 16, 24.

  xlnx,num-channels:
    $ref: /schemas/types.yaml#/definitions/uint32
    maxItems: 1
    description: |
      Number of I2S streams.
    minimum: 1
    maximum: 4

required:
  - compatible
  - reg
  - xlnx,dwidth
  - xlnx,num-channels

additionalProperties: false

examples:
  - |
    i2s_receiver@a0080000 {
      compatible = "xlnx,i2s-receiver-1.0";
      reg = <0x0 0xa0080000 0x0 0x10000>;
      xlnx,dwidth = <0x18>;
      xlnx,num-channels = <1>;
    };
    i2s_transmitter@a0090000 {
      compatible = "xlnx,i2s-transmitter-1.0";
      reg = <0x0 0xa0090000 0x0 0x10000>;
      xlnx,dwidth = <0x18>;
      xlnx,num-channels = <1>;
    };

...
