%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/fsl,sof-cpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP audio CPU common properties

maintainers:
  - Daniel Baluta <daniel.baluta@nxp.com>

properties:
  reg:
    maxItems: 1

  mboxes:
    maxItems: 4

  mbox-names:
    items:
      - const: txdb0
      - const: txdb1
      - const: rxdb0
      - const: rxdb1

  memory-region:
    maxItems: 1

required:
  - reg
  - mboxes
  - mbox-names
  - memory-region

additionalProperties: true
