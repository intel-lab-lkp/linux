%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/everest,es8389.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Everest ES8389 audio CODEC

maintainers:
  - Michael Zhang <zhangyi@everest-semi.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: everest,es8389

  reg:
    maxItems: 1

  clocks:
    items:
      - description: clock for master clock (MCLK)

  clock-names:
    items:
      - const: mclk

  "#sound-dai-cells":
    const: 0

  vdda-supply:
    description:
      Analogue power supply.

  vddd-supply:
    description:
      Interface power supply.

  everest,hpfl:
    $ref: /schemas/types.yaml#/definitions/uint8
    description:
      the HPF value of ADCL.
    minimum: 0x00
    maximum: 0x0f
    default: 0x0a

  everest,hpfr:
    $ref: /schemas/types.yaml#/definitions/uint8
    description:
      the HPF value of ADCR.
    minimum: 0x00
    maximum: 0x0f
    default: 0x0a

required:
  - compatible
  - reg
  - "#sound-dai-cells"
  - vddd-supply
  - vdda-supply

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;
      es8389: codec@10 {
        compatible = "everest,es8389";
        reg = <0x10>;
        #sound-dai-cells = <0>;
        vddd-supply = <&vdd3v3>;
        vdda-supply = <&vdd3v3>;
        everest,hpfl = [0a];
        everest,hpfr = [0a];
      };
    };
