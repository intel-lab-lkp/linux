title: TI DP83TD510 10BaseT1L PHY

maintainers:
  - Oleksij Rempel <o.rempel@pengutronix.de>

description:
  DP83TD510E Ultra Low Power 802.3cg 10Base-T1L 10M Single Pair Ethernet PHY

allOf:
  - $ref: ethernet-phy.yaml#

properties:
  compatible:
    enum:
      - ethernet-phy-id2000.0181

