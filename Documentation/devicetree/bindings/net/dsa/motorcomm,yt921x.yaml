%YAML 1.2
---
$id: http://devicetree.org/schemas/net/dsa/motorcomm,yt921x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Motorcomm YT921x Ethernet switch family

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The Motorcomm YT921x series is a family of Ethernet switches with up to 8
  internal GbE PHYs and up to 2 GMACs, including YT9213NB, YT9214NB, YT9215RB,
  YT9215S, YT9215SC, YT9218N, YT9218MB.

  For now, only YT9215 is supported.

properties:
  compatible:
    const: motorcomm,yt9215

  reg:
    maxItems: 1

  reset-gpios:
    description: Optional gpio specifier for a reset line
    maxItems: 1

  motorcomm,switch-id:
    description: |
      When managed via mdio, hard-configured switch id to distinguish between
      multiple devices.
    enum: [0, 1, 2, 3]
    default: 0

  mdio:
    $ref: /schemas/net/mdio.yaml#
    unevaluatedProperties: false
    description: MDIO bus for the internal GbE PHYs.

  mdio-external:
    $ref: /schemas/net/mdio.yaml#
    unevaluatedProperties: false
    description: External MDIO bus.

    properties:
      compatible:
        const: motorcomm,yt921x-mdio-external

    required:
      - compatible

allOf:
  - $ref: dsa.yaml#/$defs/ethernet-ports

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    mdio {
        #address-cells = <1>;
        #size-cells = <0>;

        switch@1d {
            compatible = "motorcomm,yt9215";
            reg = <0x1d>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;
                    label = "lan1";
                    phy-mode = "internal";
                };

                port@1 {
                    reg = <1>;
                    label = "lan2";
                    phy-mode = "internal";
                };

                port@2 {
                    reg = <2>;
                    label = "lan3";
                    phy-mode = "internal";
                };

                port@3 {
                    reg = <3>;
                    label = "lan4";
                    phy-mode = "internal";
                };

                port@4 {
                    reg = <4>;
                    label = "wan";
                    phy-mode = "internal";
                };

                port@8 {
                    reg = <8>;
                    phy-mode = "sgmii";
                    ethernet = <&eth0>;

                    fixed-link {
                        speed = <1000>;
                        full-duplex;
                        pause;
                        asym-pause;
                    };
                };
            };
        };
    };
