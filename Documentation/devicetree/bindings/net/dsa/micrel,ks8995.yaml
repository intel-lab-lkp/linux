%YAML 1.2
---
$id: http://devicetree.org/schemas/net/dsa/micrel,ks8995.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Micrel KS8995 Family DSA Switches

maintainers:
  - Linus Walleij <linus.walleij@linaro.org>

description:
  The Micrel KS8995 DSA Switches were produced in the early-to-mid 2000s.
  The chip features a CPU port and four outgoing ports, each with an
  internal PHY. The chip is managed over SPI.

properties:
  compatible:
    enum:
      - micrel,ks8995
      - micrel,ksz8795
      - micrel,ksz8864

  reg:
    maxItems: 1

  reset-gpios:
    description: GPIO to be used to reset the whole device
    maxItems: 1

allOf:
  - $ref: dsa.yaml#/$defs/ethernet-ports
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
      #address-cells = <1>;
      #size-cells = <0>;

      ethernet-switch@0 {
        compatible = "micrel,ks8995";
        reg = <0>;
        spi-max-frequency = <25000000>;

        ethernet-ports {
          #address-cells = <1>;
          #size-cells = <0>;

          ethernet-port@0 {
            reg = <0>;
            label = "lan1";
          };
          ethernet-port@1 {
            reg = <1>;
            label = "lan2";
          };
          ethernet-port@2 {
            reg = <2>;
            label = "lan3";
          };
          ethernet-port@3 {
            reg = <3>;
            label = "lan4";
          };
          ethernet-port@4 {
            reg = <4>;
            ethernet = <&gmac1>;
            phy-mode = "rgmii-id";
            fixed-link {
              speed = <1000>;
              full-duplex;
              pause;
            };
          };
        };
      };
    };
