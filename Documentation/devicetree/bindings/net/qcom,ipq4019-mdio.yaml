%YAML 1.2
---
$id: http://devicetree.org/schemas/net/qcom,ipq4019-mdio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm IPQ40xx MDIO Controller

maintainers:
  - Robert Marko <robert.marko@sartura.hr>

properties:
  compatible:
    oneOf:
      - enum:
          - qcom,ipq4019-mdio
          - qcom,ipq5018-mdio

      - items:
          - enum:
              - qcom,ipq6018-mdio
              - qcom,ipq8074-mdio
              - qcom,ipq9574-mdio
              - qcom,ipq5332-mdio
          - const: qcom,ipq4019-mdio

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  reg:
    minItems: 1
    maxItems: 5
    description:
      the first Address and length of the register set for the MDIO controller,
      the optional second, third and fourth address and length of the register
      for ethernet LDO, these three address range are required by the platform
      IPQ50xx/IPQ5332/IPQ9574, the last address and length is for the CMN clock
      to select the reference clock.

  reg-names:
    minItems: 1
    maxItems: 5

  clocks:
    minItems: 1
    items:
      - description: MDIO clock source frequency fixed to 100MHZ
      - description: UNIPHY0 AHB clock source frequency fixed to 100MHZ
      - description: UNIPHY1 AHB clock source frequency fixed to 100MHZ
      - description: UNIPHY0 SYS clock source frequency fixed to 24MHZ
      - description: UNIPHY1 SYS clock source frequency fixed to 24MHZ

  clock-names:
    minItems: 1
    items:
      - const: gcc_mdio_ahb_clk
      - const: gcc_uniphy0_ahb_clk
      - const: gcc_uniphy1_ahb_clk
      - const: gcc_uniphy0_sys_clk
      - const: gcc_uniphy1_sys_clk

  cmn-reference-clock:
    oneOf:
      - items:
          - enum:
              - 0   # CMN PLL reference internal 48MHZ
              - 1   # CMN PLL reference external 25MHZ
              - 2   # CMN PLL reference external 31250KHZ
              - 3   # CMN PLL reference external 40MHZ
              - 4   # CMN PLL reference external 48MHZ
              - 5   # CMN PLL reference external 50MHZ
              - 6   # CMN PLL reference internal 96MHZ

  clock-frequency:
    oneOf:
      - items:
          - enum:
              - 12500000
              - 6250000
              - 3125000
              - 1562500
              - 781250
              - 390625
    description:
      The MDIO bus clock that must be output by the MDIO bus hardware,
      only the listed frequecies above can be configured, other frequency
      will cause malfunction. If absent, the default hardware value is used.

  reset-gpios:
    maxItems: 1

  reset-assert-us:
    maxItems: 1

  reset-deassert-us:
    maxItems: 1

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

allOf:
  - $ref: mdio.yaml#

  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,ipq5018-mdio
              - qcom,ipq6018-mdio
              - qcom,ipq8074-mdio
              - qcom,ipq5332-mdio
              - qcom,ipq9574-mdio
    then:
      required:
        - clocks
        - clock-names
    else:
      properties:
        clocks: false
        clock-names: false

  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,ipq5332-mdio
    then:
      properties:
        clocks:
          minItems: 5
          maxItems: 5
        reg-names:
          items:
            - const: mdio
            - const: eth_ldo1
            - const: eth_ldo2
            - const: cmn_blk

  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,ipq9574-mdio
    then:
      properties:
        reg-names:
          items:
            - const: mdio
            - const: eth_ldo1
            - const: eth_ldo2
            - const: eth_ldo3
            - const: cmn_blk

unevaluatedProperties: false

examples:
  - |
    mdio@90000 {
      #address-cells = <1>;
      #size-cells = <0>;
      compatible = "qcom,ipq4019-mdio";
      reg = <0x90000 0x64>;

      ethphy0: ethernet-phy@0 {
        reg = <0>;
      };

      ethphy1: ethernet-phy@1 {
        reg = <1>;
      };

      ethphy2: ethernet-phy@2 {
        reg = <2>;
      };

      ethphy3: ethernet-phy@3 {
        reg = <3>;
      };

      ethphy4: ethernet-phy@4 {
        reg = <4>;
      };
    };

  - |
    #include <dt-bindings/clock/qcom,ipq5332-gcc.h>
    #include <dt-bindings/gpio/gpio.h>

    mdio@90000 {
      #address-cells = <1>;
      #size-cells = <0>;
      compatible = "qcom,ipq5332-mdio",
                   "qcom,ipq4019-mdio";
      cmn-reference-clock = <0>;
      clock-frequency = <6250000>;

      reset-gpios = <&tlmm 51 GPIO_ACTIVE_LOW>;
      reset-assert-us = <100000>;
      reset-deassert-us = <100000>;

      reg = <0x90000 0x64>,
            <0x7A00610 0x4>,
            <0x7A10610 0x4>,
            <0x9B000 0x800>;

      reg-names = "mdio",
                  "eth_ldo1",
                  "eth_ldo2",
                  "cmn_blk";

      clocks = <&gcc GCC_MDIO_AHB_CLK>,
               <&gcc GCC_UNIPHY0_AHB_CLK>,
               <&gcc GCC_UNIPHY1_AHB_CLK>,
               <&gcc GCC_UNIPHY0_SYS_CLK>,
               <&gcc GCC_UNIPHY1_SYS_CLK>;

      clock-names = "gcc_mdio_ahb_clk",
                    "gcc_uniphy0_ahb_clk",
                    "gcc_uniphy1_ahb_clk",
                    "gcc_uniphy0_sys_clk",
                    "gcc_uniphy1_sys_clk";

      qca8kphy0: ethernet-phy@1 {
        compatible = "ethernet-phy-id004d.d180";
        reg = <1>;
      };

      qca8kphy1: ethernet-phy@2 {
        compatible = "ethernet-phy-id004d.d180";
        reg = <2>;
      };

      qca8kphy2: ethernet-phy@3 {
        compatible = "ethernet-phy-id004d.d180";
        reg = <3>;
      };

      qca8kphy3: ethernet-phy@4 {
        compatible = "ethernet-phy-id004d.d180";
        reg = <4>;
      };
    };
