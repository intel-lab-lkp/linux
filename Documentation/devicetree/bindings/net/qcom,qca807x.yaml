%YAML 1.2
---
$id: http://devicetree.org/schemas/net/qcom,qca807x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm QCA807X Ethernet PHY

maintainers:
  - Christian Marangi <ansuelsmth@gmail.com>
  - Robert Marko <robert.marko@sartura.hr>

description: |
  Qualcomm QCA807X Ethernet PHY is PHY package of 2 or 5
  IEEE 802.3 clause 22 compliant 10BASE-Te, 100BASE-TX and
  1000BASE-T PHY-s.

  They feature 2 SerDes, one for PSGMII or QSGMII connection with
  MAC, while second one is SGMII for connection to MAC or fiber.

  Both models have a combo port that supports 1000BASE-X and
  100BASE-FX fiber.

  Each PHY inside of QCA807x series has 4 digitally controlled
  output only pins that natively drive LED-s for up to 2 attached
  LEDs. Some vendor also use these 4 output for GPIO usage without
  attaching LEDs.

  Note that output pins can be set to drive LEDs OR GPIO, mixed
  definition are not accepted.

allOf:
  - $ref: ethernet-phy-package.yaml#

select:
  properties:
    compatible:
      contains:
        const: ethernet-phy-package
  patternProperties:
    ^ethernet-phy(@[a-f0-9]+)?$:
      properties:
        compatible:
          contains:
            enum:
              - ethernet-phy-id004d.d0b2
              - ethernet-phy-id004d.d0b1
  required:
    - compatible

properties:
  global-phys:
    maxItems: 2

  global-phy-names:
    items:
      - const: combo
      - const: pqsgmii

  phy-connection-type:
    enum:
      - qsgmii
      - psgmii

patternProperties:
  ^ethernet-phy(@[a-f0-9]+)?$:
    $ref: /schemas/net/ethernet-phy.yaml#

    properties:
      gpio-controller:
        description: set the output lines as GPIO instead of LEDs
        type: boolean

      '#gpio-cells':
        description: number of GPIO cells for the PHY
        const: 2

    dependencies:
      gpio-controller: ['#gpio-cells']

    unevaluatedProperties: false

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    mdio {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy-package {
            compatible = "ethernet-phy-package";
            #address-cells = <1>;
            #size-cells = <0>;

            global-phys = <&qca8075_4>, <&qca8075_psgmii>;
            global-phy-names = "combo", "pqsgmii";

            qca8075_1: ethernet-phy@1 {
                compatible = "ethernet-phy-id004d.d0b2";
                reg = <1>;

                leds {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    led@0 {
                        reg = <0>;
                        color = <LED_COLOR_ID_GREEN>;
                        function = LED_FUNCTION_LAN;
                        default-state = "keep";
                    };
                };
            };

            qca8075_2: ethernet-phy@2 {
                compatible = "ethernet-phy-id004d.d0b2";
                reg = <2>;

                gpio-controller;
                #gpio-cells = <2>;
            };

            qca8075_3: ethernet-phy@3 {
                compatible = "ethernet-phy-id004d.d0b2";
                reg = <3>;
            };

            qca8075_4: ethernet-phy@4 {
                compatible = "ethernet-phy-id004d.d0b2";
                reg = <4>;
            };

            qca8075_pqsgmii: ethernet-phy@5 {
                reg = <5>;
            };
        };
    };
