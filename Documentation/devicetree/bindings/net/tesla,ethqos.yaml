%YAML 1.2
---
$id: http://devicetree.org/schemas/net/tesla,ethqos.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FSD Ethernet Quality of Service

maintainers:
  - Sriranjani P <sriranjani.p@samsung.com>
  - Swathi K S <swathi.ks@samsung.com>

description:
  dwmmac based tesla ethernet devices which support Gigabit
  ethernet.

allOf:
  - $ref: snps,dwmac.yaml#

properties:
  compatible:
    const: tesla,fsd-ethqos-4.21.yaml

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 5
    maxItems: 10

  clock-names:
    minItems: 5
    maxItems: 10
    items:
      - const: ptp_ref
      - const: master_bus
      - const: slave_bus
      - const: tx
      - const: rx
      - const: master2_bus
      - const: slave2_bus
      - const: eqos_rxclk_mux
      - const: eqos_phyrxclk
      - const: dout_peric_rgmii_clk

  fsd-rx-clock-skew:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle to the syscon node
          - description: offset of the control register
    description:
      Should be phandle/offset pair. The phandle to the syscon node.

  iommus:
    maxItems: 1

  phy-mode:
    $ref: ethernet-controller.yaml#/properties/phy-connection-type

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - rx-clock-skew
  - iommus
  - phy-mode

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/fsd-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    ethernet_1: ethernet@14300000 {
              compatible = "tesla,dwc-qos-ethernet-4.21";
              reg = <0x0 0x14300000 0x0 0x10000>;
              interrupts = <GIC_SPI 176 IRQ_TYPE_LEVEL_HIGH>;
              clocks = <&clock_peric PERIC_EQOS_TOP_IPCLKPORT_CLK_PTP_REF_I>,
                       <&clock_peric PERIC_EQOS_TOP_IPCLKPORT_ACLK_I>,
                       <&clock_peric PERIC_EQOS_TOP_IPCLKPORT_HCLK_I>,
                       <&clock_peric PERIC_EQOS_TOP_IPCLKPORT_RGMII_CLK_I>,
                       <&clock_peric PERIC_EQOS_TOP_IPCLKPORT_CLK_RX_I>,
                       <&clock_peric PERIC_BUS_D_PERIC_IPCLKPORT_EQOSCLK>,
                       <&clock_peric PERIC_BUS_P_PERIC_IPCLKPORT_EQOSCLK>,
                       <&clock_peric PERIC_EQOS_PHYRXCLK_MUX>,
                       <&clock_peric PERIC_EQOS_PHYRXCLK>,
                       <&clock_peric PERIC_DOUT_RGMII_CLK>;
              clock-names = "ptp_ref",
                            "master_bus",
                            "slave_bus",
                            "tx",
                            "rx",
                            "master2_bus",
                            "slave2_bus",
                            "eqos_rxclk_mux",
                            "eqos_phyrxclk",
                            "dout_peric_rgmii_clk";
              pinctrl-names = "default";
              pinctrl-0 = <&eth1_tx_clk>, <&eth1_tx_data>, <&eth1_tx_ctrl>,
                          <&eth1_phy_intr>, <&eth1_rx_clk>, <&eth1_rx_data>,
                          <&eth1_rx_ctrl>, <&eth1_mdio>;
              fsd-rx-clock-skew = <&sysreg_peric 0x10>;
              iommus = <&smmu_peric 0x0 0x1>;
              phy-mode = "rgmii";
    };

...
