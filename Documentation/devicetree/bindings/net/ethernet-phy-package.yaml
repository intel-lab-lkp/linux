%YAML 1.2
---
$id: http://devicetree.org/schemas/net/ethernet-phy-package.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ethernet PHY Package Common Properties

maintainers:
  - Christian Marangi <ansuelsmth@gmail.com

properties:
  $nodename:
    pattern: "^ethernet-phy-package(-[0-9]+)?$"

  compatible:
    const: ethernet-phy-package

  '#address-cells':
    description: number of address cells for the MDIO bus
    const: 1

  '#size-cells':
    description: number of size cells on the MDIO bus
    const: 0

  global-phys:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    minItems: 1
    maxItems: 31
    description:
      List of phandle to the PHY in the package required and
      used to configure the PHY package.

  global-phy-names:
    $ref: /schemas/types.yaml#/definitions/string-array
    minItems: 1
    maxItems: 31
    description:
      List of names of the PHY defined in global-phys.

  phy-connection-type:
    $ref: /schemas/net/ethernet-phy-mode-types.yaml#definitions/phy-connection-type
    description:
      Specifies global interface type for the PHY package.

  phy-mode:
    $ref: "#/properties/phy-connection-type"

patternProperties:
  ^ethernet-phy(@[a-f0-9]+)?$:
    $ref: /schemas/net/ethernet-phy.yaml#

required:
  - compatible

dependencies:
  global-phy-names: [global-phys]

unevaluatedProperties: false

examples:
  - |
    ethernet {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy-package {
            compatible = "ethernet-phy-package";
            #address-cells = <1>;
            #size-cells = <0>;

            global-phys = <&phy4>;
            global-phy-names = "base";

            ethernet-phy@1 {
              compatible = "ethernet-phy-ieee802.3-c22";
              reg = <1>;
            };

            phy4: ethernet-phy@4 {
              compatible = "ethernet-phy-ieee802.3-c22";
              reg = <4>;
            };
        };
    };
