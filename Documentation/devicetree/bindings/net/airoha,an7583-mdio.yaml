%YAML 1.2
---
$id: http://devicetree.org/schemas/net/airoha,an7583-mdio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha AN7583 Dedicated MDIO Controller

maintainers:
  - Christian Marangi <ansuelsmth@gmail.com>

description:
  Airoha AN7583 SoC have 3 different MDIO Controller.

  One comes from the intergated Switch based on MT7530.

  The other 2 (that this schema describe) live under the SCU
  register supporting both C22 and C45 PHYs.

properties:
  compatible:
    const: airoha,an7583-mdio

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  '^mdio(-(bus|external))@[0-1]$':
    type: object

    $ref: mdio.yaml#

    properties:
      reg:
        minimum: 0
        maximum: 1

      resets:
        maxItems: 1

    required:
      - reg

    unevaluatedProperties: false

required:
  - compatible
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    mdio-controller {
        compatible = "airoha,an7583-mdio";
        #address-cells = <1>;
        #size-cells = <0>;

        mdio-bus@0 {
            reg = <0>;
            #address-cells = <1>;
            #size-cells = <0>;

            ethernet-phy@1f {
                reg = <31>;
            };
        };

        mdio-bus@1 {
            reg = <1>;
            #address-cells = <1>;
            #size-cells = <0>;
        };
    };
