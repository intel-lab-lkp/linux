%YAML 1.2
---
$id: http://devicetree.org/schemas/net/micrel,phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Micrel PHY properties

maintainers:
  - Ben Dooks <ben.dooks@codethink.co.uk>

properties:
  micrel,led-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [ 0, 1, 2, 3 ]
    description: |
      LED mode value to set for PHYs with configurable LEDs.

      Configure the LED mode with single value. The list of PHYs and the
      bits that are currently supported:

      KSZ8001: register 0x1e, bits 15..14
      KSZ8041: register 0x1e, bits 15..14
      KSZ8021: register 0x1f, bits 5..4
      KSZ8031: register 0x1f, bits 5..4
      KSZ8051: register 0x1f, bits 5..4
      KSZ8081: register 0x1f, bits 5..4
      KSZ8091: register 0x1f, bits 5..4
      LAN8814: register EP5.0, bit 6

      See the respective PHY datasheet for the mode values.

  micrel,rmii-reference-clock-select-25-mhz:
    description: |
      RMII Reference Clock Select bit selects 25 MHz mode

      Setting the RMII Reference Clock Select bit enables 25 MHz rather
      than 50 MHz clock mode.

      Note that this option in only needed for certain PHY revisions with a
      non-standard, inverted function of this configuration bit.
      Specifically, a clock reference ("rmii-ref" below) is always needed to
      actually select a mode.

  clocks:
    maxItems: 1

  clock-names:
    const: rmii-ref
    description: |
      supported clocks:
        - KSZ8021, KSZ8031, KSZ8081, KSZ8091: "rmii-ref": The RMII reference
          input clock. Used to determine the XI input clock.

  micrel,fiber-mode:
    type: boolean
    description: |
      If present the PHY is configured to operate in fiber mode.

      Some PHYs, such as the KSZ8041FTL variant, support fiber mode, enabled
      by the FXEN boot strapping pin. It can't be determined from the PHY
      registers whether the PHY is in fiber mode, so this boolean device tree
      property can be used to describe it.

      In fiber mode, auto-negotiation is disabled and the PHY can only work in
      100base-fx (full and half duplex) modes.

  coma-mode-gpios:
    description: |
      If present the given gpio will be deasserted when the PHY is probed.

      Some PHYs have a COMA mode input pin which puts the PHY into
      isolate and power-down mode. On some boards this input is connected
      to a GPIO of the SoC.

      Supported on the LAN8814.

dependencies:
  micrel,rmii-reference-clock-select-25-mhz: [ clock-names ]

unevaluatedProperties: false

examples:
  - |
    ethernet {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@1 {
            reg = <1>;
            micrel,led-mode = <1>;
        };
    };
