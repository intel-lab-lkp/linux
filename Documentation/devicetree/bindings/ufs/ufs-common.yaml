%YAML 1.2
---
$id: http://devicetree.org/schemas/ufs/ufs-common.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Common properties for Universal Flash Storage (UFS) Host Controllers

maintainers:
  - Alim Akhtar <alim.akhtar@samsung.com>
  - Avri Altman <avri.altman@wdc.com>

properties:
  clocks: true

  clock-names: true

  freq-table-hz:
    items:
      items:
        - description: Minimum frequency for given clock in Hz
        - description: Maximum frequency for given clock in Hz
    deprecated: true
    description: |
      Preferred is operating-points-v2.

      Array of <min max> operating frequencies in Hz stored in the same order
      as the clocks property. If either this property or operating-points-v2 is
      not defined or a value in the array is "0" then it is assumed that the
      frequency is set by the parent clock or a fixed rate clock source.

  operating-points-v2:
    description:
      Preferred over freq-table-hz.
      If present, each OPP must contain array of frequencies stored in the same
      order for each clock.  If clock frequency in the array is "0" then it is
      assumed that the frequency is set by the parent clock or a fixed rate
      clock source.

  opp-table:
    type: object

  interrupts:
    maxItems: 1

  lanes-per-direction:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2]
    default: 2
    description:
      Number of lanes available per direction.  Note that it is assumed that
      the same number of lanes are used in both directions at once.

  vdd-hba-supply:
    description:
      Phandle to UFS host controller supply regulator node.

  vcc-supply:
    description:
      Phandle to VCC supply regulator node.

  vccq-supply:
    description:
      Phandle to VCCQ supply regulator node.

  vccq2-supply:
    description:
      Phandle to VCCQ2 supply regulator node.

  vcc-supply-1p8:
    type: boolean
    description:
      For embedded UFS devices, valid VCC range is 1.7-1.95V or 2.7-3.6V. This
      boolean property when set, specifies to use low voltage range of
      1.7-1.95V. Note for external UFS cards this property is invalid and valid
      VCC range is always 2.7-3.6V.

  vcc-max-microamp:
    description:
      Specifies max. load that can be drawn from VCC supply.

  vccq-max-microamp:
    description:
      Specifies max. load that can be drawn from VCCQ supply.

  vccq2-max-microamp:
    description:
      Specifies max. load that can be drawn from VCCQ2 supply.

  msi-parent: true

  limit-hs-gear:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 6
    default: 6
    description:
      Restricts the maximum HS gear used in both TX and RX directions.

  limit-gear-rate:
    $ref: /schemas/types.yaml#/definitions/string
    enum: [rate-a, rate-b]
    default: rate-b
    description:
      Restricts the UFS controller to rate-a or rate-b for both TX and
      RX directions.

  tx-precode-g6-host-lanes:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 2
    uniqueItems: true
    items:
      minimum: 0
      maximum: 1
    description: |
      Lane indices for static Host-side TX precode enable settings for HS-G6
      only. Listed lanes have precode enabled; unlisted lanes are disabled.

  tx-precode-g6-device-lanes:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 2
    uniqueItems: true
    items:
      minimum: 0
      maximum: 1
    description: |
      Lane indices for static Device-side TX precode enable settings for HS-G6
      only. Listed lanes have precode enabled; unlisted lanes are disabled.

patternProperties:
  "^txeq-preshoot-g[1-6]$":
    $ref: /schemas/types.yaml#/definitions/uint32-array
    oneOf:
      - minItems: 2
        maxItems: 2
      - minItems: 4
        maxItems: 4
    items:
      minimum: 0
      maximum: 7
    description: |
      Static TX Equalization PreShoot settings for High Speed Gears. These
      values are programmed to the corresponding UniPro PA layer attribute
      PA_TxEQG[1-6]Setting. Each value selects a Pre-Shoot level as defined
      by the MIPI M-PHY specification (TX_HS_PreShoot_Setting).
      Values are specified as per-lane tuples:
      <Host_Lane0 Device_Lane0>, [<Host_Lane1 Device_Lane1>]

  "^txeq-deemphasis-g[1-6]$":
    $ref: /schemas/types.yaml#/definitions/uint32-array
    oneOf:
      - minItems: 2
        maxItems: 2
      - minItems: 4
        maxItems: 4
    items:
      minimum: 0
      maximum: 7
    description: |
      Static TX Equalization DeEmphasis settings for High Speed Gears. These
      values are programmed to the corresponding UniPro PA layer attribute
      PA_TxEQG[1-6]Setting. Each value selects a De-Emphasis level as defined
      by the MIPI M-PHY specification (TX_HS_DeEmphasis_Setting).
      Values are specified as per-lane tuples:
      <Host_Lane0 Device_Lane0>, [<Host_Lane1 Device_Lane1>]

dependencies:
  freq-table-hz: [ clocks ]
  operating-points-v2: [ clocks, clock-names ]

required:
  - interrupts

allOf:
  - if:
      required:
        - freq-table-hz
    then:
      properties:
        operating-points-v2: false
  - if:
      required:
        - operating-points-v2
    then:
      properties:
        freq-table-hz: false

additionalProperties: true
