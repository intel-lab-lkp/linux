%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/aspeed,ast2700-intc1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

maintainers:
  - Ryan Chen <ryan_chen@aspeedtech.com>

title: ASPEED AST2700 Interrupt Controller 1

description:
  This interrupt controller hardware is second level interrupt controller that
  is hooked to a parent interrupt controller. It's useful to combine multiple
  interrupt sources into 1 interrupt to parent interrupt controller.

properties:
  compatible:
    const: aspeed,ast2700-intc1

  reg:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

  ranges: true

patternProperties:
  "^interrupt-controller@":
    type: object
    description: A child interrupt controller node
    additionalProperties: false

    properties:
      compatible:
        enum:
          - aspeed,ast2700-intc1-ic

      reg:
        maxItems: 1

      '#interrupt-cells':
        const: 1

      interrupt-controller: true

      interrupts-extended:
        minItems: 1
        maxItems: 1

    required:
      - compatible
      - reg
      - interrupt-controller
      - '#interrupt-cells'
      - interrupts-extended

required:
  - compatible
  - reg
  - '#address-cells'
  - '#size-cells'

additionalProperties: false

examples:
  - |
    intc1: interrupt-controller@14c18000 {
        compatible = "aspeed,ast2700-intc1";
        reg = <0x14c18000 0x400>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0x14c18000 0x400>;

        intc1_0: interrupt-controller@100 {
            compatible = "aspeed,ast2700-intc1-ic";
            reg = <0x100 0x10>;
            #interrupt-cells = <1>;
            interrupt-controller;
            interrupts-extended = <&intc0_11 0>;
        };

        intc1_1: interrupt-controller@110 {
            compatible = "aspeed,ast2700-intc1-ic";
            reg = <0x110 0x10>;
            #interrupt-cells = <1>;
            interrupt-controller;
            interrupts-extended = <&intc0_11 1>;
        };
    };