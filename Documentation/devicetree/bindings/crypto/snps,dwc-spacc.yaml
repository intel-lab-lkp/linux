%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/snps,dwc-spacc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synopsys DesignWare Security Protocol Accelerator(SPAcc) Crypto Engine

maintainers:
  - Ruud Derwig <Ruud.Derwig@synopsys.com>

description:
  DWC Synopsys Security Protocol Accelerator(SPAcc) Hardware Crypto Engine is
  a crypto IP designed by Synopsys, that can accelerate cryptographic
  operations.

properties:
  compatible:
    contains:
      enum:
        - snps,dwc-spacc
        - snps,dwc-spacc-6.0

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    maxItems: 1

  little-endian: true

  vspacc-priority:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Set priority mode on the Virtual SPAcc. This is Virtual SPAcc priority
      weight. Its used in priority arbitration of the Virtual SPAccs.
    minimum: 0
    maximum: 15
    default: 0

  vspacc-index:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Virtual spacc index for validation and driver functioning.
    minimum: 0
    maximum: 7

  spacc-wdtimer:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Watchdog timer count to replace the default value in driver.
    minimum: 0x19000
    maximum: 0xFFFFF

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    spacc@40000000 {
        compatible = "snps,dwc-spacc";
        reg = <0x40000000 0x3FFFF>;
        interrupt-parent = <&gic>;
        interrupts = <0 89 4>;
        clocks = <&clock>;
        clock-names = "ref_clk";
        vspacc-priority = <4>;
        spacc-wdtimer = <10000>;
        vspacc-index = <0>;
        little-endian;
    };
