%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/rockchip,rk3588-crypto.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip cryptographic offloader

maintainers:
  - Heiko Stuebner <heiko@sntech.de>
  - Corentin Labbe <clabbe@baylibre.com>
  - Dawid Olesinski <dawidro@gmail.com>

properties:
  compatible:
    enum:
      - rockchip,rk3568-crypto
      - rockchip,rk3588-crypto

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Core clock for the crypto IP internal logic
      - description: AXI interconnect clock interface
      - description: AHB interface clock

  clock-names:
    items:
      - const: core
      - const: aclk
      - const: hclk

  resets:
    maxItems: 1

  reset-names:
    items:
      - const: core

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    crypto@fe370000 {
        compatible = "rockchip,rk3588-crypto";
        reg = <0x0 0xfe370000 0x0 0x2000>;
        interrupts = <GIC_SPI 209 IRQ_TYPE_LEVEL_HIGH 0>;
        clocks = <&scmi_clk SCMI_CRYPTO_CORE>,
                 <&scmi_clk SCMI_ACLK_SECURE_NS>,
                 <&scmi_clk SCMI_HCLK_SECURE_NS>;
        clock-names = "core", "aclk", "hclk";
        resets = <&scmi_reset SCMI_SRST_CRYPTO_CORE>;
        reset-names = "core";
    };
