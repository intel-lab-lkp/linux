%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/diodes,pi5usb30213a.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: PI5USB30213A Type-C port controller

maintainers:
  - Petr Benes <petr.benes@ysoft.com>

description:
  Diodes Incorporated PI5USB30213A Type-C Controller supports host,
  device, and dual-role mode based on voltage levels detected on CC
  pin. Dual differential channel, 2:1 USB 3.0 Mux/Demux, USB Type-C
  specification 1.1 compliant.

properties:
  compatible:
    enum:
      - diodes,pi5usb30213a

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  connector:
    type: object
    $ref: /schemas/connector/usb-connector.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - connector

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      typec@d {
        compatible = "diodes,pi5usb30213a";
        reg = <0xd>;
        pinctrl-names = "default";
        pinctrl-0 = <&pinctrl_typec>;
        interrupts-extended = <&gpio1 5 IRQ_TYPE_LEVEL_LOW>;

        connector {
          compatible = "usb-c-connector";
          label = "USB-C";
          vbus-supply = <&reg_typec>;
          power-role = "source";
          data-role = "dual";
          typec-power-opmode = "default";
          pd-disable;

          ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
              reg = <0>;

              usb_con_hs: endpoint {
                remote-endpoint = <&typec_hs>;
              };
            };

            port@1 {
              reg = <1>;

              usb_con_ss: endpoint {
                remote-endpoint = <&typec_ss>;
              };
            };
          };
        };
      };
    };
