%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ite,it8851.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ITE IT8851/IT8853 USB Type-C Power Delivery Controller

maintainers:
  - Jeson Yang <jeson.yang@ite.com.tw>

description:
  The ITE IT8851 is an I2C-based USB Type-C Power Delivery (PD) controller
  supporting one Type-C port.
  The IT8853 is the two-port variant sharing the same programming interface.

properties:
  compatible:
    enum:
      - ite,it8851
      - ite,it8853

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  wakeup-source: true

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  "^connector@[01]$":
    $ref: /schemas/connector/usb-connector.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: ite,it8851
    then:
      properties:
        connector@1: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        typec@40 {
            compatible = "ite,it8853";
            reg = <0x40>;
            interrupts-extended = <&tlmm 129 IRQ_TYPE_EDGE_FALLING>;
            wakeup-source;

            #address-cells = <1>;
            #size-cells = <0>;

            connector@0 {
                compatible = "usb-c-connector";
                reg = <0>;
                label = "USB-C-0";
                power-role = "dual";
                data-role = "dual";

                ports {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    port@0 {
                        reg = <0>;
                        endpoint {
                            remote-endpoint = <&eud_con>;
                        };
                    };

                    port@1 {
                        reg = <1>;
                        endpoint {
                            remote-endpoint = <&redriver_ss_out>;
                        };
                    };

                    port@2 {
                        reg = <2>;
                        endpoint {
                            remote-endpoint = <&fsa4480_sbu_mux>;
                        };
                    };
                };
            };

            connector@1 {
                compatible = "usb-c-connector";
                reg = <1>;
                label = "USB-C-1";
                power-role = "dual";
                data-role = "dual";

                ports {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    port@0 {
                        reg = <0>;
                        endpoint {
                          remote-endpoint = <&usb1_hs_con>;
                        };
                    };
                    port@1 {
                        reg = <1>;
                        endpoint {
                          remote-endpoint = <&redriver1_ss_out>;
                        };
                    };
                    port@2 {
                        reg = <2>;
                        endpoint {
                          remote-endpoint = <&sbu_mux1>;
                        };
                    };
                };
            };
        };
    };
