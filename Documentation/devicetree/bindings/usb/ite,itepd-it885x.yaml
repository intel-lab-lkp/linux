%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ite,itepd-it885x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ITE IT885x USB Type-C Power Delivery Controller

maintainers:
  - Jeson Yang <jeson.yang@ite.com.tw>

description:
  The ITE IT885x is an I2C-based USB Type-C Power Delivery (PD) controller.

properties:
  compatible:
    const: ite,itepd-it885x

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  wakeup-source: true

  pinctrl-names:
    minItems: 1

  pinctrl-0: true

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  "^connector(@[0-9a-f]+)?$":
    $ref: /schemas/connector/usb-connector.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        typec@40 {
            compatible = "ite,itepd-it885x";
            reg = <0x40>;
            interrupts-extended = <&tlmm 129 IRQ_TYPE_EDGE_FALLING>;
            wakeup-source;

            pinctrl-names = "default";
            pinctrl-0 = <&itepd_int_default>;

            #address-cells = <1>;
            #size-cells = <0>;

            connector@0 {
                compatible = "usb-c-connector";
                reg = <0>;
                label = "USB-C";
                power-role = "dual";
                data-role = "dual";

                ports {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    port@0 {
                        reg = <0>;
                        endpoint {
                            remote-endpoint = <&eud_con>;
                        };
                    };

                    port@1 {
                        reg = <1>;
                        endpoint {
                            remote-endpoint = <&redriver_ss_out>;
                        };
                    };

                    port@2 {
                        reg = <2>;
                        endpoint {
                            remote-endpoint = <&fsa4480_sbu_mux>;
                        };
                    };
                };
            };
        };
    };
