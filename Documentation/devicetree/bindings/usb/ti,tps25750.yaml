%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ti,tps25750.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments 25750 Type-C Port Switch and Power Delivery controller

maintainers:
  - Abdel Alkuor <abdelalkuor@geotab.com>

description: |
  Texas Instruments 25750 Type-C Port Switch and Power Delivery controller

properties:
  compatible:
    enum:
      - ti,tps25750
  reg:
    maxItems: 1

  interrupts:
    description: |
    maxItems: 1

  interrupt-names:
    items:
      - const: irq

  firmware-name:
    description: |
      Should contain the name of the default patch binary
      file located on the firmware search path which is
      used to switch the controller into APP mode

  connector:
    type: object
    $ref: ../connector/usb-connector.yaml#
    description:
      Properties for usb c connector.
    required:
      - data-role

required:
  - compatible
  - reg
  - interrupts
  - connector

additionalProperties: true

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        tps25750: tps25750@21 {
            compatible = "ti,tps25750";
            reg = <0x21>;

            interrupt-parent = <&msmgpio>;
            interrupts = <107 IRQ_TYPE_LEVEL_LOW>;
            interrupt-names = "irq";

            firmware-name = "tps25750.bin";

            pinctrl-names = "default";
            pinctrl-0 = <&typec_pins>;

            typec_con: connector {
                compatible = "usb-c-connector";
                label = "USB-C";
                data-role = "dual";
                port {
                    typec_ep: endpoint {
                        remote-endpoint = <&otg_ep>;
                    };
                };
            };
        };
    };
...
