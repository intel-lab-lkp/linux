%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ite,it5271.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ITE IT5271/IT5272/IT5273/IT5274 USB Type-C Power Delivery Controller

maintainers:
  - Amber Kao <amber.kao@ite.com.tw>

description: |
  The ITE IT527x series are I2C-based USB Type-C Power Delivery (PD)
  controllers.
  All variants support DFP/UFP/DRP roles, USB PD 3.1, Fast Role Swap,
  USB4, and TBT3/TBT4 alternate modes.

  The series comprises four ordering part numbers built on identical
  silicon; port count and PD power range support are configured via
  firmware/OTP rather than differing in the register interface itself:
    - IT5271: single-port variant, SPR
    - IT5272: two-port variant, SPR
    - IT5273: single-port variant, EPR
    - IT5274: two-port variant, EPR

properties:
  compatible:
    oneOf:
      - const: ite,it5271
      - items:
          - const: ite,it5272
          - const: ite,it5271
      - items:
          - const: ite,it5273
          - const: ite,it5271
      - items:
          - const: ite,it5274
          - const: ite,it5271

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  wakeup-source: true

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  '^connector@[01]$':
    $ref: /schemas/connector/usb-connector.yaml#
    properties:
      reg:
        maxItems: 1
    required:
      - reg
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts

anyOf:
  - required:
      - connector@0
  - required:
      - connector@1

allOf:
  - if:
      not:
        properties:
          compatible:
            contains:
              enum:
                - ite,it5272
                - ite,it5274
    then:
      properties:
        connector@1: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        /* IT5274: two-port, EPR variant */
        typec@26 {
            compatible = "ite,it5274", "ite,it5271";
            reg = <0x26>;
            interrupts-extended = <&tlmm 129 IRQ_TYPE_EDGE_FALLING>;
            wakeup-source;

            #address-cells = <1>;
            #size-cells = <0>;

            connector@0 {
                compatible = "usb-c-connector";
                reg = <0>;
                label = "USB-C-0";
                power-role = "dual";
                data-role = "dual";

                ports {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    port@0 {
                        reg = <0>;
                        endpoint {
                            remote-endpoint = <&eud_con>;
                        };
                    };

                    port@1 {
                        reg = <1>;
                        endpoint {
                            remote-endpoint = <&redriver_ss_out>;
                        };
                    };

                    port@2 {
                        reg = <2>;
                        endpoint {
                            remote-endpoint = <&dp_phy_out>;
                        };
                    };
                };
            };

            connector@1 {
                compatible = "usb-c-connector";
                reg = <1>;
                label = "USB-C-1";
                power-role = "dual";
                data-role = "dual";

                ports {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    port@0 {
                        reg = <0>;
                        endpoint {
                            remote-endpoint = <&usb1_hs_con>;
                        };
                    };

                    port@1 {
                        reg = <1>;
                        endpoint {
                            remote-endpoint = <&redriver1_ss_out>;
                        };
                    };

                    port@2 {
                        reg = <2>;
                        endpoint {
                            remote-endpoint = <&dp_phy1_out>;
                        };
                    };
                };
            };
        };
    };
