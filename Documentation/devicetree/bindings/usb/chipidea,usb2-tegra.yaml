%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/chipidea,usb2-tegra.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Tegra USB2 ChipIdea USB controller

maintainers:
  - Svyatoslav Ryhel <clamor95@gmail.com>

properties:
  compatible:
    oneOf:
      - enum:
          - nvidia,tegra20-ehci
          - nvidia,tegra20-udc
          - nvidia,tegra30-ehci
          - nvidia,tegra30-udc
          - nvidia,tegra114-udc
          - nvidia,tegra124-udc
      - items:
          - enum:
              - nvidia,tegra114-ehci
              - nvidia,tegra124-ehci
              - nvidia,tegra210-ehci
          - const: nvidia,tegra30-ehci

  operating-points-v2:
    description: A phandle to the OPP table containing the performance states.
    $ref: /schemas/types.yaml#/definitions/phandle

  nvidia,phy:
    description: phandle of usb phy that connects to the port. Use "phys" instead.
    $ref: /schemas/types.yaml#/definitions/phandle
    deprecated: true

  nvidia,needs-double-reset:
    description: Indicates double reset or not.
    type: boolean
    deprecated: true

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets

allOf:
  - $ref: chipidea,usb2-common.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/tegra30-car.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    usb@7d000000 {
        compatible = "nvidia,tegra30-udc";
        reg = <0x7d000000 0x4000>;
        interrupts = <GIC_SPI 20 IRQ_TYPE_LEVEL_HIGH>;
        phy_type = "utmi";
        clocks = <&tegra_car TEGRA30_CLK_USBD>;
        resets = <&tegra_car 22>;
        reset-names = "usb";
        phys = <&phy1>;
        power-domains = <&pd_core>;
        operating-points-v2 = <&usbd_dvfs_opp_table>;

        dr_mode = "otg";

        hnp-disable;
        srp-disable;
        adp-disable;

        usb-role-switch;
        extcon = <&charger>, <&extcon>; /* vbus, id */
        vbus-supply = <&usb_otg_vbus>;

        port {
            usb_in: endpoint {
                remote-endpoint = <&connector_out>;
            };
        };
    };
...
