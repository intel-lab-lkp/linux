%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/samsung,snps-dwc3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos SoC DWC3 USB Controller

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>
  - Selvarasu Ganesan <selvarasu.g@samsung.com>

description:
  Describes the DWC3 USB controller block implemented on Samsung Exynos SoCs.

select:
  properties:
    compatible:
      contains:
        const: samsung,snps-dwc3
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - samsung,exynos8855-dwc3
      - const: samsung,snps-dwc3

  reg:
    maxItems: 1

  power-domains:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    description: |
      Several clocks are used, depending on the variant. Typical ones are:
       - ref: Reference clock for SOF/ITP generation.
       - bus: Bus (APB) clock for register access.
    minItems: 1
    maxItems: 4

  clock-names:
    minItems: 1
    maxItems: 4

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - interrupts

allOf:
  - $ref: snps,dwc3-common.yaml#

  - if:
      properties:
        compatible:
          contains:
            const: samsung,exynos8855-dwc3
    then:
      properties:
        clocks:
          minItems: 2
          maxItems: 2
        clock-names:
          items:
            - const: ref
            - const: bus

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    usb@13200000 {
        compatible = "samsung,exynos8855-dwc3",
                     "samsung,snps-dwc3";
        reg = <0x13200000 0x10000>;
        interrupts = <GIC_SPI 436 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&usb_clk 0>,
                 <&usb_clk 1>;
        clock-names = "ref", "bus";
        dr_mode = "peripheral";
        phys = <&usbdrd_phy 0>;
        phy-names = "usb2-phy";
        snps,quirk-frame-length-adjustment = <0x20>;
        snps,dis-u2-freeclk-exists-quirk;
        snps,gfladj-refclk-lpm-sel-quirk;
    };
...
