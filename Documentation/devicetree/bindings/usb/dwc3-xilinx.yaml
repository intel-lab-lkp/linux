%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/dwc3-xilinx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xilinx SuperSpeed DWC3 USB SoC controller

maintainers:
  - Radhey Shyam Pandey <radhey.shyam.pandey@amd.com>

properties:
  compatible:
    items:
      - enum:
          - xlnx,zynqmp-dwc3
          - xlnx,versal-dwc3
          - xlnx,versal2-mmi-dwc3

  reg:
    maxItems: 1

  "#address-cells":
    enum: [ 1, 2 ]

  "#size-cells":
    enum: [ 1, 2 ]

  ranges: true

  dma-coherent: true

  power-domains:
    description: specifies a phandle to PM domain provider node
    maxItems: 1

  clocks:
    description:
      A list of phandle and clock-specifier pairs for the clocks
      listed in clock-names.
    items:
      - description: Master/Core clock, has to be >= 156.25 MHz in SSP
          mode, >= 125 MHz for SS operation and >= 60 MHz for HS
          operation.
      - description: Clock source to core during PHY power down.

  clock-names:
    items:
      - const: bus_clk
      - const: ref_clk

  resets:
    minItems: 1
    description:
      A list of phandles for resets listed in reset-names.

    items:
      - description: USB core reset
      - description: USB hibernation reset
      - description: USB APB reset

  reset-names:
    minItems: 1
    items:
      - const: usb_crst
      - const: usb_hibrst
      - const: usb_apbrst

  phys:
    minItems: 1
    maxItems: 2

  phy-names:
    minItems: 1
    maxItems: 2
    items:
      enum:
        - usb2-phy
        - usb3-phy

  reset-gpios:
    description: GPIO used for the reset ulpi-phy
    maxItems: 1

  xlnx,usb-syscon:
    description:
      Phandle to the MMI UDH system-level control register (SLCR) syscon
      node, with four cells specifying the register offsets for USB2 PHY,
      USB3 PHY, USB DRD, and USB power configuration respectively.
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle to MMI UDH SLCR syscon node
          - description: USB2 PHY register offset within SLCR
          - description: USB3 PHY register offset within SLCR
          - description: USB DRD register offset within SLCR
          - description: USB power register offset within SLCR

# Required child node:

patternProperties:
  "^usb@[0-9a-f]+$":
    $ref: snps,dwc3.yaml#

required:
  - compatible
  - "#address-cells"
  - "#size-cells"
  - ranges
  - power-domains
  - clocks
  - clock-names
  - resets
  - reset-names

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - xlnx,versal-dwc3
              - xlnx,versal2-mmi-dwc3
    then:
      properties:
        resets:
          maxItems: 1
        reset-names:
          maxItems: 1
    else:
      properties:
        resets:
          minItems: 3
        reset-names:
          minItems: 3

  - if:
      properties:
        compatible:
          contains:
            enum:
              - xlnx,zynqmp-dwc3
              - xlnx,versal-dwc3
    then:
      required:
        - reg

  - if:
      properties:
        compatible:
          contains:
            const: xlnx,versal2-mmi-dwc3
    then:
      required:
        - xlnx,usb-syscon

additionalProperties: false

examples:
  - |
    #include <dt-bindings/dma/xlnx-zynqmp-dpdma.h>
    #include <dt-bindings/power/xlnx-zynqmp-power.h>
    #include <dt-bindings/reset/xlnx-zynqmp-resets.h>
    #include <dt-bindings/reset/xlnx-zynqmp-resets.h>
    #include <dt-bindings/phy/phy.h>
    axi {
        #address-cells = <2>;
        #size-cells = <2>;

        usb@0 {
            #address-cells = <0x2>;
            #size-cells = <0x2>;
            compatible = "xlnx,zynqmp-dwc3";
            reg = <0x0 0xff9d0000 0x0 0x100>;
            clocks = <&zynqmp_clk 32>, <&zynqmp_clk 34>;
            clock-names = "bus_clk", "ref_clk";
            power-domains = <&zynqmp_firmware PD_USB_0>;
            resets = <&zynqmp_reset ZYNQMP_RESET_USB1_CORERESET>,
                     <&zynqmp_reset ZYNQMP_RESET_USB1_HIBERRESET>,
                     <&zynqmp_reset ZYNQMP_RESET_USB1_APB>;
            reset-names = "usb_crst", "usb_hibrst", "usb_apbrst";
            phys = <&psgtr 2 PHY_TYPE_USB3 0 2>;
            phy-names = "usb3-phy";
            ranges;

            usb@fe200000 {
                compatible = "snps,dwc3";
                reg = <0x0 0xfe200000 0x0 0x40000>;
                interrupt-names = "host", "otg";
                interrupts = <0 65 4>, <0 69 4>;
                dr_mode = "host";
                dma-coherent;
            };
        };
    };
  - |
    #include <dt-bindings/power/xlnx-zynqmp-power.h>
    #include <dt-bindings/reset/xlnx-zynqmp-resets.h>
    #include <dt-bindings/phy/phy.h>
    usb {
        #address-cells = <1>;
        #size-cells = <1>;
        compatible = "xlnx,versal2-mmi-dwc3";
        clocks = <&zynqmp_clk 32>, <&zynqmp_clk 34>;
        clock-names = "bus_clk", "ref_clk";
        power-domains = <&zynqmp_firmware PD_USB_0>;
        resets = <&zynqmp_reset ZYNQMP_RESET_USB1_CORERESET>;
        reset-names = "usb_crst";
        phys = <&psgtr 2 PHY_TYPE_USB3 0 2>;
        phy-names = "usb3-phy";
        xlnx,usb-syscon = <&udh_slcr 0x005c 0x0070 0x00c4 0x00f8>;
        ranges;

        usb@fe200000 {
            compatible = "snps,dwc3";
            reg = <0xfe200000 0x40000>;
            interrupt-names = "host", "otg";
            interrupts = <0 65 4>, <0 69 4>;
            dr_mode = "host";
            dma-coherent;
        };
    };
