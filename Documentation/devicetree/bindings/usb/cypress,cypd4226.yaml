%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/cypress,cypd4226.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cypress cypd4226/cypd6129/cypd6229 Type-C Controller

maintainers:
  - Wayne Chang <waynec@nvidia.com>
  - Akash Kumar <akash.kumar@oss.qualcomm.com>

description:
  The Cypress cypd4226 is a dual Type-C controller, and the cypd6129 and
  cypd6229 are dual Type-C PD controllers. All are controlled via an I2C
  interface.

properties:
  compatible:
    oneOf:
      - const: cypress,cypd4226
      - const: cypress,cypd6129
      - items:
          - const: cypress,cypd6229
          - const: cypress,cypd6129

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  firmware-name:
    enum:
      - nvidia,gpu
      - nvidia,jetson-agx-xavier
    description: |
      The name of the CCGx firmware built for product series.
      should be set one of following:
      - "nvidia,gpu" for the NVIDIA RTX product series
      - "nvidia,jetson-agx-xavier" for the NVIDIA Jetson product series

  pinctrl-0: true
  pinctrl-1: true

  pinctrl-names:
    minItems: 1
    items:
      - const: default
      - const: sleep

  wakeup-source:
    description: enable IRQ remote wakeup, see power/wakeup-source.txt
    type: boolean

patternProperties:
  '^connector@[01]$':
    $ref: /schemas/connector/usb-connector.yaml#
    required:
      - reg

required:
  - compatible
  - reg
  - interrupts

anyOf:
  - required:
      - connector@0
  - required:
      - connector@1

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: cypress,cypd4226
    then:
      properties:
        reg:
          const: 0x08
        pinctrl-0: false
        pinctrl-1: false
        pinctrl-names: false
        wakeup-source: false
    else:
      properties:
        firmware-name: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      typec@8 {
        compatible = "cypress,cypd4226";
        reg = <0x08>;
        interrupts = <2 IRQ_TYPE_LEVEL_LOW>;
        firmware-name = "nvidia,jetson-agx-xavier";
        #address-cells = <1>;
        #size-cells = <0>;
        connector@0 {
          compatible = "usb-c-connector";
          reg = <0>;
          label = "USB-C";
          data-role = "dual";
          ports {
            #address-cells = <1>;
            #size-cells = <0>;
            port@0 {
              reg = <0>;
              endpoint {
                remote-endpoint = <&usb_role_switch0>;
              };
            };
          };
        };
      };
    };
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        typec@40 {
            compatible = "cypress,cypd6129";
            reg = <0x40>;
            interrupts-extended = <&tlmm 136 IRQ_TYPE_LEVEL_LOW>;
            pinctrl-0 = <&usb0_intr_state>;
            pinctrl-names = "default";
            wakeup-source;

            #address-cells = <1>;
            #size-cells = <0>;

            connector@0 {
                compatible = "usb-c-connector";
                reg = <0>;
                label = "USB-C";
                data-role = "dual";
                power-role = "dual";

                ports {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    port@0 {
                        reg = <0>;

                        endpoint {
                            remote-endpoint = <&usb_role_switch0>;
                        };
                    };
                };
            };
        };
    };
