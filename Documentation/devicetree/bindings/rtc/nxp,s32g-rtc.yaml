%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/nxp,s32g-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP S32G2/S32G3 Real Time Clock (RTC)

maintainers:
  - Bogdan Hamciuc <bogdan.hamciuc@nxp.com>
  - Ciprian Marian Costea <ciprianmarian.costea@nxp.com>

properties:
  compatible:
    const: nxp,s32g-rtc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  nxp,clksel:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Input clock selector. Choose between 0-SIRC and 2-FIRC.
      The reason for these IDs not being consecutive is because
      they are hardware coupled.
    enum:
      - 0  # SIRC
      - 2  # FIRC

  nxp,dividers:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      An array of two u32 elements, the former encoding DIV512,
      the latter encoding DIV32. These are dividers that can be enabled
      individually, or cascaded. Use 0 to disable the respective divider,
      and 1 to enable it.
    items:
      - description: div512
      - description: div32

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: ipg
      - const: sirc
      - const: firc

required:
  - clock-names
  - clocks
  - compatible
  - interrupts
  - nxp,clksel
  - nxp,dividers
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    rtc0: rtc@40060000 {
        compatible = "nxp,s32g-rtc";
        reg = <0x40060000 0x1000>;
        interrupts = <GIC_SPI 121 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clks 54>,
                 <&clks 55>,
                 <&clks 56>;
        clock-names = "ipg", "sirc", "firc";
        nxp,clksel = <2>;
        nxp,dividers = <1 0>;
    };
