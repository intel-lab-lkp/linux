%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/nxp,pcf85363.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Philips PCF85263/PCF85363 Real Time Clock

maintainers:
  - Alexandre Belloni <alexandre.belloni@bootlin.com>

allOf:
  - $ref: rtc.yaml#

properties:
  compatible:
    enum:
      - nxp,pcf85263
      - nxp,pcf85363

  reg:
    maxItems: 1

  "#clock-cells":
    const: 0

  clock-output-names:
    maxItems: 1

  interrupts:
    maxItems: 1

  quartz-load-femtofarads:
    description:
      The capacitive load of the quartz(x-tal).
    enum: [6000, 7000, 12500]
    default: 7000

  hiz-output:
    description:
      Use enabled if the output should stay in high-impedance. This
      mode will mask the output as an interrupt source.
      Use sleep if the otuput should be only active in sleep mode.
      This mode is compatible with any other output configuration.
      The disabled value acts as if the property was not defined.
    enum:
      - enabled
      - sleep
      - disabled
    default: disabled

  start-year: true
  wakeup-source: true

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        rtc@51 {
            compatible = "nxp,pcf85363";
            reg = <0x51>;
            #clock-cells = <0>;
            quartz-load-femtofarads = <12500>;
            hiz-output = "sleep";
        };
    };
