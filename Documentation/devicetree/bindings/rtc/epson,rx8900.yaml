%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/epson,rx8900.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: EPSON RX8900 / Microcrystal RV8803 Real-Time Clock

maintainers:
  - Marek Vasut <marex@denx.de>

properties:
  compatible:
    enum:
      - epson,rx8803
      - epson,rx8804
      - epson,rx8900
      - epson,rx8901
      - microcrystal,rv8803

  reg:
    maxItems: 1

  epson,vdet-disable:
    type: boolean
    description: |
      Disable voltage detector. Should be set if no backup battery is used.

  trickle-diode-disable: true

  wakeup-source: true

  tamper:
    description: Subnode for tamper configuration. This
      subnode is only available for epson,rx8901.
    type: object
    additionalProperties: false
    properties:
      buffer-mode:
        description: Set the buffer mode to inhibit (0) or overwrite (1).
        minimum: 0
        maximum: 1
    patternProperties:
      "^evin-[0-3]$":
        $ref: /schemas/types.yaml#/definitions/uint32-array
        minItems: 3
        maxItems: 3
        description: |
          Event input pin configuration.
          The configuration is an array of tree values and contains
          "pull-resistore", "trigger" and "filter".
          For a detaild description, see epson-rx8901 datasheet.

allOf:
  - $ref: rtc.yaml#
  - if:
      properties:
        compatible:
          contains:
            enum:
              - epson,rx8901
    then:
      properties:
        tamper: true
    else:
      # property is not allowed:
      properties:
        tamper: false

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        rtc@32 {
            compatible = "epson,rx8900";
            reg = <0x32>;
            epson,vdet-disable;
            trickle-diode-disable;
        };
    };
