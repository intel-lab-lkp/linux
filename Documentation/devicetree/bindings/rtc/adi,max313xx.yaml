%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/adi,max313xx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices MAX313XX series I2C RTCs

maintainers:
  - Antoniu Miclaus <antoniu.miclaus@analog.com>
  - Chris Packham <chris.packham@alliedtelesis.co.nz>

description: Analog Devices MAX313XX series I2C RTCs.

properties:
  compatible:
    enum:
      - adi,max31328
      - adi,max31329
      - adi,max31331
      - adi,max31334
      - adi,max31335
      - adi,max31341
      - adi,max31342
      - adi,max31343

  reg:
    description: I2C address of the RTC
    items:
      - enum: [0x68, 0x69]

  interrupts:
    description:
      Alarm1 interrupt line of the RTC. Some of the RTCs have two interrupt
      lines and alarm1 interrupt muxing depends on the clockin/clockout
      configuration.
    maxItems: 1

  "#clock-cells":
    description:
      RTC can be used as a clock source through its clock output pin when
      supplied.
    const: 0

  clocks:
    description:
      RTC uses this clock for clock input when supplied. Clock has to provide
      one of these four frequencies - 1Hz, 50Hz, 60Hz or 32.768kHz.
    maxItems: 1

  adi,tc-diode:
    description:
      Select the diode configuration for the trickle charger.
      schottky - Schottky diode in series.
      standard+schottky - standard diode + Schottky diode in series.
    enum: [schottky, standard+schottky]

  trickle-resistor-ohms:
    description:
      Selected resistor for trickle charger. Should be specified if trickle
      charger should be enabled.
    enum: [3000, 6000, 11000]

required:
  - compatible
  - reg

allOf:
  - $ref: rtc.yaml#
  - if:
      properties:
        compatible:
          contains:
            enum:
              - adi,max31328
              - adi,max31342

    then:
      properties:
        aux-voltage-chargeable: false
        trickle-resistor-ohms: false

  - if:
      properties:
        compatible:
          contains:
            enum:
              - adi,max31328
              - adi,max31331
              - adi,max31334
              - adi,max31335
              - adi,max31343

    then:
      properties:
        clocks: false

  - if:
      properties:
        compatible:
          contains:
            enum:
              - adi,max31341
              - adi,max31342

    then:
      properties:
        reg:
          items:
            - const: 0x69

    else:
      properties:
        reg:
          items:
            - const: 0x68

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        rtc@68 {
            reg = <0x68>;
            compatible = "adi,max31329";
            clocks = <&clkin>;
            interrupt-parent = <&gpio>;
            interrupts = <26 IRQ_TYPE_EDGE_FALLING>;
            aux-voltage-chargeable = <1>;
            trickle-resistor-ohms = <6000>;
            adi,tc-diode = "schottky";
        };
    };
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        rtc@68 {
            compatible = "adi,max31335";
            reg = <0x68>;
            pinctrl-0 = <&rtc_nint_pins>;
            interrupts-extended = <&gpio1 16 IRQ_TYPE_LEVEL_HIGH>;
            aux-voltage-chargeable = <1>;
            trickle-resistor-ohms = <6000>;
            adi,tc-diode = "schottky";
        };
    };
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        rtc@68 {
            reg = <0x68>;
            compatible = "adi,max31331";
            #clock-cells = <0>;
        };
    };
...
