%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/i2c-mux-mule.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Mule I2C multiplexer

maintainers:
  - Farouk Bouabid <farouk.bouabid@theobroma-systems.com>
  - Quentin Schulz <quentin.schulz@theobroma-systems.com>

description: |
  Mule is an mcu that emulates a set of i2c devices which are reacheable
  through an i2c-mux.

  The emulated devices share a single i2c address with the mux itself where
  the requested register is what determines which logic is executed (mux or
  device)

      +--------------------------------------------------+
      | Mule                                             |
      |    +---------------+                             |
  ------+->|Config register|----+                        |
      | |  +---------------+    |                        |
      | |                       V_                       |
      | |                      |  \          +--------+  |
      | |                      |   \-------->| dev #0 |  |
      | |                      |   |         +--------+  |
      | |                      | M |-------->| dev #1 |  |
      | +--------------------->| U |         +--------+  |
      |                        | X |-------->| dev #2 |  |
      |                        |   |         +--------+  |
      |                        |   /-------->| dev #3 |  |
      |                        |__/          +--------+  |
      +--------------------------------------------------+


allOf:
  - $ref: /schemas/i2c/i2c-mux.yaml#

properties:
  compatible:
    const: tsd,mule-i2c-mux

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        i2c-mux@18 {
            compatible = "tsd,mule-i2c-mux";
            reg = <0x18>;
            #address-cells = <1>;
            #size-cells = <0>;

            i2c@0 {
                reg = <0x0>;
                #address-cells = <1>;
                #size-cells = <0>;

                fan: fan@18 {
                  compatible = "ti,amc6821";
                  reg = <0x18>;
                  #cooling-cells = <2>;
                };
            };
        };
    };
...
