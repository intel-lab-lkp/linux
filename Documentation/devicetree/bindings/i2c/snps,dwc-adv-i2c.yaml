%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/snps,dwc-adv-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synopsys DesignWare Advanced I2C (DWC_i2c) Controller

maintainers:
  - Aniket Limaye <a-limaye@ti.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    enum:
      - ti,tda54-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: I2C functional clock (ic_clk)
      - description: Register interface clock (pclk)

  clock-names:
    items:
      - const: ref
      - const: pclk

  resets:
    maxItems: 1

  clock-frequency:
    enum: [100000, 400000, 1000000, 3400000]
    default: 400000

  i2c-sda-hold-time-ns: true

  i2c-scl-falling-time-ns:
    default: 300

  i2c-sda-falling-time-ns:
    default: 300

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    i2c@53b00000 {
        compatible = "ti,tda54-i2c";
        reg = <0x53b00000 0x1000>;
        interrupts = <GIC_SPI 166 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&sysclk>, <&pclk>;
        clock-names = "ref", "pclk";
        clock-frequency = <400000>;
        i2c-sda-hold-time-ns = <300>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
...
