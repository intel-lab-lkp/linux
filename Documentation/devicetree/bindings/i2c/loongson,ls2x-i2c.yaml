%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/loongson,ls2x-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Loongson LS2X I2C Controller

maintainers:
  - Binbin Zhou <zhoubinbin@loongson.cn>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    enum:
      - loongson,ls2k-i2c
      - loongson,ls7a-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clock-input:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Describes the input clock of i2c controller in HZ.

  clock-div:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Describes the divisor of the input clock of i2c controller.

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c0: i2c@1fe21000 {
        compatible = "loongson,ls2k-i2c";
        reg = <0x1fe21000 0x8>;
        interrupt-parent = <&extioiic>;
        interrupts = <22 IRQ_TYPE_LEVEL_LOW>;
        clock-frequency = <100000>;
        clock-input = <100000000>;
        clock-div = <40>;
        #address-cells = <1>;
        #size-cells = <0>;

        eeprom@57 {
            compatible = "atmel,24c16";
            reg = <0x57>;
            pagesize = <16>;
        };
    };
