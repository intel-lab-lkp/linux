%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/aspeed,ast2600-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ASPEED I2C on the AST2600 SoCs

maintainers:
  - Ryan Chen <ryan_chen@aspeedtech.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    enum:
      - aspeed,ast2600-i2c-bus

  reg:
    items:
      - description: controller registers
      - description: controller buffer space

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency:
    description: Desired operating frequency of the I2C bus in Hz.
    minimum: 500
    maximum: 4000000
    default: 100000

  resets:
    maxItems: 1

  aspeed,enable-dma:
    type: boolean
    description: |
      I2C bus enable dma mode transfer.

      ASPEED ast2600 platform equipped with 16 I2C controllers that share a
      single DMA engine. DTS files can specify the data transfer mode to/from
      the device, either DMA or programmed I/O.

  aspeed,global-regs:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle reference to the i2c global syscon node, containing the
      SoC-common i2c register set.

required:
  - reg
  - compatible
  - clocks
  - resets
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/aspeed-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    i2c@80 {
        compatible = "aspeed,ast2600-i2c-bus";
        reg = <0x80 0x80>, <0xc00 0x20>;
        #address-cells = <1>;
        #size-cells = <0>;
        clocks = <&syscon ASPEED_CLK_APB>;
        resets = <&syscon ASPEED_RESET_I2C>;
        clock-frequency = <100000>;
        interrupts = <GIC_SPI 110 IRQ_TYPE_LEVEL_HIGH>;
        aspeed,global-regs = <&i2c_global>;
        aspeed,transfer-mode = "buffer";
    };
