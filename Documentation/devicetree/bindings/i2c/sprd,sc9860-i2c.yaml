%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/sprd,sc9860-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc I2C Controller Device

maintainers:
  - Huangzheng Lai <laihuangzheng@gmail.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: sprd,sc9860-i2c

  reg:
    description: physical base address of the controller, length of memory mapped region.
    maxItems: 2

  interrupts:
    maxItems: 1

  clock-names:
    items:
      - const: i2c
      - const: source
      - const: enable

  clocks:
    maxItems: 3

  clock-frequency:
    description: Contains desired I2C bus clock frequency in Hz.
    minimum: 100000
    maximum: 3400000

  reset-names:
    const: i2c_rst

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clock-names
  - clocks

additionalProperties: false

examples:
  - |
    i2c0: i2c@2240000 {
            compatible = "sprd,sc9860-i2c";
            reg = <0 0x2240000 0 0x1000>;
            interrupts = <11>;
            clock-names = "i2c", "source", "enable";
            clocks = <&clk_i2c3>, <&ext_26m>, <&clk_ap_apb_gates 11>;
            clock-frequency = <400000>;
            #address-cells = <1>;
            #size-cells = <0>;
            reset-names = "i2c_rst";
            resets = <&apahb_gate 3>;

            charger@63 {
                    compatible = "sprd,sc2731-charger";
                    reg = <0x63>;
            };
    };

