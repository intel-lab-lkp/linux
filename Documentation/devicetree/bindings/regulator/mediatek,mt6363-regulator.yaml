%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/mediatek,mt6363-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6363 PMIC Regulators

maintainers:
  - AngeloGioacchino Del Regno <angelogioacchino.delregno@collabora.com>

description:
  The MT6363 SPMI PMIC provides 10 BUCK and 26 LDO (Low Dropout) regulators
  and can optionally provide overcurrent warnings with one ocp interrupt
  for each voltage regulator.

properties:
  compatible:
    const: mediatek,mt6363-regulator

  interrupts:
    description: Overcurrent warning interrupts
    minItems: 1
    maxItems: 36

  interrupt-names:
    description:
      Names for the overcurrent interrupts are the same as the name
      of a regulator (hence the same as each regulator's node name).
      For example, the interrupt name for regulator vs2 will be "vs2".
    minItems: 1
    maxItems: 36

  isink-load:
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  ldo-vemc:
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

patternProperties:
  "^ldo-va(12-1|12-2|15)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^buck-vb[1-7]$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^buck-sshub[124]$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^ldo-v(aux|m|rfio|tref)18$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^ldo-vcn(13|15)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^ldo-vio(0p75|18)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^ldo-vram-(apu|cpub|cpum|cpul|digrf|mdfe|modem)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^ldo-vrf(0p9|12|13|18)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^ldo-vs[1-3]$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^ldo-vufs(12|18)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

required:
  - compatible

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
      interrupt-controller;
      #interrupt-cells = <3>;

      regulators {
        compatible = "mediatek,mt6363-regulator";
        interrupts = <4 16 IRQ_TYPE_LEVEL_HIGH>, <4 17 IRQ_TYPE_LEVEL_HIGH>,
                     <4 18 IRQ_TYPE_LEVEL_HIGH>, <4 19 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "vcn15", "vcn13", "vrf09", "vrf12";

        ldo-vio18 {
          regulator-name = "pp1800-vio18-s3";
          regulator-min-microvolt = <1800000>;
          regulator-max-microvolt = <1800000>;
          regulator-allowed-modes = <0 2>;
          regulator-allow-set-load;
        };
      };
    };
...
