%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/ti,pbias-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: PBIAS internal regulator

maintainers:
  - Thomas Richard <thomas.richard@bootlin.com>

description: |
  PBIAS internal regulator for SD card dual voltage i/o pads on OMAP SoCs.

properties:
  compatible:
    items:
      - enum:
          - ti,pbias-dra7
          - ti,pbias-omap2
          - ti,pbias-omap3
          - ti,pbias-omap4
          - ti,pbias-omap5
      - const: ti,pbias-omap

  reg:
    maxItems: 1

  syscon:
    description: Phandle of the system control module
    $ref: /schemas/types.yaml#/definitions/phandle

patternProperties:
  '^pbias_*':
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - syscon

additionalProperties: false

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - ti,pbias-omap2
    then:
      patternProperties:
        '^pbias_*':
          properties:
            regulator-name:
              contains:
                enum:
                  - pbias_mmc_omap2430

  - if:
      properties:
        compatible:
          contains:
            enum:
              - ti,pbias-omap3
    then:
      patternProperties:
        '^pbias_*':
          properties:
            regulator-name:
              contains:
                enum:
                  - pbias_mmc_omap2430
                  - pbias_sim_omap3

  - if:
      properties:
        compatible:
          contains:
            enum:
              - ti,pbias-omap4
    then:
      patternProperties:
        '^pbias_*':
          properties:
            regulator-name:
              contains:
                enum:
                  - pbias_mmc_omap4

  - if:
      properties:
        compatible:
          contains:
            enum:
              - ti,pbias-dra7
              - ti,pbias-omap5
    then:
      patternProperties:
        '^pbias_*':
          properties:
            regulator-name:
              contains:
                enum:
                  - pbias_mmc_omap5

examples:
  - |
    bus {
        #address-cells = <1>;
        #size-cells = <1>;

        pbias_regulator: pbias_regulator@0 {
            compatible = "ti,pbias-omap5", "ti,pbias-omap";
            reg = <0 0x4>;
            syscon = <&omap5_padconf_global>;
            pbias_mmc_reg: pbias_mmc_omap5 {
                regulator-name = "pbias_mmc_omap5";
                regulator-min-microvolt = <1800000>;
                regulator-max-microvolt = <3000000>;
            };
        };
    };
