%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/mediatek,mt6397-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6397 Regulator

maintainers:
  - Sen Chu <sen.chu@mediatek.com>
  - Macpaul Lin <macpaul.lin@mediatek.com>

description:
  Regulator node of the PMIC. This node should under the PMIC's device node.
  All voltage regulators provided by the PMIC are described as sub-nodes of
  this node.

properties:
  compatible:
    items:
      - const: mediatek,mt6397-regulator

patternProperties:
  "^(buck_)?v(core|drm|gpu|io18|pca(7|15)|sramca(7|15))$":
    description: Buck regulators
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        description: |
          BUCK regulators can set regulator-initial-mode and regulator-allowed-modes to
          values specified in dt-bindings/regulator/mediatek,mt6397-regulator.h
        items:
          enum: [0, 1]
    unevaluatedProperties: false

  "^(ldo_)?v(tcxo|(a|io)28)$":
    description: LDOs with fixed 2.8V output and 0~100/10mV tuning
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes: false
    unevaluatedProperties: false

  "^(ldo_)?vusb$":
    description: LDOs with fixed 3.0V output and 0~100/10mV tuning
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes: false
    unevaluatedProperties: false

  "^(ldo_)?v(cama|emc3v3|gp[123456]|ibr|mc|mch)$":
    description: LDOs with variable output and 0~100/10mV tuning
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes: false
    unevaluatedProperties: false

required:
  - compatible

additionalProperties: false

