%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/mediatek,mt6373-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6373 PMIC Regulators

maintainers:
  - AngeloGioacchino Del Regno <angelogioacchino.delregno@collabora.com>

description:
  The MT6373 SPMI PMIC provides 10 BUCK and 23 LDO (Low DropOut) regulators
  and can optionally provide overcurrent warnings with one ocp interrupt
  for each voltage regulator.

properties:
  compatible:
    const: mediatek,mt6373-regulator

  reg:
    maxItems: 1

  vsys-vbuck0-supply:
    description: Input supply for vbuck0
  vsys-vbuck1-supply:
    description: Input supply for vbuck1
  vsys-vbuck2-supply:
    description: Input supply for vbuck2
  vsys-vbuck3-supply:
    description: Input supply for vbuck3
  vsys-vbuck4-supply:
    description: Input supply for vbuck4
  vsys-vbuck5-supply:
    description: Input supply for vbuck5
  vsys-vbuck6-supply:
    description: Input supply for vbuck6
  vsys-vbuck7-supply:
    description: Input supply for vbuck7
  vsys-vbuck8-supply:
    description: Input supply for vbuck8
  vsys-vbuck9-supply:
    description: Input supply for vbuck9
  vs1-ldo1-supply:
    description: Input supply for vant18, vaud18, vcn18io
  vs2-ldo1-supply:
    description: Input supply for vrf12-aif, vrf13-aif
  vs3-ldo1-supply:
    description: Input supply for vrf09-aif, vsram-digrf-aif
  vsys-ldo1-supply:
    description: Input supply for vcn33-1, vcn33-2, vmc
  vsys-ldo2-supply:
    description:
      Input supply for vaux18, vcn33-3, vefuse, vfp, vibr, vio28, vtp, vusb
  vsys-ldo3-supply:
    description: Input supply for vmch, vmch-eint-high/low

patternProperties:
  "^v(ant|aud|aux)18$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^vbuck([0-9])$":
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        description: |
          Allowed Buck regulator operating modes allowed. Valid values below.
            0 - Normal mode with automatic power saving, reducing the switching
                frequency when light load conditions are detected
            1 - Forced Continuous Conduction mode (FCCM) for improved voltage
                regulation accuracy with constant switching frequency but lower
                regulator efficiency
            2 - Forced Low Power mode for improved regulator efficiency, used
                when no heavy load is expected, does not limit the maximum out
                current but unless only a light load is applied, there will be
                regulation accuracy and efficiency losses.
            3 - Forced Ultra Low Power mode for ultra low load, this greatly
                reduces the maximum output power, makes the regulator to be
                efficient only for ultra light load, and greatly reduces the
                quiescent current (Iq) of the buck.
        maxItems: 3
        items:
          enum: [ 0, 1, 2, 3 ]
    unevaluatedProperties: false

  "^v(f|t)p":
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        maxItems: 2
        items:
          enum: [ 0, 2 ]
    unevaluatedProperties: false

  "^v(cn18io|cn33-[123]|efuse|ibr|io28|sram-digrf-aif|usb)":
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        maxItems: 2
        items:
          enum: [ 0, 2 ]
    unevaluatedProperties: false

  "^vmc(h)?$":
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        maxItems: 2
        items:
          enum: [ 0, 2 ]
    unevaluatedProperties: false

  "^vmch-eint-(low|high)?$":
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        maxItems: 2
        items:
          enum: [ 0, 2 ]
    unevaluatedProperties: false

  "^vrf(09|12|13|18|io18)-aif$":
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        maxItems: 2
        items:
          enum: [ 0, 2 ]
    unevaluatedProperties: false

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
      interrupt-controller;
      #address-cells = <1>;
      #interrupt-cells = <3>;

      regulators@30 {
        compatible = "mediatek,mt6373-regulator";
        reg = <0x30>;

        vaux18 {
          regulator-name = "avss18-auxadc-mt6373";
          regulator-min-microvolt = <1800000>;
          regulator-max-microvolt = <1800000>;
          regulator-allowed-modes = <0 1 2>;
          regulator-over-current-protection;
        };

        vcn33-2 {
          regulator-name = "pp1800-2900-vmc";
          regulator-min-microvolt = <1800000>;
          regulator-max-microvolt = <2900000>;
          regulator-allowed-modes = <0 2>;
        };
      };
    };
...
