%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/mediatek,mt6392-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6392 Regulator

description:
  Regulator node of the PMIC. This node should under the PMIC's device node.
  All voltage regulators provided by the PMIC are described as sub-nodes of
  this node.

properties:
  compatible:
    items:
      - const: mediatek,mt6392-regulator

patternProperties:
  "^(buck_)?v(core|proc|sys)$":
    description: Buck regulators
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        description: |
          BUCK regulators can set regulator-initial-mode and regulator-allowed-modes to
          values specified in dt-bindings/regulator/mediatek,mt6392-regulator.h
        items:
          enum: [0, 1]
    unevaluatedProperties: false

  "^(ldo_)?v(adc18|camio|cn18|io18)$":
    description: LDOs with fixed 1.8V output
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        description: |
          LDO regulators can set regulator-initial-mode and regulator-allowed-modes to
          values specified in dt-bindings/regulator/mediatek,mt6392-regulator.h
        items:
          enum: [0, 1]
    unevaluatedProperties: false

  "^(ldo_)?v(xo22)$":
    description: LDOs with fixed 2.2V output
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        description: |
          LDO regulators can set regulator-initial-mode and regulator-allowed-modes to
          values specified in dt-bindings/regulator/mediatek,mt6392-regulator.h
        items:
          enum: [0, 1]
    unevaluatedProperties: false

  "^(ldo_)?v(m25)$":
    description: LDOs with fixed 2.5V output
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        description: |
          LDO regulators can set regulator-initial-mode and regulator-allowed-modes to
          values specified in dt-bindings/regulator/mediatek,mt6392-regulator.h
        items:
          enum: [0, 1]
    unevaluatedProperties: false

  "^(ldo_)?v(aud28|io28)$":
    description: LDOs with fixed 2.8V output w/ mode
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        description: |
          LDO regulators can set regulator-initial-mode and regulator-allowed-modes to
          values specified in dt-bindings/regulator/mediatek,mt6392-regulator.h
        items:
          enum: [0, 1]
    unevaluatedProperties: false

  "^(ldo_)?v(cama)$":
    description: LDOs with fixed 2.8V output w/o mode
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^(ldo_)?vusb$":
    description: LDOs with fixed 3.3V output
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes:
        description: |
          LDO regulators can set regulator-initial-mode and regulator-allowed-modes to
          values specified in dt-bindings/regulator/mediatek,mt6392-regulator.h
        items:
          enum: [0, 1]
    unevaluatedProperties: false

  "^(ldo_)?v(aud22|camaf|camd|cn35|efuse|emc3v3|gp1|gp2|m|mc|mch)$":
    description: LDOs with variable output
    type: object
    $ref: regulator.yaml#
    properties:
      regulator-allowed-modes: false
    unevaluatedProperties: false

required:
  - compatible

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    mt6392_regulators: regulators {
        compatible = "mediatek,mt6392-regulator";

        mt6392_vproc_reg: buck_vproc {
            regulator-name = "vproc";
            regulator-min-microvolt = <700000>;
            regulator-max-microvolt = <1350000>;
            regulator-ramp-delay = <12500>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vsys_reg: buck_vsys {
            regulator-name = "vsys";
            regulator-min-microvolt = <1400000>;
            regulator-max-microvolt = <2987500>;
            regulator-ramp-delay = <25000>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vcore_reg: buck_vcore {
            regulator-name = "vcore";
            regulator-min-microvolt = <700000>;
            regulator-max-microvolt = <1350000>;
            regulator-ramp-delay = <12500>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vxo22_reg: ldo_vxo22 {
            regulator-name = "vxo22";
            regulator-min-microvolt = <2200000>;
            regulator-max-microvolt = <2200000>;
            regulator-enable-ramp-delay = <110>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vaud22_reg: ldo_vaud22 {
            regulator-name = "vaud22";
            regulator-min-microvolt = <1800000>;
            regulator-max-microvolt = <2200000>;
            regulator-enable-ramp-delay = <264>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vcama_reg: ldo_vcama {
            regulator-name = "vcama";
            regulator-min-microvolt = <2800000>;
            regulator-max-microvolt = <2800000>;
            regulator-enable-ramp-delay = <264>;
        };

        mt6392_vaud28_reg: ldo_vaud28 {
            regulator-name = "vaud28";
            regulator-min-microvolt = <2800000>;
            regulator-max-microvolt = <2800000>;
            regulator-enable-ramp-delay = <264>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vadc18_reg: ldo_vadc18 {
            regulator-name = "vadc18";
            regulator-min-microvolt = <1800000>;
            regulator-max-microvolt = <1800000>;
            regulator-enable-ramp-delay = <264>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vcn35_reg: ldo_vcn35 {
            regulator-name = "vcn35";
            regulator-min-microvolt = <3300000>;
            regulator-max-microvolt = <3600000>;
            regulator-enable-ramp-delay = <264>;
        };

        mt6392_vio28_reg: ldo_vio28 {
            regulator-name = "vio28";
            regulator-always-on;
            regulator-boot-on;
            regulator-min-microvolt = <2800000>;
            regulator-max-microvolt = <2800000>;
            regulator-enable-ramp-delay = <264>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vusb_reg: ldo_vusb {
            regulator-name = "vusb";
            regulator-min-microvolt = <3300000>;
            regulator-max-microvolt = <3300000>;
            regulator-enable-ramp-delay = <264>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vmc_reg: ldo_vmc {
            regulator-name = "vmc";
            regulator-min-microvolt = <1800000>;
            regulator-max-microvolt = <3300000>;
            regulator-enable-ramp-delay = <264>;
            regulator-boot-on;
        };

        mt6392_vmch_reg: ldo_vmch {
            regulator-name = "vmch";
            regulator-min-microvolt = <3000000>;
            regulator-max-microvolt = <3300000>;
            regulator-enable-ramp-delay = <264>;
            regulator-boot-on;
        };

        mt6392_vemc3v3_reg: ldo_vemc3v3 {
            regulator-name = "vemc3v3";
            regulator-min-microvolt = <3000000>;
            regulator-max-microvolt = <3300000>;
            regulator-enable-ramp-delay = <264>;
            regulator-boot-on;
        };

        mt6392_vgp1_reg: ldo_vgp1 {
            regulator-name = "vgp1";
            regulator-min-microvolt = <1200000>;
            regulator-max-microvolt = <3300000>;
            regulator-enable-ramp-delay = <264>;
        };

        mt6392_vgp2_reg: ldo_vgp2 {
            regulator-name = "vgp2";
            regulator-min-microvolt = <1200000>;
            regulator-max-microvolt = <3300000>;
            regulator-enable-ramp-delay = <264>;
        };

        mt6392_vcn18_reg: ldo_vcn18 {
            regulator-name = "vcn18";
            regulator-min-microvolt = <1800000>;
            regulator-max-microvolt = <1800000>;
            regulator-enable-ramp-delay = <264>;
        };

        mt6392_vcamaf_reg: ldo_vcamaf {
            regulator-name = "vcamaf";
            regulator-min-microvolt = <1200000>;
            regulator-max-microvolt = <3300000>;
            regulator-enable-ramp-delay = <264>;
        };

        mt6392_vm_reg: ldo_vm {
            regulator-name = "vm";
            regulator-min-microvolt = <1240000>;
            regulator-max-microvolt = <1390000>;
            regulator-enable-ramp-delay = <264>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vio18_reg: ldo_vio18 {
            regulator-name = "vio18";
            regulator-min-microvolt = <1800000>;
            regulator-max-microvolt = <1800000>;
            regulator-enable-ramp-delay = <264>;
            regulator-always-on;
            regulator-boot-on;
        };

        mt6392_vcamd_reg: ldo_vcamd {
            regulator-name = "vcamd";
            regulator-min-microvolt = <1200000>;
            regulator-max-microvolt = <1800000>;
            regulator-enable-ramp-delay = <264>;
        };

        mt6392_vcamio_reg: ldo_vcamio {
            regulator-name = "vcamio";
            regulator-min-microvolt = <1800000>;
            regulator-max-microvolt = <1800000>;
            regulator-enable-ramp-delay = <264>;
        };

        mt6392_vm25_reg: ldo_vm25 {
            regulator-name = "vm25";
            regulator-min-microvolt = <2500000>;
            regulator-max-microvolt = <2500000>;
            regulator-enable-ramp-delay = <264>;
        };

        mt6392_vefuse_reg: ldo_vefuse {
            regulator-name = "vefuse";
            regulator-min-microvolt = <1800000>;
            regulator-max-microvolt = <2000000>;
            regulator-enable-ramp-delay = <264>;
        };
    };
