%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/sprd,sc2730-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc SC2730 Power Management IC regulators

maintainers:
  - Otto Pflüger <otto.pflueger@abscue.de>

properties:
  compatible:
    const: sprd,sc2730-regulator

patternProperties:
  "^DCDC_(CORE|CPU|GEN[0-1]|GPU|MEM|MEMQ|MODEM|SRAM)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^LDO_AVDD(12|18)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^LDO_VDD(18_DCXO|28)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^LDO_VDD(EMMCCORE|KPLED|LDO[0-2]|SD(CORE|IO)|SIM[0-2]|USB33|WCN|WIFIPA)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^LDO_VDDCAM(A0|A1|D0|D1|IO|MOT)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  "^LDO_VDDRF(1V25|18)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

required:
  - compatible

additionalProperties: false
...
