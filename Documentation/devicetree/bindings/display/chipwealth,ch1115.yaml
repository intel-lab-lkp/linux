%YAML 1.2
---
$id: http://devicetree.org/schemas/display/chipwealth,ch1115.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Chipwealth CH1115 Display Controller

maintainers:
  - Nicolás Antinori <nico.antinori.7@gmail.com>

description:
  Chipwealth CH1115 is a controller for monochrome dot matrix OLED
  panels.

  https://datasheet4u.com/download/1576606/CH1115.html

allOf:
  - $ref: panel/panel-common.yaml#

properties:
  compatible:
    const: chipwealth,ch1115

  reg:
    maxItems: 1

  chipwealth,inverted:
    type: boolean
    description:
      Display pixels are inverted, i.e. 0 is white and 1 is black.

  chipwealth,offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 63
    default: 0
    description:
      Display start line offset. Specifies the vertical alignment and row shift
      along the Y-coordinate.

  width-mm: true
  height-mm: true
  flip-horizontal: true
  flip-vertical: true
  panel-timing: true

required:
  - compatible
  - reg
  - width-mm
  - height-mm
  - panel-timing

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        display@3c {
            compatible = "chipwealth,ch1115";
            reg = <0x3c>;
            width-mm = <12>;
            height-mm = <8>;
            chipwealth,offset = <8>;
            panel-timing {
                clock-frequency = <0>;
                hactive = <88>;
                vactive = <48>;
                hfront-porch = <0>;
                hback-porch = <0>;
                hsync-len = <0>;
                vsync-len = <0>;
                vfront-porch = <0>;
                vback-porch = <0>;
            };
        };
    };
