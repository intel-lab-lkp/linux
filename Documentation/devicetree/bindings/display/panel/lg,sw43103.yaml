%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/lg,sw43103.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LG / BOE SW43103 1080x2460 DSI cmd mode panel

maintainers:
  - Abdur Rofik <rofikcoga@gmail.com>

description: |
  The SW43103 is a 1080x2460 command-mode AMOLED panel used by LG V60 (timelm).
  It uses Display Stream Compression (DSC) over a 4-lane MIPI DSI interface.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    enum:
      - lg,sw43103
      - boe,sw43103

  reg:
    maxItems: 1

  port: true
  vddi-supply: true
  vpnl-supply: true
  reset-gpios: true
  enable-gpios: true

required:
  - compatible
  - reg
  - vddi-supply
  - vpnl-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "lg,sw43103";
            reg = <0>;

            vddi-supply = <&vreg_l14a_1p8>;
            vpnl-supply = <&vreg_l11c_3p0>;

            reset-gpios = <&tlmm 75 GPIO_ACTIVE_LOW>;
            enable-gpios = <&pm8150l_gpios 4 GPIO_ACTIVE_HIGH>;

            port {
                endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...
