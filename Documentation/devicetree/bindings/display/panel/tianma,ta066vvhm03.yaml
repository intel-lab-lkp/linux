%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/tianma,ta066vvhm03.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Tianma TA066VVHM03 AMOLED DSI Panel

maintainers:
  - Alexander Koskovich <akoskovich@pm.me>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: tianma,ta066vvhm03

  reg:
    maxItems: 1
    description: DSI virtual channel

  vddio-supply: true
  vci-supply: true
  vdd-supply: true
  port: true
  enable-gpios: true
  reset-gpios: true

required:
  - compatible
  - reg
  - vddio-supply
  - vci-supply
  - vdd-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "tianma,ta066vvhm03";
            reg = <0>;

            enable-gpios = <&tlmm 12 GPIO_ACTIVE_HIGH>;
            reset-gpios = <&tlmm 75 GPIO_ACTIVE_LOW>;

            vci-supply = <&vreg_l10a>;
            vdd-supply = <&vreg_l3c>;
            vddio-supply = <&vreg_l14a>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...
