%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,s6e8aa0.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S6E8AA5X01 display panel controller

maintainers:
  - Kaustabh Chakraborty <kauschluss@disroot.org>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,s6e8aa5x01

  reg:
    maxItems: 1

  vdd-supply:
    maxItems: 1
    description: core voltage supply

  vci-supply:
    maxItems: 1
    description: voltage supply for analog circuits

  reset-gpios: true
  width-mm: true
  height-mm: true
  panel-timing: true

required:
  - compatible
  - reg
  - width-mm
  - height-mm
  - panel-timing

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,s6e8aa5x01";
            reg = <0>;

            vdd-supply = <&panel_vdd_reg>;
            vci-supply = <&panel_vci_reg>;

            reset-gpios = <&gpd3 4 GPIO_ACTIVE_HIGH>;

            width-mm = <62>;
            height-mm = <128>;

            panel-timing {
                clock-frequency = <73094400>;

                hactive = <720>;
                hsync-len = <2>;
                hfront-porch = <62>;
                hback-porch = <26>;

                vactive = <1480>;
                vsync-len = <2>;
                vfront-porch = <12>;
                vback-porch = <10>;
            };
        };
    };

...
