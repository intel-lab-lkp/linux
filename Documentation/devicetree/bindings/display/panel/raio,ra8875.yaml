%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/raio,ra8875.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RAiO RA8875 Display Controller

maintainers:
  - Adam Azuddin <azuddinadam@gmail.com>

description: |
  This binding is for display panels using an RAiO RA8875 controller
  connected via SPI.

allOf:
  - $ref: panel-common.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: raio,ra8875

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 25000000

  reset-gpios:
    maxItems: 1
    description: GPIO used to reset the controller, optional

  vcc-supply:
    description: Regulator that provides the VCC voltage, optional

  display-timings:
    $ref: /schemas/display/panel/display-timings.yaml#

required:
  - compatible
  - reg
  - display-timings

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        ra8875: ra8875@0 {
            compatible = "raio,ra8875";
            reg = <0>;
            spi-max-frequency = <16000000>;
            reset-gpios = <&gpio 25 GPIO_ACTIVE_LOW>;

            display-timings {
                native-mode = <&timing0>;
                timing0: timing0 {
                    clock-frequency = <25000000>;
                    hactive = <800>;
                    vactive = <480>;
                    hfront-porch = <40>;
                    hsync-len = <40>;
                    hback-porch = <40>;
                    vfront-porch = <10>;
                    vsync-len = <10>;
                    vback-porch = <20>;
                };
            };
        };
    };
