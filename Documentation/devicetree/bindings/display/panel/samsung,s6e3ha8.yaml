%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,s6e3ha8.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung s6e3ha8 AMOLED DSI panel

description: |
  The s6e3ha8 is a display driver IC used in 1440x2960 AMOLED panels from
  Samsung Mobile Displays (SMD).

  Known panels:
    - AMB577PX01, 5.77", Samsung Galaxy S9 (samsung,s6e3ha8-amb577px01)
    - AMB630QY01, 6.3", Google Pixel 3 XL (samsung,s6e3ha8-amb630qy01)

maintainers:
  - Dzmitry Sankouski <dsankouski@gmail.com>

allOf:
  - $ref: panel-common.yaml#
  - if:
      properties:
        compatible:
          contains:
            enum:
              - samsung,s6e3ha8
              - samsung,s6e3ha8-amb577px01
    then:
      required:
        - vddr-supply
  - if:
      properties:
        compatible:
          contains:
            const: samsung,s6e3ha8-amb630qy01
    then:
      required:
        - vddpos-supply
        - vddneg-supply

properties:
  compatible:
    oneOf:
      - enum:
          - samsung,s6e3ha8-amb577px01
          - samsung,s6e3ha8-amb630qy01
      - const: samsung,s6e3ha8
        deprecated: true

  reg:
    maxItems: 1

  vdd3-supply:
    description: VDD regulator

  vci-supply:
    description: VCI regulator

  vddr-supply:
    description: VDDR regulator

  vddpos-supply:
    description: positive boost supply regulator (ELVDD)

  vddneg-supply:
    description: negative boost supply regulator (ELVSS)

required:
  - compatible
  - reset-gpios
  - vdd3-supply
  - vci-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,s6e3ha8-amb577px01";
            reg = <0>;
            vci-supply = <&s2dos05_ldo4>;
            vddr-supply = <&s2dos05_buck1>;
            vdd3-supply = <&s2dos05_ldo1>;
            te-gpios = <&tlmm 10 GPIO_ACTIVE_HIGH>;
            reset-gpios = <&tlmm 6 GPIO_ACTIVE_LOW>;
            pinctrl-0 = <&sde_dsi_active &sde_te_active_sleep>;
            pinctrl-1 = <&sde_dsi_suspend &sde_te_active_sleep>;
            pinctrl-names = "default", "sleep";

            port {
                panel_in: endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };

...
