%YAML 1.2
---
$id: http://devicetree.org/schemas/display/tegra/nvidia,tegra30-csi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NVIDIA Tegra30 CSI controller

maintainers:
  - Svyatoslav Ryhel <clamor95@gmail.com>

properties:
  compatible:
    enum:
      - nvidia,tegra30-csi

  reg:
    maxItems: 1

  clocks:
    items:
      - description: module clock
      - description: PAD A clock
      - description: PAD B clock

  clock-names:
    items:
      - const: csi
      - const: csia-pad
      - const: csib-pad

  avdd-dsi-csi-supply:
    description: DSI/CSI power supply. Must supply 1.2 V.

  power-domains:
    maxItems: 1

  "#nvidia,mipi-calibrate-cells":
    description: The number of cells in a MIPI calibration specifier.
      Should be 1. The single cell specifies an id of the pads that
      need to be calibrated for a given device.
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^channel@[0-1]$":
    type: object
    description: channel 0 represents CSI-A and 1 represents CSI-B
    additionalProperties: false

    properties:
      reg:
        maxItems: 1

      nvidia,mipi-calibrate:
        description: Should contain a phandle and a specifier specifying
          which pads are used by this DSI output and need to be
          calibrated. 0 is for CSI-A, 1 is for CSI-B, 2 is for DSI-A and
          3 is for DSI-B
        $ref: /schemas/types.yaml#/definitions/phandle-array

      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

      port@0:
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: port receiving the video stream from the sensor

        properties:
          endpoint:
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes: true

            required:
              - data-lanes

        required:
          - endpoint

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: port sending the video stream to the VI

    required:
      - reg
      - "#address-cells"
      - "#size-cells"
      - port@0
      - port@1

additionalProperties: false

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - power-domains
  - "#address-cells"
  - "#size-cells"

# see nvidia,tegra20-vi.yaml for an example
