%YAML 1.2
---
$id: http://devicetree.org/schemas/display/bridge/simple-bridge.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Transparent non-programmable DRM bridges

maintainers:
  - Laurent Pinchart <laurent.pinchart+renesas@ideasonboard.com>
  - Maxime Ripard <mripard@kernel.org>

description: |
  This binding supports transparent non-programmable bridges that don't require
  any configuration, with a single input and a single output.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - ti,ths8134a
              - ti,ths8134b
          - const: ti,ths8134
      - items:
          - const: corpro,gm7123
          - const: adi,adv7123
      - enum:
          - adi,adv7123
          - dpi-color-encoder
          - dumb-vga-dac
          - ti,opa362
          - ti,ths8134
          - ti,ths8135

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: The bridge input

        properties:
          endpoint:
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              dpi-color-coding: true

      port@1:
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: The bridge output

        properties:
          endpoint:
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              dpi-color-coding: true

    required:
      - port@0
      - port@1

  enable-gpios:
    maxItems: 1
    description: GPIO controlling bridge enable

  vdd-supply:
    description: Power supply for the bridge

required:
  - compatible
  - ports

additionalProperties: false

allOf:
  - $ref: /schemas/display/dpi-color-coding.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: dpi-color-encoder
    then:
      properties:
        ports:
          properties:
            port@0:
              properties:
                endpoint:
                  required:
                    - dpi-color-coding

            port@1:
              properties:
                endpoint:
                  required:
                    - dpi-color-coding
    else:
      properties:
        ports:
          properties:
            port@0:
              properties:
                endpoint:
                  properties:
                    dpi-color-coding: false

            port@1:
              properties:
                endpoint:
                  properties:
                    dpi-color-coding: false

examples:
  - |
    bridge {
        compatible = "ti,ths8134a", "ti,ths8134";

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;

                vga_bridge_in: endpoint {
                    remote-endpoint = <&tcon0_out_vga>;
                };
            };

            port@1 {
                reg = <1>;

                vga_bridge_out: endpoint {
                    remote-endpoint = <&vga_con_in>;
                };
            };
        };
    };

  - |
    bridge {
        compatible = "dpi-color-enoder";

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;

                dpi_in: endpoint {
                    remote-endpoint = <&dc_out>;
                    dpi-color-coding = "18bit-configuration1";
                };
            };

            port@1 {
                reg = <1>;

                dpi_out: endpoint {
                    remote-endpoint = <&panel_in>;
                    dpi-color-coding = "24bit";
                };
            };
        };
    };

...
