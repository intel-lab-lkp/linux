%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/qcom,ipq5018-wcss-sec-pil.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm WCSS Secure Peripheral Image Loader

maintainers:
  - Manikanta Mylavarapu <quic_mmanikan@quicinc.com>

description:
  Wireless Connectivity Subsystem (WCSS) Secure Peripheral Image Loader loads
  firmware and power up QDSP6 remoteproc on the Qualcomm IPQ series SoC.

properties:
  compatible:
    enum:
      - qcom,ipq5018-wcss-sec-pil
      - qcom,ipq5332-wcss-sec-pil
      - qcom,ipq9574-wcss-sec-pil

  reg:
    maxItems: 1

  firmware-name:
    maxItems: 1
    description: Firmware name for the Hexagon core

  interrupts:
    items:
      - description: Watchdog interrupt
      - description: Fatal interrupt
      - description: Ready interrupt
      - description: Handover interrupt
      - description: Stop acknowledge interrupt

  interrupt-names:
    items:
      - const: wdog
      - const: fatal
      - const: ready
      - const: handover
      - const: stop-ack

  clocks:
    minItems: 1
    items:
      - description: sleep clock
      - description: AHB interconnect clock

  clock-names:
    minItems: 1
    items:
      - const: sleep
      - const: interconnect

  mboxes:
    items:
      - description: TMECom mailbox driver

  qcom,smem-states:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: States used by the AP to signal the remote processor
    items:
      - description: Stop Q6
      - description: Shutdown Q6

  qcom,smem-state-names:
    description:
      Names of the states used by the AP to signal the remote processor
    items:
      - const: stop
      - const: shutdown

  memory-region:
    items:
      - description: Q6 reserved region

  glink-edge:
    $ref: /schemas/remoteproc/qcom,glink-edge.yaml#
    description:
      Qualcomm G-Link subnode which represents communication edge, channels
      and devices related to the Modem.
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - firmware-name
  - interrupts
  - interrupt-names
  - qcom,smem-states
  - qcom,smem-state-names
  - memory-region

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: qcom,ipq5018-wcss-sec-pil
    then:
      properties:
        clocks:
          items:
            - description: sleep clock
            - description: AHB interconnect clock
        clock-names:
          items:
            - const: sleep
            - const: interconnect
      required:
        - clocks
        - clock-names

  - if:
      properties:
        compatible:
          contains:
            const: qcom,ipq5332-wcss-sec-pil
    then:
      properties:
        clocks:
          items:
            - description: sleep clock
        clock-names:
          items:
            - const: sleep
      required:
        - clocks
        - clock-names

  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,ipq9574-wcss-sec-pil
    then:
      properties:
        clocks: false
        clock-names: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    q6v5_wcss: remoteproc@cd00000 {
        compatible = "qcom,ipq9574-wcss-sec-pil";
        reg = <0x0cd00000 0x10000>;
        firmware-name = "ath11k/IPQ9574/hw1.0/q6_fw.mbn";
        interrupts-extended = <&intc GIC_SPI 325 IRQ_TYPE_EDGE_RISING>,
                              <&smp2p_wcss_in 0 IRQ_TYPE_NONE>,
                              <&smp2p_wcss_in 1 IRQ_TYPE_NONE>,
                              <&smp2p_wcss_in 2 IRQ_TYPE_NONE>,
                              <&smp2p_wcss_in 3 IRQ_TYPE_NONE>;
        interrupt-names = "wdog",
                          "fatal",
                          "ready",
                          "handover",
                          "stop-ack";

        qcom,smem-states = <&smp2p_wcss_out 1>,
                           <&smp2p_wcss_out 0>;
        qcom,smem-state-names = "stop",
                                "shutdown";
        memory-region = <&q6_region>;

        glink-edge {
            interrupts = <GIC_SPI 321 IRQ_TYPE_EDGE_RISING>;
            label = "rtr";
            qcom,remote-pid = <1>;
            mboxes = <&apcs_glb 8>;
        };
    };
