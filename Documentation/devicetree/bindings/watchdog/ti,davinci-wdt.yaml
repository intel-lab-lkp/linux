%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/ti,davinci-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments DaVinci/Keystone Watchdog Timer (WDT) Controller

description: |
  Documentation:
  Davinci DM646x - https://www.ti.com/lit/ug/spruer5b/spruer5b.pdf
  Keystone - https://www.ti.com/lit/ug/sprugv5a/sprugv5a

maintainers:
  - Andrew Davis <afd@ti.com>

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    enum:
      - ti,davinci-wdt
      - ti,keystone-wdt

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  power-domains:
    description:
      A phandle and PM domain specifier as defined by bindings of 
      the power controller specified by phandle. 
      See Documentation/devicetree/bindings/power/power-domain.yaml for details.

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    watchdog@2320000 {
        compatible = "ti,davinci-wdt";
        reg = <0x02320000 0x80>;
        timeout-sec = <30>;
        clocks = <&clkwdtimer0>;
    };
