%YAML 1.2
---
$id: http://devicetree.org/schemas/pps/pps-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: PPS Signal via GPIO

maintainers:
  - Fabio Estevam <festevam@gmail.com>

properties:
  compatible:
    const: pps-gpio

  gpios:
    description: The GPIO that provides the PPS signal.
    maxItems: 1

  echo-gpios:
    description: The GPIO that provides the PPS ECHO signal.
    maxItems: 1

  echo-active-ms:
    description: Duration in ms of the active portion of the echo pulse.

  assert-falling-edge:
    description: Indicates a falling edge assert, when present. Rising edge if absent.
    type: boolean

  pinctrl-names:
    description:
      When the PPS input is muxed through a pin controller, name the "default"
      state to select the PPS/GPIO function while the driver is bound. An
      optional "idle" state, if present, is selected when the driver is
      unbound or the system is shut down, handing the pins back to their
      alternate function.
    minItems: 1
    items:
      - const: default
      - const: idle

required:
  - compatible
  - gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    pps {
        compatible = "pps-gpio";
        pinctrl-names = "default", "idle";
        pinctrl-0 = <&pinctrl_pps>;
        pinctrl-1 = <&pinctrl_pps_idle>;
        gpios = <&gpio1 26 GPIO_ACTIVE_HIGH>;
        assert-falling-edge;
        echo-gpios = <&gpio1 27 GPIO_ACTIVE_HIGH>;
        echo-active-ms = <100>;
    };
