%YAML 1.2
---
$id: http://devicetree.org/schemas/input/himax,hx8310xx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: himax hx8310xx touchscreen

maintainers:
  - Allen Lin <allencl_lin@hotmail.com>

description:
  Supports the himax hx8310xx touchscreen.
  This touchscreen uses the spi-hid protocol but has some non-standard
  power sequencing required.

allOf:
  - $ref: /schemas/input/touchscreen/touchscreen.yaml#

properties:
  compatible:
    enum:
      - himax,hx83102j

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  spi-cpha: true

  spi-cpol: true

  spi-max-frequency: true

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmh.h>
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    spi {
      #address-cells = <1>;
      #size-cells = <0>;

      hid_himax_spi@0 {
        pinctrl-names = "default";
        pinctrl-0 = <&touch_int0 &touch_reset>;
        reg = <0>;
        spi-max-frequency = <12500000>;
        status = "okay";
        compatible = "himax,hx83102j";
        reset-gpios = <&gpio1 8 GPIO_ACTIVE_LOW>;
        spi-cpha;
        spi-cpol;
        interrupt-parent = <&gpio1>;
        interrupts = <7 IRQ_TYPE_LEVEL_LOW>;
      };
    };
