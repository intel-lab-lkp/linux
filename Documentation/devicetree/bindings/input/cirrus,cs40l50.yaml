%YAML 1.2
---
$id: http://devicetree.org/schemas/input/cirrus,cs40l50.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cirrus Logic CS40L50 Advanced Haptic Driver

maintainers:
  - James Ogletree <james.ogletree@cirrus.com>

description:
  CS40L50 is a haptic driver with waveform memory,
  integrated DSP, and closed-loop algorithms.

properties:
  compatible:
    enum:
      - cirrus,cs40l50

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  va-supply:
    description: Power supply for internal analog circuits.

  vp-supply:
    description: Power supply for always-on circuits.

  vio-supply:
    description: Power supply for digital input/output.

  vamp-supply:
    description: Power supply for the Class D amplifier.

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - vp-supply
  - vio-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      haptic-driver@34 {
        compatible = "cirrus,cs40l50";
        reg = <0x34>;
        interrupt-parent = <&gpio>;
        interrupts = <113 IRQ_TYPE_LEVEL_LOW>;
        reset-gpios = <&gpio 112 GPIO_ACTIVE_LOW>;
        vp-supply = <&vreg>;
        vio-supply = <&vreg>;
      };
    };
