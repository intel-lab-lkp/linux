%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/lg,sw42902.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silicon Works SW42902 Touchscreen Controller

maintainers:
  - Abdur Rofik <rofikcoga@gmail.com>

description: |
  The SW42902 is an I2C capacitive touchscreen controller used on the
  LG V60 (timelm).

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: lg,sw42902

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Active-low hardware reset

  vcl-supply:
    description: 3.3 V power supply

  vdd-supply:
    description: 1.8 V power supply

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - vcl-supply
  - vdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@48 {
            compatible = "lg,sw42902";
            reg = <0x48>;

            interrupts-extended = <&tlmm 39 IRQ_TYPE_LEVEL_LOW>;

            reset-gpios = <&tlmm 38 GPIO_ACTIVE_LOW>;
            vcl-supply = <&reg_ts_vcl>;
            vdd-supply = <&reg_ts_vdd>;

            touchscreen-size-x = <1080>;
            touchscreen-size-y = <2460>;
        };
    };
...
