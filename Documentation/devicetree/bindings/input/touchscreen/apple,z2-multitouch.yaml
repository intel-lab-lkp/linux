%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/apple,z2-multitouch.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple touchscreens attached using the Z2 protocol

maintainers:
  - Sasha Finkelstein <fnkl.kernel@gmail.com>

description: A series of touschscreen controllers used in Apple products

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    items:
      - enum:
          - apple,j293-touchbar
          - apple,j493-touchbar
      - const: apple,z2-touchbar
      - const: apple,z2-multitouch

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  cs-gpios:
    maxItems: 1
    description: |
      J293 has a hardware quirk where the CS line is unusable and has
      to the be driven by a GPIO pin instead

  firmware-name:
    maxItems: 1

  label:
    maxItems: 1

  touchscreen-size-x: true
  touchscreen-size-y: true

required:
  - compatible
  - interrupts
  - reset-gpios
  - firmware-name
  - label
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "apple,j293-touchbar", "apple,z2-touchbar",
                         "apple,z2-multitouch";
            reg = <0>;
            spi-max-frequency = <11500000>;
            reset-gpios = <&pinctrl_ap 139 0>;
            cs-gpios = <&pinctrl_ap 109 0>;
            interrupts-extended = <&pinctrl_ap 194 IRQ_TYPE_EDGE_FALLING>;
            firmware-name = "apple/dfrmtfw-j293.bin";
            touchscreen-size-x = <23045>;
            touchscreen-size-y = <640>;
            label = "MacBookPro17,1 Touch Bar";
        };
    };

...
