%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/eeti,exc3000.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: EETI EXC3000 series touchscreen controller

maintainers:
  - Dmitry Torokhov <dmitry.torokhov@gmail.com>

properties:
  compatible:
    oneOf:
      - const: eeti,exc3000
      - const: eeti,exc80h60
      - const: eeti,exc80h84
      - const: eeti,exc3000-i2c
      - items:
          - enum:
              - eeti,exc81w32
          - const: eeti,exc80h84
  reg:
    const: 0x2a
  interrupts:
    maxItems: 1
  reset-gpios:
    maxItems: 1
  vdd-supply:
    description: Power supply regulator for the chip
  attn-gpios:
    maxItems: 1
    description: Phandle to a GPIO to check whether interrupt is still
                 latched. This is necessary for platforms that lack
                 support for level-triggered IRQs.
  touchscreen-size-x: true
  touchscreen-size-y: true
  touchscreen-inverted-x: true
  touchscreen-inverted-y: true
  touchscreen-swapped-x-y: true

allOf:
  - $ref: touchscreen.yaml#
  - if:
      not:
        properties:
          compatible:
            contains:
              const: eeti,exc3000-i2c
    then:
      required:
        - touchscreen-size-x
        - touchscreen-size-y

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include "dt-bindings/interrupt-controller/irq.h"
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@2a {
                compatible = "eeti,exc3000";
                reg = <0x2a>;
                interrupt-parent = <&gpio1>;
                interrupts = <9 IRQ_TYPE_LEVEL_LOW>;
                touchscreen-size-x = <4096>;
                touchscreen-size-y = <4096>;
                touchscreen-inverted-x;
                touchscreen-swapped-x-y;
        };
    };

  - |
    #include <dt-bindings/gpio/gpio.h>
    #include "dt-bindings/interrupt-controller/irq.h"
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@2a {
            compatible = "eeti,exc3000-i2c";
            reg = <0x2a>;
            interrupt-parent = <&gpio>;
            interrupts = <123 IRQ_TYPE_EDGE_RISING>;
            attn-gpios = <&gpio 123 GPIO_ACTIVE_HIGH>;
        };
    };
