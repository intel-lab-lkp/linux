%YAML 1.2
---
$id: http://devicetree.org/schemas/power/reset/syscon-reboot.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Generic SYSCON mapped register reset driver

maintainers:
  - Sebastian Reichel <sre@kernel.org>

description: |+
  This is a generic reset driver using syscon to map the reset register.
  The reset is generally performed with a write to the reset register
  defined by the SYSCON register map base plus the offset with the value and
  mask defined in the reboot node. Default will be little endian mode, 32 bit
  access only. The SYSCON registers map is normally retrieved from the
  parental dt-node. So the SYSCON reboot node should be represented as a
  sub-node of a "syscon", "simple-mfd" node. Though the regmap property
  pointing to the system controller node is also supported.
  This also supports specification of separate sets of register/mask/value
  pairs for different types of reset: cold, hard, soft and warm, using
  the respective properties with the respective reset type prefix. If prefixed
  properties are not specified for a reset type, the non-prefixed properties
  will be used for that reset type.

properties:
  compatible:
    const: syscon-reboot

  mask:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Update only the register bits defined by the mask (32 bit).

  offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Offset in the register map for the reboot register (in bytes).

  reg:
    maxItems: 1
    description: Base address and size for the reboot register.

  regmap:
    $ref: /schemas/types.yaml#/definitions/phandle
    deprecated: true
    description: |
      Phandle to the register map node. This property is deprecated in favor of
      the syscon-reboot node been a child of a system controller node.

  value:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: The reset value written to the reboot register (32 bit access).

  priority:
    default: 192

patternProperties:
  "^(cold|hard|soft|warm)-(mask|offset|value)$":
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Optional alternative offset / mask / value combinations for specific
      reboot modes. The mask is optional.

  "^(cold|hard|soft|warm)-reg$":
    description:
      Optional alternative base address and size for the reboot register for
      specific reboot modes.

oneOf:
  - required:
      - offset
  - required:
      - reg

dependencies:
  cold-mask: [ cold-value ]
  cold-offset: [ cold-value ]
  cold-reg: [ cold-value ]

  hard-mask: [ hard-value ]
  hard-offset: [ hard-value ]
  hard-reg: [ hard-value ]

  soft-mask: [ soft-value ]
  soft-offset: [ soft-value ]
  soft-reg: [ soft-value ]

  warm-mask: [ warm-value ]
  warm-offset: [ warm-value ]
  warm-reg: [ warm-value ]

required:
  - compatible

additionalProperties: false

allOf:
  - $ref: restart-handler.yaml#
  - if:
      not:
        required:
          - mask
    then:
      required:
        - value

  - if:
      required:
        - cold-value
    then:
      oneOf:
        - required:
            - cold-offset
        - required:
            - cold-reg

  - if:
      required:
        - hard-value
    then:
      oneOf:
        - required:
            - hard-offset
        - required:
            - hard-reg

  - if:
      required:
        - soft-value
    then:
      oneOf:
        - required:
            - soft-offset
        - required:
            - soft-reg

  - if:
      required:
        - warm-value
    then:
      oneOf:
        - required:
            - warm-offset
        - required:
            - warm-reg

examples:
  - |
    reboot {
        compatible = "syscon-reboot";
        regmap = <&regmapnode>;
        offset = <0x0>;
        mask = <0x1>;
    };
