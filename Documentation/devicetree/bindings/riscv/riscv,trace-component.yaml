%YAML 1.2
---
$id: http://devicetree.org/schemas/riscv/riscv,trace-component.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RISC-V Trace Component

maintainers:
  - Anup Patel <anup@brainfault.org>

description:
  The RISC-V trace control interface specification standard memory mapped
  components (or devices) which support both the RISC-V efficient trace
  (E-trace) protocol and the RISC-V Nexus-based trace (N-trace) protocol.
  The RISC-V trace components have implementation specific directed acyclic
  graph style interdependency where output of one component serves as input
  to another component and certain components (such as funnel) can take inputs
  from multiple components. While the type and version of a RISC-V trace component
  can be discovered from it's IMPL memory mapped register, specific compatible strings
  are used for pre-ratified trace components.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - qemu,trace-component
          - const: riscv,trace-component
      - items:
          - const: sifive,trace-encoder0
        description: SiFive Pre-ratified Encoder Trace Component
      - items:
          - const: sifive,trace-funnel0
        description: SiFive Pre-ratified Funnel Trace Component

  reg:
    maxItems: 1

  cpus:
    maxItems: 1
    description:
      phandle to the cpu to which the RISC-V trace component is bound.

  in-ports:
    $ref: /schemas/graph.yaml#/properties/ports
    patternProperties:
      '^port(@[0-7])?$':
        description: Input connections from RISC-V trace component
        $ref: /schemas/graph.yaml#/properties/port

  out-ports:
    $ref: /schemas/graph.yaml#/properties/ports
    patternProperties:
      '^port(@[0-7])?$':
        description: Output connections from RISC-V trace component
        $ref: /schemas/graph.yaml#/properties/port

required:
  - compatible
  - reg

anyOf:
  - required: [ in-ports ]
  - required: [ out-ports ]

unevaluatedProperties: false

examples:
  - |
    // Example 1 (Per-hart encoder and ramsink components):

    trace@c000000 {
      compatible = "qemu,trace-component", "riscv,trace-component";
      reg = <0xc000000 0x1000>;
      cpus = <&CPU0>;

      out-ports {
        port {
          CPU0_ENCODER_OUTPUT: endpoint {
            remote-endpoint = <&CPU0_RAMSINK_INPUT>;
          };
        };
      };
    };

    trace@c001000 {
      compatible = "qemu,trace-component", "riscv,trace-component";
      reg = <0xc001000 0x1000>;
      cpus = <&CPU0>;

      in-ports {
        port {
          CPU0_RAMSINK_INPUT: endpoint {
          };
        };
      };
    };

    trace@c002000 {
      compatible = "qemu,trace-component", "riscv,trace-component";
      reg = <0xc002000 0x1000>;
      cpus = <&CPU1>;

      out-ports {
        port {
          CPU1_ENCODER_OUTPUT: endpoint {
            remote-endpoint = <&CPU1_RAMSINK_INPUT>;
          };
        };
      };
    };

    trace@c003000 {
      compatible = "qemu,trace-component", "riscv,trace-component";
      reg = <0xc003000 0x1000>;
      cpus = <&CPU1>;

      in-ports {
        port {
          CPU1_RAMSINK_INPUT: endpoint {
          };
        };
      };
    };

  - |
    // Example 2: SiFive trace encoder and funnel connection
    encoder-0@2000000 {
        compatible = "sifive,trace-encoder0";
        reg = <0x2000000 0x1000>;
        cpus = <&CPU0>;

        out-ports {
            port {
                encoder0_out: endpoint {
                  remote-endpoint = <&funnel_in0>;
                };
            };
        };
    };

    encoder-1@2001000 {
        compatible = "sifive,trace-encoder0";
        reg = <0x2001000 0x1000>;
        cpus = <&CPU1>;

        out-ports {
            port {
                encoder1_out: endpoint {
                  remote-endpoint = <&funnel_in1>;
                };
            };
        };
    };

    funnel-0@2002000 {
        compatible = "sifive,trace-funnel0";
        reg = <0x2002000 0x1000>;

        in-ports {
            #address-cells = <1>;
            #size-cells = <0>;
            port@0 {
                reg = <0x0>;
                funnel_in0: endpoint {
                    remote-endpoint = <&encoder0_out>;
                };
            };

            port@1 {
                reg = <0x1>;
                funnel_in1: endpoint {
                    remote-endpoint = <&encoder1_out>;
                };
            };
        };
    };
...
