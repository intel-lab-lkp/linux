%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/airoha,an8855-mfd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Airoha AN8855 Switch SoC

maintainers:
  - Christian Marangi <ansuelsmth@gmail.com>

description: >
  Airoha AN8855 Switch is a SoC that expose various peripherals like an
  Ethernet Switch, a NVMEM provider and Ethernet PHYs.

  It does also support i2c and timers but those are not currently
  supported/used.

properties:
  compatible:
    const: airoha,an8855-mfd

  reg:
    minItems: 1
    maxItems: 5

  reg-names:
    minItems: 1
    maxItems: 5

  efuse:
    type: object
    $ref: /schemas/nvmem/airoha,an8855-efuse.yaml
    description:
      EFUSE exposed by the Airoha AN8855 Switch. This child node definition
      should follow the bindings specified in
      Documentation/devicetree/bindings/nvmem/airoha,an8855-efuse.yaml

  ethernet-switch:
    type: object
    $ref: /schemas/net/dsa/airoha,an8855-switch.yaml
    description:
      Switch exposed by the Airoha AN8855 Switch. This child node definition
      should follow the bindings specified in
      Documentation/devicetree/bindings/net/dsa/airoha,an8855-switch.yaml

  mdio:
    type: object
    $ref: /schemas/net/airoha,an8855-mdio.yaml
    description:
      MDIO exposed by the Airoha AN8855 Switch. This child node definition
      should follow the bindings specified in
      Documentation/devicetree/bindings/net/airoha,an8855-mdio.yaml

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    mdio {
        #address-cells = <1>;
        #size-cells = <0>;

        mfd@1 {
            compatible = "airoha,an8855-mfd";
            reg = <1>, <2>;
            reg-names = "phy0", "phy1";

            efuse {
                compatible = "airoha,an8855-efuse";

                #nvmem-cell-cells = <0>;

                nvmem-layout {
                    compatible = "fixed-layout";
                    #address-cells = <1>;
                    #size-cells = <1>;

                    shift_sel_port0_tx_a: shift-sel-port0-tx-a@c {
                       reg = <0xc 0x4>;
                    };

                    shift_sel_port0_tx_b: shift-sel-port0-tx-b@10 {
                        reg = <0x10 0x4>;
                    };

                    shift_sel_port0_tx_c: shift-sel-port0-tx-c@14 {
                        reg = <0x14 0x4>;
                    };

                    shift_sel_port0_tx_d: shift-sel-port0-tx-d@18 {
                       reg = <0x18 0x4>;
                    };

                    shift_sel_port1_tx_a: shift-sel-port1-tx-a@1c {
                        reg = <0x1c 0x4>;
                    };

                    shift_sel_port1_tx_b: shift-sel-port1-tx-b@20 {
                        reg = <0x20 0x4>;
                    };

                    shift_sel_port1_tx_c: shift-sel-port1-tx-c@24 {
                       reg = <0x24 0x4>;
                    };

                    shift_sel_port1_tx_d: shift-sel-port1-tx-d@28 {
                        reg = <0x28 0x4>;
                    };
                };
            };

            ethernet-switch {
                compatible = "airoha,an8855-switch";

                reset-gpios = <&pio 39 0>;

                airoha,ext-surge;

                ports {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    port@0 {
                        reg = <0>;
                        label = "lan1";
                        phy-mode = "internal";
                        phy-handle = <&internal_phy1>;
                    };

                    port@1 {
                        reg = <1>;
                        label = "lan2";
                        phy-mode = "internal";
                        phy-handle = <&internal_phy2>;
                    };

                    port@5 {
                        reg = <5>;
                        label = "cpu";
                        ethernet = <&gmac0>;
                        phy-mode = "2500base-x";

                        fixed-link {
                            speed = <2500>;
                            full-duplex;
                            pause;
                        };
                    };
                };
            };

            mdio {
                compatible = "airoha,an8855-mdio";
                #address-cells = <1>;
                #size-cells = <0>;

                internal_phy1: phy@1 {
                  reg = <1>;

                  nvmem-cells = <&shift_sel_port0_tx_a>,
                      <&shift_sel_port0_tx_b>,
                      <&shift_sel_port0_tx_c>,
                      <&shift_sel_port0_tx_d>;
                  nvmem-cell-names = "tx_a", "tx_b", "tx_c", "tx_d";
                };

                internal_phy2: phy@2 {
                  reg = <2>;

                  nvmem-cells = <&shift_sel_port1_tx_a>,
                      <&shift_sel_port1_tx_b>,
                      <&shift_sel_port1_tx_c>,
                      <&shift_sel_port1_tx_d>;
                  nvmem-cell-names = "tx_a", "tx_b", "tx_c", "tx_d";
                };
            };
        };
    };
