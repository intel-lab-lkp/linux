%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/x-powers,ac200.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: X-Powers AC200 mixed-signal IC

maintainers:
  - James Hilliard <james.hilliard1@gmail.com>

description:
  The AC200 is a mixed-signal companion IC containing audio, video, RTC and
  Fast Ethernet PHY functions. Its control registers are accessed over I2C.

properties:
  compatible:
    const: x-powers,ac200

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description:
      AC200 input clock. When using the Ethernet PHY, its configured rate must
      be 24 or 27 MHz, matching the rates encoded by the documented EPHY clock
      selector.

  ac-ldoin-supply:
    description: 3.3 V supply for the audio-codec LDO input

  ephy-vcc-supply:
    description: 3.3 V supply for the Ethernet PHY analog front end

  rtc-vcc-supply:
    description: 3.3 V supply for the RTC

  tv-vcc-supply:
    description: 3.3 V supply for the TV encoder DAC

required:
  - compatible
  - reg
  - clocks
  - ac-ldoin-supply
  - ephy-vcc-supply
  - rtc-vcc-supply
  - tv-vcc-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        mixed-signal@10 {
            compatible = "x-powers,ac200";
            reg = <0x10>;
            clocks = <&pwm 5>;
            ac-ldoin-supply = <&reg_3v3>;
            ephy-vcc-supply = <&reg_3v3>;
            rtc-vcc-supply = <&reg_3v3>;
            tv-vcc-supply = <&reg_3v3>;
        };
    };
...
