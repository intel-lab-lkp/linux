%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/x-powers,ac200.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: X-Powers AC200 mixed-signal IC

maintainers:
  - James Hilliard <james.hilliard1@gmail.com>
  - Jernej Skrabec <jernej.skrabec@gmail.com>

description:
  The AC200 is a mixed-signal companion IC containing audio, video, RTC and
  Fast Ethernet PHY functions. Its control registers are accessed over I2C.

properties:
  compatible:
    const: x-powers,ac200

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description:
      AC200 input clock. When using the Ethernet PHY, its configured rate must
      be 24 or 27 MHz, matching the rates encoded by the documented EPHY clock
      selector.

  interrupts:
    maxItems: 1
    description:
      The shared open-drain INTB output for the TV encoder, Ethernet PHY and
      RTC interrupts. Omit when INTB is not connected.

  interrupt-controller: true

  '#interrupt-cells':
    const: 1
    description:
      The interrupt number, as defined in
      include/dt-bindings/mfd/x-powers,ac200.h.

  codec:
    type: object
    $ref: /schemas/sound/dai-common.yaml#
    unevaluatedProperties: false

    properties:
      compatible:
        const: x-powers,ac200-codec

      '#sound-dai-cells':
        const: 0

      ac-ldoin-supply:
        description: The 3.3 V supply for the audio codec LDO input.

    required:
      - compatible
      - '#sound-dai-cells'
      - ac-ldoin-supply

  tv-encoder:
    type: object
    additionalProperties: false

    properties:
      compatible:
        const: x-powers,ac200-tve

      interrupts:
        maxItems: 1
        description:
          Cable detection interrupt routed through the AC200 interrupt
          controller. Omit when INTB is not connected. Cable detection status
          can also be read over I2C without an interrupt.

      tv-vcc-supply:
        description: The 3.3 V supply for the composite-video DAC.

      nvmem-cells:
        maxItems: 1

      nvmem-cell-names:
        items:
          - const: bandgap

      ports:
        $ref: /schemas/graph.yaml#/properties/ports

        properties:
          port@0:
            $ref: /schemas/graph.yaml#/properties/port
            description: Input from the display pipeline, carrying CCIR656.

          port@1:
            $ref: /schemas/graph.yaml#/properties/port
            description: Output to the composite-video connector.

        required:
          - port@0
          - port@1

    required:
      - compatible
      - tv-vcc-supply
      - ports

    dependencies:
      nvmem-cells: [ nvmem-cell-names ]
      nvmem-cell-names: [ nvmem-cells ]

required:
  - compatible
  - reg
  - clocks

allOf:
  - if:
      properties:
        tv-encoder:
          anyOf:
            - required: [ interrupts ]
            - required: [ interrupts-extended ]
      required:
        - tv-encoder
    then:
      required:
        - interrupts
        - interrupt-controller
        - '#interrupt-cells'

dependencies:
  interrupt-controller: [ '#interrupt-cells', interrupts ]
  '#interrupt-cells': [ interrupt-controller ]

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/mfd/x-powers,ac200.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        mixed-signal@10 {
            compatible = "x-powers,ac200";
            reg = <0x10>;
            clocks = <&pwm 5>;
            interrupt-parent = <&pio>;
            interrupts = <1 20 IRQ_TYPE_LEVEL_LOW>;
            interrupt-controller;
            #interrupt-cells = <1>;

            codec {
                compatible = "x-powers,ac200-codec";
                #sound-dai-cells = <0>;
                ac-ldoin-supply = <&reg_aldo2>;
            };

            tv-encoder {
                compatible = "x-powers,ac200-tve";
                interrupts = <AC200_IRQ_TVE>;
                tv-vcc-supply = <&reg_aldo2>;

                ports {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    port@0 {
                        reg = <0>;

                        tve_in: endpoint {
                            remote-endpoint = <&tcon_out_tve>;
                        };
                    };

                    port@1 {
                        reg = <1>;

                        tve_out: endpoint {
                            remote-endpoint = <&composite_in>;
                        };
                    };
                };
            };
        };
    };
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        mixed-signal@10 {
            compatible = "x-powers,ac200";
            reg = <0x10>;
            clocks = <&pwm 5>;
            /* INTB is not connected. */

            tv-encoder {
                compatible = "x-powers,ac200-tve";
                tv-vcc-supply = <&reg_aldo2>;

                ports {
                    #address-cells = <1>;
                    #size-cells = <0>;

                    port@0 {
                        reg = <0>;

                        endpoint {
                            remote-endpoint = <&tcon_out_tve>;
                        };
                    };

                    port@1 {
                        reg = <1>;

                        endpoint {
                            remote-endpoint = <&composite_in>;
                        };
                    };
                };
            };
        };
    };
...
