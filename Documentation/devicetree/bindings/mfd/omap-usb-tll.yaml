%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/omap-usb-tll.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OMAP HS USB Host TLL (Transceiver-Less Interface)

maintainers:
  - <maintainer@kernel.org>

properties:
  compatible:
    enum:
      - ti,usbhs-tll

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  ti,hwmod:
    const: usb_tll_hs

  clocks:
    minItems: 2

  clock-names:
    items:
      - const: usb_tll_hs_usb_ch0_clk
      - const: usb_tll_hs_usb_ch1_clk
      - const: usb_tll_hs_usb_ch2_clk
    minItems: 2

required:
  - compatible
  - reg
  - interrupts
  - ti,hwmod

additionalProperties: false

examples:
  - |
    usbhstll@4a062000 {
      compatible = "ti,usbhs-tll";
      reg = <0x4a062000 0x1000>;
      interrupts = <78>;
      ti,hwmod = "usb_tll_hs";
    };
