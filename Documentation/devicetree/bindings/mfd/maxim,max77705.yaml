%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/maxim,max77705.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX77705 Companion Power Management IC and USB Type-C interface IC

maintainers:
  - Dzmitry Sankouski <dsankouski@gmail.com>

description: |
  The Maxim MAX77705 is a Companion Power Management and Type-C
  interface IC which includes charger, fuelgauge, LED, haptic motor driver and
  Type-C management IC.

properties:
  compatible:
    const: maxim,max77705

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  charger:
    $ref: /schemas/power/supply/power-supply.yaml
    unevaluatedProperties: false
    properties:
      compatible:
        const: maxim,max77705-charger

    required:
      - compatible
      - monitored-battery

  fuel-gauge:
    $ref: /schemas/power/supply/power-supply.yaml
    type: object
    unevaluatedProperties: false
    description: MAX77705 fuel gauge with ModelGauge m5 EZ algorithm support.

    properties:
      compatible:
        const: maxim,max77705-fuel-gauge

      shunt-resistor-micro-ohms:
        description:
          The value of current sense resistor in microohms.

    required:
      - compatible
      - shunt-resistor-micro-ohms
      - monitored-battery
      - power-supplies

  haptic:
    type: object
    additionalProperties: false

    properties:
      compatible:
        const: maxim,max77705-haptic

      haptic-supply: true

      pwms:
        maxItems: 1

    required:
      - compatible
      - haptic-supply
      - pwms

  leds:
    type: object
    additionalProperties: false
    description:
      Up to 4 LEDs supported. One LED is represented by one child node.

    properties:
      compatible:
        const: maxim,max77705-rgb

      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

    patternProperties:
      "^led@[0-3]$":
        $ref: /schemas/leds/common.yaml#
        type: object
        unevaluatedProperties: false

        properties:
          reg:
            description: LED index.
            minimum: 0
            maximum: 3

        required:
          - reg

    required:
      - compatible
      - "#address-cells"
      - "#size-cells"

required:
  - compatible

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@66 {
            compatible = "maxim,max77705";
            reg = <0x66>;
            interrupt-parent = <&pm8998_gpios>;
            interrupts = <11 IRQ_TYPE_LEVEL_LOW>;
            pinctrl-0 = <&chg_int_default>;
            pinctrl-names = "default";

            leds {
                compatible = "maxim,max77705-led";
                #address-cells = <1>;
                #size-cells = <0>;

                led@1 {
                    reg = <1>;
                    label = "red:usr1";
                };

                led@2 {
                    reg = <2>;
                    label = "green:usr2";
                };

                led@3 {
                    reg = <3>;
                    label = "blue:usr3";
                };
            };

            max77705_charger: charger {
                compatible = "maxim,max77705-charger";
                monitored-battery = <&battery>;
            };

            fuel-gauge {
                compatible = "maxim,max77705-fuel-gauge";
                monitored-battery = <&battery>;
                power-supplies = <&max77705_charger>;
                shunt-resistor-micro-ohms = <5000>;
            };


            haptic {
                compatible = "maxim,max77705-haptic";
                haptic-supply = <&vib_regulator>;
                pwms = <&vib_pwm 0 50000>;
            };
        };
    };
