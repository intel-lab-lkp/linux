%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/fsl,imx28-lradc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale MXS LRADC

maintainers:
  - Frank Li <Frank.Li@nxp.com>

properties:
  compatible:
    enum:
      - fsl,imx23-lradc
      - fsl,imx28-lradc

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 13

  '#io-channel-cells':
    const: 1

  clocks:
    maxItems: 1

  fsl,lradc-touchscreen-wires:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [4, 5]
    description:
      Number of wires used to connect the touchscreen
      to LRADC. Valid value is either 4 or 5. If this
      property is not present, then the touchscreen is
      disabled. 5 wires is valid for i.MX28 SoC only.

  fsl,ave-ctrl:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 4
    minimum: 1
    maximum: 32
    description:
      number of samples per direction to calculate an average value.

  fsl,ave-delay:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 2
    maximum: 2048
    description:
      delay between consecutive samples.
      It is used if 'fsl,ave-ctrl' > 1, counts at
      2 kHz and its default is 2 (= 1 ms)


  fsl,settling:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 2047
    description:
      delay between plate switch to next sample.
      It counts at 2 kHz and its default is 10 (= 5 ms)


required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    adc@80050000 {
        compatible = "fsl,imx23-lradc";
        reg = <0x80050000 0x2000>;
        interrupts = <36 37 38 39 40 41 42 43 44>;
        fsl,lradc-touchscreen-wires = <4>;
        fsl,ave-ctrl = <4>;
        fsl,ave-delay = <2>;
        fsl,settling = <10>;
    };

