%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/rohm,bd79124.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ROHM BD79124 ADC/GPO

maintainers:
  - Matti Vaittinen <mazziesaccount@gmail.com>

description: |
  The ROHM BD79124 is a 12-bit, 8-channel, SAR ADC. The ADC supports
  an automatic measurement mode, with an alarm interrupt for out-of-window
  measurements. ADC input pins can be also configured as general purpose
  outputs.

properties:
  compatible:
    const: rohm,bd79124

  reg:
    description:
      I2C slave address.
    maxItems: 1

  interrupts:
    maxItems: 1

  gpio-controller: true

  "#gpio-cells":
    const: 1
    description:
      The pin number.

  vdd-supply: true

  iovdd-supply: true

patternProperties:
  "^channel@[0-9a-f]+$":
    type: object
    $ref: /schemas/iio/adc/adc.yaml#
    description: Represents ADC channel.

    properties:
      reg:
        items:
          minimum: 1
          maximum: 8

    required:
      - reg

    additionalProperties: false

  "-pins$":
    type: object
    $ref: /schemas/pinctrl/pinmux-node.yaml

    properties:
      function:
        enum: [gpo, adc]

      groups:
        description:
          List of pin groups affected by the functions specified in this
          subnode.
        items:
          enum: [ain0, ain1, ain2, ain3, ain4, ain5, ain6, ain7]

      pins:
        items:
          enum: [ain0, ain1, ain2, ain3, ain4, ain5, ain6, ain7]

    additionalProperties: false

required:
  - compatible
  - reg
  - iovdd-supply
  - vdd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/leds/common.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        adc: adc@10 {
            compatible = "rohm,bd79124";
            reg = <0x10>;
            interrupt-parent = <&gpio1>;
            interrupts = <29 8>;
            vdd-supply = <&dummyreg>;
            iovdd-supply = <&dummyreg>;

            adcpins: adc-pins {
                pins = "ain0", "ain1", "ain5", "ain7";
                function = "adc";
            };
            gpopins: gpo-pins {
                groups = "ain2", "ain3", "ain4", "ain6";
                function = "gpo";
            };
        };
    };
