%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/renesas,rzg3s-vbattb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas Battery Backup Function (VBATTB)

description:
  Renesas VBATTB is a module which controls the RTC clock (VBATTCLK), tamper
  detection logic and a small general usage memory (128B).

maintainers:
  - Claudiu Beznea <claudiu.beznea.uj@bp.renesas.com>

properties:
  compatible:
    items:
      - const: renesas,rzg3s-vbattb
      - const: syscon
      - const: simple-mfd

  reg:
    maxItems: 1

  ranges: true

  interrupts:
    maxItems: 1

  interrupt-names:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    maxItems: 1

  power-domains:
    maxItems: 1

  resets:
    maxItems: 1

  '#address-cells':
    const: 2

  '#size-cells':
    const: 2

patternProperties:
  "^clock-controller@[0-9a-f]+$":
    $ref: /schemas/clock/renesas,rzg3s-vbattb-clk.yaml#
    description: VBATTCLK clock

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - power-domains
  - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/r9a08g045-cpg.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    vbattb: vbattb@1005c000 {
        compatible = "renesas,rzg3s-vbattb", "syscon", "simple-mfd";
        reg = <0x1005c000 0x1000>;
        ranges = <0 0 0x1005c000 0 0x1000>;
        interrupts = <GIC_SPI 43 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "tampdi";
        clocks = <&cpg CPG_MOD R9A08G045_VBAT_BCLK>;
        clock-names = "bclk";
        power-domains = <&cpg>;
        resets = <&cpg R9A08G045_VBAT_BRESETN>;
        #address-cells = <2>;
        #size-cells = <2>;
        status = "disabled";

        vbattclk: clock-controller@1c {
            compatible = "renesas,rzg3s-vbattb-clk";
            reg = <0 0x1c 0 0x10>;
            clocks = <&cpg CPG_MOD R9A08G045_VBAT_BCLK>, <&vbattb_xtal>;
            clock-names = "bclk", "vbattb_xtal";
            #clock-cells = <0>;
            power-domains = <&cpg>;
            status = "disabled";
        };
    };

...
