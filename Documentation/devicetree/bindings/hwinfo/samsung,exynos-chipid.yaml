%YAML 1.2
---
$id: http://devicetree.org/schemas/hwinfo/samsung,exynos-chipid.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos SoC series Chipid driver

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

properties:
  compatible:
    oneOf:
      - enum:
          - samsung,exynos4210-chipid
          - samsung,exynos850-chipid
      - items:
          - enum:
              - samsung,exynos5433-chipid
              - samsung,exynos7-chipid
              - samsung,exynos7870-chipid
              - samsung,exynos8890-chipid
          - const: samsung,exynos4210-chipid
      - items:
          - enum:
              - samsung,exynos2200-chipid
              - samsung,exynos7885-chipid
              - samsung,exynos8895-chipid
              - samsung,exynos9610-chipid
              - samsung,exynos9810-chipid
              - samsung,exynos990-chipid
              - samsung,exynosautov9-chipid
              - samsung,exynosautov920-chipid
          - const: samsung,exynos850-chipid
      - items:
          - const: google,gs101-chipid

  nvmem-cells:
    maxItems: 2

  nvmem-cell-names:
    items:
      - const: product-id
      - const: chip-id

  reg:
    maxItems: 1

  samsung,asv-bin:
    description:
      Adaptive Supply Voltage bin selection. This can be used
      to determine the ASV bin of an SoC if respective information
      is missing in the CHIPID registers or in the OTP memory.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2, 3]

required:
  - compatible

allOf:
  - if:
      properties:
        compatible:
          contains:
            oneOf:
              - enum:
                  - samsung,exynos4210-chipid
                  - samsung,exynos850-chipid
              - items:
                  - enum:
                      - samsung,exynos5433-chipid
                      - samsung,exynos7-chipid
                      - samsung,exynos7870-chipid
                      - samsung,exynos8890-chipid
                  - const: samsung,exynos4210-chipid
              - items:
                  - enum:
                      - samsung,exynos2200-chipid
                      - samsung,exynos7885-chipid
                      - samsung,exynos8895-chipid
                      - samsung,exynos9610-chipid
                      - samsung,exynos9810-chipid
                      - samsung,exynos990-chipid
                      - samsung,exynosautov9-chipid
                      - samsung,exynosautov920-chipid
                  - const: samsung,exynos850-chipid
    then:
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            const: google,gs101-chipid
    then:
      required:
        - nvmem-cells
        - nvmem-cell-names

additionalProperties: false

examples:
  - |
    chipid@10000000 {
        compatible = "samsung,exynos4210-chipid";
        reg = <0x10000000 0x100>;
        samsung,asv-bin = <2>;
    };
