%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/ibm,p10-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: IBM SPI Controller

maintainers:
  - Eddie James <eajames@linux.ibm.com>

description:
  A basic SPI controller found on IBM Power chips, accessed over FSI. This
  node will always be a child node of an ibm,fsi2spi node.

properties:
  compatible:
    enum:
      - ibm,p10-spi

  reg:
    maxItems: 1

required:
  - compatible
  - reg

allOf:
  - $ref: spi-controller.yaml#

unevaluatedProperties: false

examples:
  - |
    fsi2spi@1c00 {
        compatible = "ibm,fsi2spi";
        reg = <0x1c00 0x400>;
        #address-cells = <1>;
        #size-cells = <0>;

        spi@0 {
            compatible = "ibm,p10-spi";
            reg = <0>;
            #address-cells = <1>;
            #size-cells = <0>;

            eeprom@0 {
                compatible = "atmel,at25";
                reg = <0>;
                size = <0x80000>;
                address-width = <24>;
                pagesize = <256>;
                spi-max-frequency = <1000000>;
            };
        };
    };
