%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/andestech,qilai-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Andes ATCSPI200 SPI controller

maintainers:
  - CL Wang <cl634@andestech.com>

properties:
  compatible:
    enum:
      - andestech,qilai-spi
      - andestech,ae350-spi

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  num-cs:
    description: Number of chip selects supported
    maxItems: 1

  dmas:
    items:
      - description: Transmit FIFO DMA channel
      - description: Receive FIFO DMA channel

  dma-names:
    items:
      - const: tx
      - const: rx

patternProperties:
  "@[0-9a-f]+$":
    type: object
    additionalProperties: true

    properties:
      spi-rx-bus-width:
        enum: [1, 4]

      spi-tx-bus-width:
        enum: [1, 4]

allOf:
  - $ref: spi-controller.yaml#

required:
  - compatible
  - reg
  - clocks
  - dmas
  - dma-names

unevaluatedProperties: false

examples:
  - |
    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      spi@f0b00000 {
        compatible = "andestech,qilai-spi";
        reg = <0x0 0xf0b00000 0x0 0x1000>;
        #address-cells = <1>;
        #size-cells = <0>;
        clocks = <&clk_spi>;
        dmas = <&dma0 0>, <&dma0 1>;
        dma-names = "tx", "rx";

        flash@0 {
          compatible = "jedec,spi-nor";
          reg = <0x0>;
          spi-tx-bus-width = <0x4>;
          spi-rx-bus-width = <0x4>;
          spi-cpol;
          spi-cpha;
        };
      };
    };
