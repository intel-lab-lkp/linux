%YAML 1.2
---
$id: http://devicetree.org/schemas/gpu/img,powervr-rogue.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Imagination Technologies PowerVR and IMG Rogue GPUs

maintainers:
  - Frank Binns <frank.binns@imgtec.com>

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - ti,am62-gpu
          - const: img,img-axe-1-16m
          - const: img,img-rogue
      - items:
          - enum:
              - ti,j721s2-gpu
          - const: img,img-bxs-4-64
          - const: img,img-rogue

      # This legacy combination of compatible strings was introduced early on before the more
      # specific GPU identifiers were used. Keep it around here for compatibility, but never use
      # "img,img-axe" in new devicetrees.
      - items:
          - const: ti,am62-gpu
          - const: img,img-axe

  reg:
    maxItems: 1

  clocks:
    oneOf:
      - minItems: 1
        maxItems: 1
      - minItems: 3
        maxItems: 3

  clock-names:
    oneOf:
      - items:
          - const: core
      - items:
          - const: core
          - const: mem
          - const: sys

  interrupts:
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 2

  power-domain-names:
    oneOf:
      - items:
          - const: a
      - items:
          - const: a
          - const: b

  dma-coherent: true

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - interrupts
  - power-domains
  - power-domain-names

additionalProperties: false

allOf:
  # Cores with a single power domain
  - if:
      properties:
        compatible:
          contains:
            anyOf:
              - const: img,img-axe-1-16m
    then:
      properties:
        power-domains:
          minItems: 1
          maxItems: 1
        power-domain-names:
          items:
            - const: a
  # Cores with two power domains
  - if:
      properties:
        compatible:
          contains:
            anyOf:
              - const: img,img-bxs-4-64
    then:
      properties:
        power-domains:
          minItems: 2
          maxItems: 2
        power-domain-names:
          items:
            - const: a
            - const: b
  # Vendor integrations using a single clock domain
  - if:
      properties:
        compatible:
          contains:
            anyOf:
              - const: ti,am62-gpu
              - const: ti,j721s2-gpu
    then:
      properties:
        clocks:
          minItems: 1
          maxItems: 1
        clock-names:
          items:
            - const: core

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/soc/ti,sci_pm_domain.h>

    gpu@fd00000 {
        compatible = "ti,am62-gpu", "img,img-axe-1-16m", "img,img-rogue";
        reg = <0x0fd00000 0x20000>;
        clocks = <&k3_clks 187 0>;
        clock-names = "core";
        interrupts = <GIC_SPI 86 IRQ_TYPE_LEVEL_HIGH>;
        power-domains = <&k3_pds 187 TI_SCI_PD_EXCLUSIVE>;
        power-domain-names = "a";
    };
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/soc/ti,sci_pm_domain.h>

    / {
        #address-cells = <2>;
        #size-cells = <2>;
        interrupt-controller;
        #interrupt-cells = <3>;

        gpu@4e20000000 {
            compatible = "ti,j721s2-gpu", "img,img-bxs-4-64", "img,img-rogue";
            reg = /bits/ 64 <0x4e20000000 0x80000>;
            clocks = <&k3_clks 130 1>;
            clock-names = "core";
            interrupts = <GIC_SPI 24 IRQ_TYPE_LEVEL_HIGH>;
            power-domains = <&k3_pds 130 TI_SCI_PD_EXCLUSIVE>,
                            <&k3_pds 373 TI_SCI_PD_EXCLUSIVE>;
            power-domain-names = "a", "b";
            dma-coherent;
        };
    };
