# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/thunderbolt/qcom,usb4-hr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm USB4 Host Router

maintainers:
  - Konrad Dybcio <konrad.dybcio@oss.qualcomm.com>

description:
  The Qualcomm USB4 Host Router IP block implements the NHI standard
  as described in the USB4 specification.

properties:
  compatible:
    items:
      - enum:
          - qcom,x1e80100-usb4-hr # USB4v1
      - const: qcom,usb4-hr

  reg:
    maxItems: 17

  reg-names:
    items:
      - const: router
      - const: router_config
      - const: tmu_config
      - const: port_group
      - const: sideband
      - const: uc_ram
      - const: uc_per
      - const: uc_mbox
      - const: nhi
      - const: cfg
      - const: debug
      - const: usbap_config
      - const: pcieap_config
      - const: dpap0_aux
      - const: dpap0_config
      - const: dpap1_aux
      - const: dpap1_config

  interrupts:
    items:
      - description: Combined event interrupt for all three rings
      - description: OOB Firmware interrupt

  interrupt-names:
    items:
      - const: ring
      - const: fw

  clocks:
    maxItems: 10

  clock-names:
    items:
      - const: sys
      - const: tmu
      - const: ahb
      - const: axi
      - const: master
      - const: phy_rx0
      - const: phy_rx1
      - const: sb
      - const: dp0
      - const: dp1

  resets:
    maxItems: 13

  reset-names:
    items:
      - const: core
      - const: phy_nocsr
      - const: sys
      - const: rx0
      - const: rx1
      - const: usb_pipe
      - const: pcie_pipe
      - const: tmu
      - const: sideband_iface
      - const: hia_master
      - const: ahb
      - const: dp0
      - const: dp1

  power-domains:
    maxItems: 1

  required-opps:
    maxItems: 1

  phys:
    maxItems: 1

  phy-names:
    const: usb4

  iommus:
    maxItems: 1

  interconnects:
    maxItems: 2

  interconnect-names:
    items:
      - const: usb4-ddr
      - const: apps-usb4

  mode-switch: true

  wakeup-source: true

allOf:
  - $ref: /schemas/usb/usb-switch.yaml#

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - phys
  - phy-names
  - iommus
  - interconnects
  - interconnect-names
  - mode-switch
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,x1e80100-gcc.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        usb4_router0: usb4-host-router@15600000 {
            compatible = "qcom,x1e80100-usb4-hr",
                         "qcom,usb4-hr";
            reg = <0x0 0x15600000 0x0 0x8000>,
                  <0x0 0x15608000 0x0 0x70>,
                  <0x0 0x15608070 0x0 0x500>,
                  <0x0 0x1560d000 0x0 0x1000>,
                  <0x0 0x15612000 0x0 0x1000>,
                  <0x0 0x15613000 0x0 0xe000>,
                  <0x0 0x15621000 0x0 0x2000>,
                  <0x0 0x15623000 0x0 0x2000>,
                  <0x0 0x1563f000 0x0 0x40000>,
                  <0x0 0x1567f000 0x0 0x1000>,
                  <0x0 0x15680000 0x0 0x1000>,
                  <0x0 0x15681000 0x0 0x1000>,
                  <0x0 0x15682000 0x0 0x1000>,
                  <0x0 0x15683000 0x0 0x1000>,
                  <0x0 0x15685000 0x0 0x1000>,
                  <0x0 0x15686000 0x0 0x1000>,
                  <0x0 0x15688000 0x0 0x1000>;
            reg-names = "router",
                        "router_config",
                        "tmu_config",
                        "port_group",
                        "sideband",
                        "uc_ram",
                        "uc_per",
                        "uc_mbox",
                        "nhi",
                        "cfg",
                        "debug",
                        "usbap_config",
                        "pcieap_config",
                        "dpap0_aux",
                        "dpap0_config",
                        "dpap1_aux",
                        "dpap1_config";

            interrupts = <GIC_SPI 472 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 579 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "ring",
                              "fw";

            clocks = <&gcc_usb4_0_sys_clk>,
                     <&gcc_usb4_0_tmu_clk>,
                     <&gcc_usb4_0_cfg_ahb_clk>,
                     <&gcc_aggre_usb4_0_axi_clk>,
                     <&gcc_usb4_0_master_clk>,
                     <&gcc_usb4_0_phy_rx0_clk>,
                     <&gcc_usb4_0_phy_rx1_clk>,
                     <&gcc_usb4_0_sb_if_clk>,
                     <&gcc_usb4_0_dp0_clk>,
                     <&gcc_usb4_0_dp1_clk>;
            clock-names = "sys",
                          "tmu",
                          "ahb",
                          "axi",
                          "master",
                          "phy_rx0",
                          "phy_rx1",
                          "sb",
                          "dp0",
                          "dp1";

            resets = <&gcc_usb4_0_bcr>,
                     <&gcc_usb4phy_phy_prim_bcr>,
                     <&gcc_usb4_0_misc_usb4_sys_bcr>,
                     <&gcc_usb4_0_misc_rx_clk_0_bcr>,
                     <&gcc_usb4_0_misc_rx_clk_1_bcr>,
                     <&gcc_usb4_0_misc_usb_pipe_bcr>,
                     <&gcc_usb4_0_misc_pcie_pipe_bcr>,
                     <&gcc_usb4_0_misc_tmu_bcr>,
                     <&gcc_usb4_0_misc_sb_if_bcr>,
                     <&gcc_usb4_0_misc_hia_mstr_bcr>,
                     <&gcc_usb4_0_misc_ahb_bcr>,
                     <&gcc_usb4_0_misc_dp0_max_pclk_bcr>,
                     <&gcc_usb4_0_misc_dp1_max_pclk_bcr>;
            reset-names = "core",
                          "phy_nocsr",
                          "sys",
                          "rx0",
                          "rx1",
                          "usb_pipe",
                          "pcie_pipe",
                          "tmu",
                          "sideband_iface",
                          "hia_master",
                          "ahb",
                          "dp0",
                          "dp1";

            power-domains = <&gcc GCC_USB4_0_GDSC>;

            phys = <&usb4_phy>;
            phy-names = "usb4";

            iommus = <&apps_smmu 0x1440 0x0>;

            interconnects = <&icc0 &icc1>,
                            <&icc2 &icc3>;
            interconnect-names = "usb4-ddr",
                                 "apps-usb4";

            mode-switch;

            port {
                usb4_0_mode_in: endpoint {
                };
            };
        };
    };
...
