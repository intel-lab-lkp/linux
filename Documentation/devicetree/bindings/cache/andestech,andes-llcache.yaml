%YAML 1.2
---
$id: http://devicetree.org/schemas/cache/andestech,llcache.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Andestech Last Level Cache Controller

maintainers:
  - Lad Prabhakar <prabhakar.mahadev-lad.rj@bp.renesas.com>

description:
  A last level cache (LLC) is used to improve the system performance by providing
  a large amount of cache line entries and reasonable access delays. The LLC
  is shared between cores, and a non-inclusive non-exclusive policy is used.

select:
  properties:
    compatible:
      contains:
        enum:
          - andestech,llcache

  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - andestech,qilai-llcache
          - renesas,r9a07g043f-llcache
      - const: andestech,llcache
      - const: cache

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  cache-line-size:
    const: 64

  cache-level:
    const: 2

  cache-sets:
    enum: [1024, 2048]

  cache-size:
    enum: [131072, 262144, 524288, 1048576, 2097152]

  cache-unified: true

  next-level-cache: true

additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - cache-line-size
  - cache-level
  - cache-sets
  - cache-size
  - cache-unified

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: andestech,qilai-llcache

    then:
      properties:
        cache-sets:
          const: 2048
        cache-size:
          const: 2097152
    else:
      properties:
        cache-sets:
          const: 1024

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    cache-controller@13400000 {
        compatible = "renesas,r9a07g043f-llcache", "andestech,llcache",
                     "cache";
        reg = <0x13400000 0x100000>;
        interrupts = <508 IRQ_TYPE_LEVEL_HIGH>;
        cache-line-size = <64>;
        cache-level = <2>;
        cache-sets = <1024>;
        cache-size = <262144>;
        cache-unified;
    };
