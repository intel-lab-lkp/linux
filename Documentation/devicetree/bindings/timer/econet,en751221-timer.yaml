%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/econet,en751221-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: EcoNet EN751221 High Precision Timer (HPT)

maintainers:
  - Caleb James DeLisle <cjd@cjdns.fr>

description:
  The EcoNet High Precision Timer (HPT) is a timer peripheral found in various
  EcoNet SoCs, including the EN751221 and EN751627 families. It provides per-VPE
  count/compare registers and a per-CPU control register. On EN751221 it uses a
  single interrupt line using a percpu-devid interrupt mechanism, and on
  EN751627 it uses an interrupt per VPE.

properties:
  compatible:
    enum:
      - econet,en751221-timer
      - econet,en751627-timer

  reg:
    minItems: 1
    maxItems: 2

  interrupts:
    minItems: 1
    maxItems: 4

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: econet,en751627-timer
    then:
      properties:
        reg:
          items:
            - description: VPE timers 0 and 1
            - description: VPE timers 2 and 3
        interrupts:
          description: An interrupt for each timer (one per VPE)
          minItems: 4
    else:
      properties:
        reg:
          items:
            - description: VPE timers 0 and 1
        interrupts:
          description: A percpu-devid timer interrupt shared across timers
          maxItems: 1

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/mips-gic.h>
    timer@1fbf0400 {
        compatible = "econet,en751627-timer";
        reg = <0x1fbf0400 0x100>, <0x1fbe0000 0x100>;
        interrupt-parent = <&intc>;
        interrupts = <GIC_SHARED 30 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SHARED 29 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SHARED 37 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SHARED 36 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&hpt_clock>;
    };
  - |
    timer@1fbf0400 {
        compatible = "econet,en751221-timer";
        reg = <0x1fbe0400 0x100>;
        interrupt-parent = <&intc>;
        interrupts = <30>;
        clocks = <&hpt_clock>;
    };
...
