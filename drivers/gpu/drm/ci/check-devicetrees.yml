.dt-check-base:
  stage: static-checks
  timeout: "30m"
  variables:
    FF_USE_NEW_BASH_EVAL_STRATEGY: 'true'
    SCHEMA: "display"
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends clang lld llvm python3-pip yamllint
    - pip3 install dtschema
  script:
    - drivers/gpu/drm/ci/${SCRIPT_NAME}
  artifacts:
    when: on_failure
    paths:
      - ${ARTIFACT_FILE}
  allow_failure:
    exit_codes:
      - 102

dtbs-check:arm32:
  extends:
    - .build:arm32
    - .dt-check-base
  variables:
    SCRIPT_NAME: "dtbs-check.sh"
    ARTIFACT_FILE: "dtbs-check.log"

dtbs-check:arm64:
  extends:
    - .build:arm64
    - .dt-check-base
  variables:
    SCRIPT_NAME: "dtbs-check.sh"
    ARTIFACT_FILE: "dtbs-check.log"

dt-binding-check:
  extends:
    - .build
    - .use-debian/x86_64_build
    - .dt-check-base
  variables:
    SCRIPT_NAME: "dt-binding-check.sh"
    ARTIFACT_FILE: "dt-binding-check.log"
